# Publication automatique d'une version de Strata Arkyo dans les Releases du dépôt.
#
# À chaque envoi sur main : si la version de Cargo.toml n'est pas encore publiée, GitHub
# teste, compile et crée la Release vX.Y.Z. Rien à configurer : ni clé, ni secret.
# Les serveurs la trouvent seuls (Administration → Mises à jour, ou `sudo strata upgrade`).
#
# La Release reçoit :
#   strata-X.Y.Z-x86_64          le programme, installé par les serveurs ;
#   strata-arkyo_X.Y.Z_amd64.deb pour une première installation ;
#   SHA256SUMS                   l'empreinte de chaque fichier, vérifiée par les serveurs.
#
# Un numéro avec tiret (ex. 0.3.0-beta.1) est publié en préversion (canal Bêta).

name: Publier une version

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
      pre: ${{ steps.v.outputs.pre }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          case "$VERSION" in *-*) echo "pre=true" >> "$GITHUB_OUTPUT" ;; *) echo "pre=false" >> "$GITHUB_OUTPUT" ;; esac
          if gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "La version $VERSION est déjà publiée : rien à faire."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Nouvelle version $VERSION : publication."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: version
    if: needs.version.outputs.publish == 'true'
    # Ubuntu 22.04 : le programme produit fonctionne sur 22.04 et 24.04.
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Interface web
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --workspace --locked

      - name: Compilation
        run: |
          cargo build --release --locked -p strata
          test "$(target/release/strata version --short)" = "$VERSION"

      - name: Paquet Debian
        run: |
          cargo install cargo-deb --locked
          cargo deb --no-build -p strata

      - name: Fichiers de la version
        run: |
          mkdir dist
          cp target/release/strata "dist/strata-$VERSION-x86_64"
          cp target/debian/*.deb dist/
          (cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS)

      - name: Release GitHub
        run: |
          PRE=""
          [ "${{ needs.version.outputs.pre }}" = "true" ] && PRE="--prerelease"
          gh release create "v$VERSION" dist/* --target "$GITHUB_SHA" \
            --title "Strata Arkyo $VERSION" --generate-notes $PRE
