<title>Strata Arkyo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout : poste d'intégrateur — rail graphite (châssis), plan de travail aluminium, cartouche de plan en tête de projet, étiquettes jaunes pour les repères. */
:root{
  --ground:#E5E7EA; --surface:#FFFFFF; --surface-2:#F3F4F6; --sunken:#E2E5E9; --line:#C9CED5; --line-2:#A9B0B9;
  --fg:#0D1014; --fg-2:#262D35; --fg-3:#545E69;
  --tape:#FFD100; --tape-ink:#111316;
  --primary:#15191E; --primary-fg:#FFFFFF;
  --sel:#0B57D0; --sel-soft:#DCE7FB;
  --rail:#121519; --rail-2:#1C2127; --rail-line:#2A3038; --rail-fg:#F1F3F5; --rail-fg-2:#9EA7B1;
  --ok:#0B7A4E; --ok-soft:#DCF1E6; --warn:#995A00; --warn-soft:#FBEDD3; --err:#C0222F; --err-soft:#FBE0E2; --info:#46525F; --info-soft:#E6E9ED;
  --st-prep:#4B57CF; --st-pret:#08839A; --st-cours:#C85F05; --st-fini:#0B7A4E; --st-annule:#6E7887;
  --sig-v:#245FD6; --sig-a:#0E8550; --sig-l:#B78400; --sig-c:#7A44C9; --sig-p:#C83A2F; --sig-n:#0A8797; --sig-s:#BD3489; --sig-i:#5E6E84; --sig-f:#D06006;
  --rack-metal:#22272E; --rack-rail:#353D48; --rack-hole:#13171C; --rack-text:#EEF1F4; --rack-muted:#95A0AD;
  --paper:#F8F9FA; --grid-minor:#E6E9EC; --grid-major:#D3D8DE;
  --scrim:rgba(10,12,15,.5);
  --shadow:0 1px 0 rgba(13,16,20,.06);
  --shadow-lg:0 20px 50px rgba(13,16,20,.25);
  --font:'Barlow',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --cond:'Barlow Condensed','Arial Narrow',ui-sans-serif,system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ground:#0C0E11; --surface:#16191E; --surface-2:#1C2026; --sunken:#23282F; --line:#2E353E; --line-2:#434C57;
  --fg:#F3F5F7; --fg-2:#CDD3DA; --fg-3:#97A1AC;
  --primary:#FFD100; --primary-fg:#111316;
  --sel:#6AA5FF; --sel-soft:#16294A;
  --rail:#08090B; --rail-2:#15181C; --rail-line:#22272D;
  --ok:#41CC8E; --ok-soft:#0E2B1F; --warn:#F2A93B; --warn-soft:#33240C; --err:#FF6F78; --err-soft:#3A1418; --info:#A3AEBB; --info-soft:#1E242B;
  --st-prep:#8F98FF; --st-pret:#3CC7DA; --st-cours:#FF9A4A; --st-fini:#41CC8E; --st-annule:#8E98A6;
  --sig-v:#6396FF; --sig-a:#3FCB84; --sig-l:#F4C53A; --sig-c:#AE88F5; --sig-p:#FF7468; --sig-n:#35C8D8; --sig-s:#F370C0; --sig-i:#9DABBF; --sig-f:#FF9A4A;
  --rack-metal:#181C21; --rack-rail:#2A313B; --rack-hole:#0B0D10;
  --paper:#111418; --grid-minor:#1A1E23; --grid-major:#252B32;
  --scrim:rgba(0,0,0,.65);
  --shadow:0 1px 0 rgba(0,0,0,.4);
  --shadow-lg:0 20px 50px rgba(0,0,0,.6);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --ground:#0C0E11; --surface:#16191E; --surface-2:#1C2026; --sunken:#23282F; --line:#2E353E; --line-2:#434C57;
  --fg:#F3F5F7; --fg-2:#CDD3DA; --fg-3:#97A1AC;
  --primary:#FFD100; --primary-fg:#111316;
  --sel:#6AA5FF; --sel-soft:#16294A;
  --rail:#08090B; --rail-2:#15181C; --rail-line:#22272D;
  --ok:#41CC8E; --ok-soft:#0E2B1F; --warn:#F2A93B; --warn-soft:#33240C; --err:#FF6F78; --err-soft:#3A1418; --info:#A3AEBB; --info-soft:#1E242B;
  --st-prep:#8F98FF; --st-pret:#3CC7DA; --st-cours:#FF9A4A; --st-fini:#41CC8E; --st-annule:#8E98A6;
  --sig-v:#6396FF; --sig-a:#3FCB84; --sig-l:#F4C53A; --sig-c:#AE88F5; --sig-p:#FF7468; --sig-n:#35C8D8; --sig-s:#F370C0; --sig-i:#9DABBF; --sig-f:#FF9A4A;
  --rack-metal:#181C21; --rack-rail:#2A313B; --rack-hole:#0B0D10;
  --paper:#111418; --grid-minor:#1A1E23; --grid-major:#252B32;
  --scrim:rgba(0,0,0,.65);
  --shadow:0 1px 0 rgba(0,0,0,.4);
  --shadow-lg:0 20px 50px rgba(0,0,0,.6);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%}
body{height:100%;margin:0;background:var(--ground);color:var(--fg);font:500 15px/1.5 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--fg)}
:focus-visible{outline:2.5px solid var(--sel);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font:700 36px/1.05 var(--cond);letter-spacing:.005em}
h2{font:700 17px/1.2 var(--cond);letter-spacing:.07em;text-transform:uppercase}
h3{font:700 19px/1.2 var(--cond);letter-spacing:.01em}
p{margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--fg-3)} .small{font-size:13.5px}
.ic{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:17px;height:17px}
.tape{display:inline-block;font:600 13px/1.35 var(--mono);background:var(--tape);color:var(--tape-ink);padding:2px 7px;border-radius:2px;box-shadow:0 1px 0 rgba(0,0,0,.28),inset 0 -1px 0 rgba(0,0,0,.08);letter-spacing:.02em;white-space:nowrap}
.tape.none{background:var(--warn-soft);color:var(--warn);box-shadow:inset 0 0 0 1px var(--warn)}

/* ---------- Châssis ---------- */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);height:100%}
.sidebar{background:var(--rail);color:var(--rail-fg);display:flex;flex-direction:column;overflow-y:auto;min-height:0;border-right:1px solid var(--rail-line)}
.brand{display:flex;align-items:center;gap:12px;padding:20px 18px 14px}
.brand svg{width:42px;height:30px;flex:none}
.brand b{display:block;font:700 19px/1 var(--cond);letter-spacing:.09em;text-transform:uppercase}
.brand small{display:block;color:var(--rail-fg-2);font-size:12.5px;margin-top:4px}
.nav-label{font:600 12.5px var(--cond);letter-spacing:.14em;text-transform:uppercase;color:var(--rail-fg-2);padding:16px 22px 6px}
.nav{display:flex;flex-direction:column;gap:2px;padding:0 10px}
.nav-item{display:flex;align-items:center;gap:12px;width:100%;padding:9px 12px;border-radius:4px;border:0;background:none;color:var(--rail-fg-2);font-weight:600;text-align:left;font-size:15px}
.nav-item:hover{background:var(--rail-2);color:var(--rail-fg)}
.nav-item.on{background:var(--tape);color:var(--tape-ink);font-weight:700}
.nav-item.soon{opacity:.45}
.nav-item .nt{margin-left:auto;display:inline-flex;opacity:.7}
.nav-item .nt .ic{width:14px;height:14px}
.side-proj{margin:4px 10px 6px;padding:10px 12px;border:1px solid var(--rail-line);border-radius:4px;background:var(--rail-2);display:flex;flex-direction:column;gap:2px}
.side-proj b{font:700 17px/1.15 var(--cond);letter-spacing:.01em}
.side-proj span{font-size:13px;color:var(--rail-fg-2)}
.side-foot{margin-top:auto;padding:14px 16px;border-top:1px solid var(--rail-line);display:flex;align-items:center;gap:10px}
.side-foot b{display:block;font-size:14.5px} .side-foot span{font-size:13px;color:var(--rail-fg-2)}
.sidebar .av{border-color:var(--rail)}
.main{display:flex;flex-direction:column;min-width:0;height:100%;overflow:hidden}
.topbar{display:flex;align-items:center;gap:10px;height:60px;flex:none;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface);position:relative;z-index:20}
.icon-btn.menu-btn{display:none}
.crumbs{display:flex;align-items:center;gap:8px;min-width:0;font-weight:600;color:var(--fg-3);white-space:nowrap;overflow:hidden;font-size:15px}
.crumbs button{border:0;background:none;padding:0;color:var(--fg-3);font-weight:600}
.crumbs button:hover{color:var(--fg);text-decoration:underline}
.crumbs b{color:var(--fg);overflow:hidden;text-overflow:ellipsis;font-weight:700}
.crumbs .ic{width:15px;height:15px}
.top-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.search-btn{display:flex;align-items:center;gap:10px;height:40px;padding:0 8px 0 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);color:var(--fg-3);min-width:250px;font-weight:500}
.search-btn:hover{border-color:var(--line-2);color:var(--fg-2)}
kbd{margin-left:auto;font:600 12px var(--mono);padding:2px 6px;border-radius:3px;border:1px solid var(--line);background:var(--surface);color:var(--fg-3)}
.mode{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 11px;border-radius:4px;font:700 14px var(--cond);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;border:1px solid}
.mode.live{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent);background:var(--ok-soft)}
.mode.live i{width:8px;height:8px;border-radius:50%;background:currentColor;animation:pulse 1.8s infinite}
.mode.design{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent);background:var(--warn-soft)}
.mode .ic{width:15px;height:15px}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,currentColor 55%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.presence{display:flex;padding-left:7px}
.av{width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;font:700 12px var(--font);color:#fff;background:var(--c);border:2px solid var(--surface);flex:none}
.presence .av{margin-left:-7px}
.av.sm{width:24px;height:24px;font-size:10px;border-width:0}
.av.lg{width:38px;height:38px;font-size:13px}
.icon-btn{width:40px;height:40px;display:inline-grid;place-items:center;border-radius:6px;border:1px solid transparent;background:none;color:var(--fg-2);position:relative;flex:none}
.icon-btn:hover{background:var(--surface-2);border-color:var(--line)}
.icon-btn.sm{width:34px;height:34px}
.icon-btn .badge{position:absolute;top:4px;right:4px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--err);color:#fff;font:700 11px var(--font);display:grid;place-items:center;border:2px solid var(--surface)}
#view{flex:1;overflow:auto;padding-block:28px 56px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px));min-height:0}
#view.full{padding:0;overflow:hidden;display:flex;flex-direction:column}
.page{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
.tabbar{display:none}

/* ---------- Composants ---------- */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.page-head>div:first-child{min-width:0}
.eyebrow{font:600 14px var(--cond);color:var(--fg-3);letter-spacing:.12em;text-transform:uppercase;margin-bottom:6px}
.lead{margin-top:8px;color:var(--fg-2);max-width:64ch;font-size:16.5px}
.head-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:6px;border:1px solid var(--line-2);background:var(--surface);font-weight:600;color:var(--fg);white-space:nowrap;font-size:15px}
.btn:hover{background:var(--surface-2);border-color:var(--fg-3)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-fg)}
.btn.primary:hover{filter:brightness(1.15)}
.btn.ghost{background:none;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2);border-color:var(--line)}
.btn.sm{height:34px;padding:0 12px;font-size:14px;gap:6px}
.btn.danger{color:var(--err)}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:20px;min-width:0;box-shadow:var(--shadow)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:-20px -20px 18px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--surface-2);border-radius:6px 6px 0 0;min-height:52px}
.card-head .small{font-size:13.5px}
.chip{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 10px;border-radius:3px;font-size:13.5px;font-weight:600;background:var(--sunken);color:var(--fg-2);white-space:nowrap;border:1px solid transparent}
.chip .dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none;box-shadow:0 0 0 2px color-mix(in srgb,currentColor 22%,transparent)}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.err{background:var(--err-soft);color:var(--err)} .chip.info{background:var(--info-soft);color:var(--info)} .chip.accent{background:var(--sel-soft);color:var(--sel)}
.chip.st{background:var(--surface);border-color:color-mix(in srgb,var(--c) 45%,transparent);color:var(--c);font-weight:700}
.chip .ic{width:14px;height:14px}
.bar{height:8px;border-radius:2px;background:var(--sunken);overflow:hidden;min-width:40px}
.bar>i{display:block;height:100%;background:var(--fg-2);border-radius:inherit;transition:width .4s}
.bar.ok>i{background:var(--ok)} .bar.warn>i{background:var(--warn)} .bar.err>i{background:var(--err)}
.sw{display:inline-block;width:12px;height:12px;border-radius:2px;background:var(--c);flex:none}
.grid-2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;align-items:start}
.seg{display:inline-flex;padding:3px;border-radius:6px;background:var(--surface);border:1px solid var(--line-2);gap:2px;flex:none}
.seg button{border:0;background:none;height:32px;padding:0 13px;border-radius:4px;font-weight:600;color:var(--fg-2);font-size:14.5px;white-space:nowrap}
.seg button:hover{background:var(--surface-2)}
.seg button.on{background:var(--primary);color:var(--primary-fg)}
.seg button.on .muted{color:inherit;opacity:.7}
.seg button[disabled]{opacity:.4;cursor:not-allowed}
.input{height:40px;border:1px solid var(--line-2);border-radius:6px;background:var(--surface);padding:0 12px;min-width:0;width:100%;font-size:15px}
.input:focus{outline:none;border-color:var(--sel);box-shadow:0 0 0 3px var(--sel-soft)}
textarea.input{height:auto;padding:10px 12px;resize:vertical;min-height:80px}
.search{position:relative;flex:1;min-width:200px;max-width:380px}
.search .ic{position:absolute;left:11px;top:10px;color:var(--fg-3)}
.search .input{padding-left:40px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.fchip{height:34px;padding:0 13px;border:1px solid var(--line-2);border-radius:4px;background:var(--surface);font-size:14px;font-weight:600;color:var(--fg-2);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.fchip:hover{border-color:var(--fg-3)}
.fchip.on{border-color:var(--c,var(--primary));background:var(--c,var(--primary));color:#fff}
.fchip.on:not([style]){color:var(--primary-fg)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.flabel{font:600 14px var(--cond);letter-spacing:.08em;text-transform:uppercase;color:var(--fg-2)}
.field .help{font-size:13.5px;color:var(--fg-3)}
.field .help.err{color:var(--err)} .field .help.ok{color:var(--ok)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-grid .span{grid-column:1/-1}
.tbl-wrap{overflow-x:auto;margin:0 -4px}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th{font:600 13.5px var(--cond);text-transform:uppercase;letter-spacing:.09em;color:var(--fg-3);text-align:left;padding:8px 12px;border-bottom:1.5px solid var(--fg-2);white-space:nowrap}
.tbl td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr.click:hover td{background:var(--surface-2)}
.flash,.flash td{animation:flash 2.4s ease-out}
@keyframes flash{0%,35%{background:color-mix(in srgb,var(--tape) 38%,transparent)}100%{background:transparent}}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line-2);border-radius:6px;background:var(--surface)}
.stepper button{width:34px;height:34px;border:0;background:none;color:var(--fg-2);font-weight:700;font-size:18px}
.stepper button:hover{background:var(--surface-2)}
.stepper span{min-width:30px;text-align:center;font:600 15px var(--mono)}
.empty{padding:28px;text-align:center;color:var(--fg-3);border:1px dashed var(--line-2);border-radius:6px}

/* ---------- Accueil ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow)}
.kpi{display:flex;flex-direction:column;gap:8px;padding:18px 22px;border-left:1px solid var(--line);min-width:0}
.kpi:first-child{border-left:0}
.kpi .lbl{font:600 14px var(--cond);letter-spacing:.12em;text-transform:uppercase;color:var(--fg-3)}
.kpi .val{font:700 50px/1 var(--cond);letter-spacing:-.005em;font-variant-numeric:tabular-nums}
.kpi .val small{font-size:22px;color:var(--fg-3);font-weight:600}
.kpi .val.txt{font-size:27px;line-height:1.1}
.kpi .sub{font-size:14px;color:var(--fg-2);display:flex;flex-direction:column;gap:8px}
.up-row{display:grid;grid-template-columns:56px minmax(0,1fr) 140px 64px;gap:16px;align-items:center;padding:12px 6px;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:left}
.up-row:first-child{border-top:0}
.up-row:hover{background:var(--surface-2)}
.up-main{display:flex;flex-direction:column;min-width:0}
.up-main b{font:700 19px/1.2 var(--cond);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.up-main span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.up-compl{display:flex;flex-direction:column;gap:6px}
.up-row .chip{justify-content:center}
.date-tile{border:1.5px solid var(--fg-2);border-radius:3px;text-align:center;padding:3px 0;background:var(--surface)}
.date-tile b{display:block;font:700 24px/1 var(--cond)}
.date-tile span{font:600 12px var(--cond);text-transform:uppercase;color:var(--fg-3);letter-spacing:.1em}
.feed{display:flex;flex-direction:column}
.feed-item{display:flex;gap:12px;padding:11px 6px;border-top:1px solid var(--line);align-items:flex-start}
.feed-item:first-child{border-top:0}
.feed-item p{font-size:14.5px;color:var(--fg-2)} .feed-item p b{color:var(--fg);font-weight:700}
.feed-item time{font-size:13px;color:var(--fg-3)}
.stackbar{display:flex;height:16px;border-radius:2px;overflow:hidden;gap:2px}
.stackbar i{display:block;background:var(--c)}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px 22px;margin-top:16px}
.legend div{display:flex;align-items:center;gap:10px;font-size:15px}
.legend b{margin-left:auto;font:600 14px var(--mono)}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.qtile{display:flex;align-items:center;gap:14px;padding:16px;border:1px solid var(--line);border-radius:6px;background:var(--surface);text-align:left}
.qtile:hover{border-color:var(--fg-3)}
.qtile .qi{width:44px;height:44px;border-radius:4px;background:var(--rail);color:var(--tape);display:grid;place-items:center;flex:none}
.qtile b{display:block;font:700 19px var(--cond)} .qtile span{font-size:13.5px;color:var(--fg-3)}

/* ---------- Projets ---------- */
.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.proj-card{display:flex;flex-direction:column;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px;box-shadow:var(--shadow)}
.proj-card:hover{border-color:var(--fg-3)}
.proj-card h3{font-size:22px}
.pc-top{display:flex;align-items:center;gap:6px;justify-content:space-between}
.pc-meta{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--fg-3);border-top:1px solid var(--line);padding-top:12px}
.pc-meta b{color:var(--fg);font-weight:700}
.pc-compl{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13.5px;color:var(--fg-3)}
.group-h{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
.group-h .count{font:600 15px var(--mono);color:var(--fg-3)}

/* ---------- Cartouche de projet ---------- */
.cartouche{display:grid;grid-template-columns:minmax(0,2.4fr) minmax(0,1.5fr) minmax(0,1.3fr) minmax(0,1fr) minmax(0,1.2fr);border:2px solid var(--fg);background:var(--surface);border-radius:2px}
.cartouche>div{padding:9px 14px;border-left:1px solid var(--fg-3);min-width:0;display:flex;flex-direction:column;justify-content:center;gap:2px}
.cartouche>div:first-child{border-left:0}
.ct-l{font:600 12.5px var(--cond);letter-spacing:.14em;text-transform:uppercase;color:var(--fg-3)}
.ct-v{font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ct-name{font:700 28px/1.05 var(--cond)}
.jx{font:600 13px var(--mono);color:var(--err);letter-spacing:0}
.st-select{display:inline-flex;align-items:center;gap:8px;color:var(--c);font-weight:700}
.st-select .dot{width:10px;height:10px;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px color-mix(in srgb,currentColor 22%,transparent)}
.st-select select{border:1px solid var(--line-2);border-radius:4px;background:var(--surface);color:inherit;font-weight:700;height:34px;cursor:pointer;padding:0 6px;font-size:15px}
.st-select select option{color:var(--fg);background:var(--surface)}
.subnav{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
.subnav::-webkit-scrollbar{display:none}
.subnav button{border:0;background:none;padding:11px 14px;font:600 16px var(--cond);letter-spacing:.07em;text-transform:uppercase;color:var(--fg-3);border-bottom:3px solid transparent;white-space:nowrap;display:flex;gap:8px;align-items:center;margin-bottom:-1px}
.subnav button:hover{color:var(--fg)}
.subnav button.on{color:var(--fg);border-color:var(--primary)}
.subnav button.soon{opacity:.45}
.subnav .dz{display:inline-flex;color:var(--warn)}
.subnav .dz .ic{width:13px;height:13px}
.dom{display:grid;grid-template-columns:130px minmax(0,1fr) 56px;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.dom:first-child{border-top:0;padding-top:0}
.dom b{font:700 18px var(--cond)}
.dom .d-sub{grid-column:2/4;margin-top:-6px;font-size:13.5px;color:var(--fg-3)}
.dom .pct{text-align:right;font:600 15px var(--mono)}
.todos{display:flex;flex-direction:column;gap:8px}
.todo{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:6px;border:1px solid var(--line);background:var(--surface);text-align:left;width:100%}
.todo:hover{border-color:var(--fg-3)}
.todo .ti{width:34px;height:34px;border-radius:4px;display:grid;place-items:center;flex:none}
.todo .ti.err{background:var(--err);color:#fff} .todo .ti.warn{background:var(--warn-soft);color:var(--warn)} .todo .ti.info{background:var(--info-soft);color:var(--info)}
.todo b{display:block;font-size:15.5px} .todo span{font-size:13.5px;color:var(--fg-3)}
.todo>.ic:last-child{margin-left:auto;color:var(--fg-3)}
.online{display:flex;flex-direction:column;gap:12px}
.online div{display:flex;align-items:center;gap:12px}
.online b{display:block;font-size:15px} .online span{font-size:13.5px;color:var(--fg-3)}
.task-st{border:0;cursor:pointer}

/* ---------- Inventaire ---------- */
.inv{display:grid;grid-template-columns:280px minmax(0,1fr);gap:20px;align-items:start}
.loc-list{display:flex;flex-direction:column;gap:4px;padding:20px 12px 12px}
.loc-list .card-head{margin:-20px -12px 10px;padding:12px 16px}
.loc{display:flex;align-items:center;gap:12px;padding:10px;border-radius:4px;border:1px solid transparent;background:none;text-align:left;width:100%}
.loc:hover{background:var(--surface-2)}
.loc.on{background:var(--surface-2);border-color:var(--fg-2)}
.loc .code{font:600 13px var(--mono);padding:3px 6px;border-radius:2px;background:var(--sunken);color:var(--fg-2);min-width:46px;text-align:center}
.loc.on .code{background:var(--tape);color:var(--tape-ink)}
.loc .ln{display:flex;flex-direction:column;min-width:0}
.loc b{font-size:15.5px}
.hint{padding:10px 6px 2px}
.inv-main{display:flex;flex-direction:column;gap:20px;min-width:0}
.cont-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.cont{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;box-shadow:var(--shadow)}
.cont:hover{border-color:var(--fg-3)}
.cont.on{border:2px solid var(--fg);padding:15px}
.cont-top{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:2px}
.cont-name{font:700 21px/1.15 var(--cond)}
.meters{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.meter{display:grid;grid-template-columns:66px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13.5px;color:var(--fg-3)}
.meter .mono{font-size:13px;color:var(--fg-2)}
.meter.err .mono{color:var(--err);font-weight:600}
.art-name{display:flex;align-items:center;gap:12px;min-width:0}
.art-name b{font-weight:700}
.art-name .small{display:block}

/* ---------- Écrans de conception ---------- */
.design-top{flex:none;background:var(--surface);border-bottom:1px solid var(--line)}
.design-top .subnav{border-bottom:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.lockbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:9px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-size:14.5px;border-top:1px solid var(--line)}
.lockbar.mine{background:var(--rail);color:var(--rail-fg)}
.lockbar.mine .btn{background:var(--rail-2);border-color:var(--rail-line);color:var(--rail-fg)}
.lockbar.mine .btn:hover{border-color:var(--rail-fg-2)}
.lockbar.mine .lk>.ic{color:var(--tape)}
.lockbar.other{background:var(--warn-soft);color:var(--fg)}
.lockbar .ic{width:18px;height:18px}
.lockbar .lk{display:inline-flex;align-items:center;gap:10px;min-width:0}
.lockbar .sp{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.saved{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;color:var(--rail-fg-2);font-weight:600}
.saved i{width:8px;height:8px;border-radius:50%;background:#41CC8E}
.dtool{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-top:1px solid var(--line)}
.dtool .meter{grid-template-columns:auto 96px auto;font-size:13.5px}
.dtool .gap{flex:1}
.dtool select.input{height:36px}
.design-body{flex:1;min-height:0;display:grid;grid-template-columns:270px minmax(0,1fr) 330px}
.design-body.two{grid-template-columns:minmax(0,1fr) 340px}
.pane{background:var(--surface);overflow:auto;padding:18px;display:flex;flex-direction:column;gap:20px;min-height:0}
.pane.left{border-right:1px solid var(--line)}
.pane.right{border-left:1px solid var(--line)}
.pane h2{font-size:15px;color:var(--fg-2);border-bottom:1.5px solid var(--fg-2);padding-bottom:6px}
.pane section{display:flex;flex-direction:column;gap:10px}
.pend{display:flex;align-items:center;gap:10px;padding:11px;border:1px solid var(--line-2);border-radius:6px;background:var(--surface);cursor:grab;text-align:left;width:100%}
.pend:hover{border-color:var(--fg-3)}
.pend.on{border:2px solid var(--fg);padding:10px;background:color-mix(in srgb,var(--tape) 22%,var(--surface))}
.pend .ph{font:600 12.5px var(--mono);padding:2px 6px;border-radius:2px;background:var(--rail);color:var(--rail-fg);flex:none}
.pend b{display:block;font-size:15px} .pend span{font-size:13px;color:var(--fg-3)}
.ro .pend{cursor:default}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 14px;font-size:15px;margin:0}
.kv dt{color:var(--fg-3);font-weight:500}
.kv dd{margin:0;font-weight:700;text-align:right;font-variant-numeric:tabular-nums;min-width:0;overflow-wrap:anywhere}
.alert{display:flex;gap:10px;padding:11px 13px;border-radius:6px;font-size:14px;align-items:flex-start;border:1px solid transparent}
.alert.warn{background:var(--warn-soft);color:var(--fg);border-color:color-mix(in srgb,var(--warn) 40%,transparent)} .alert.warn>.ic{color:var(--warn)}
.alert.err{background:var(--err-soft);color:var(--fg);border-color:color-mix(in srgb,var(--err) 40%,transparent)} .alert.err>.ic{color:var(--err)}
.alert.info{background:var(--surface-2);color:var(--fg-2);border-color:var(--line)}
.alert .ic{width:18px;height:18px;margin-top:1px}

/* Rack */
.rack-stage{overflow:auto;background-color:var(--paper);background-image:linear-gradient(var(--grid-major) 1px,transparent 1px),linear-gradient(90deg,var(--grid-major) 1px,transparent 1px),linear-gradient(var(--grid-minor) 1px,transparent 1px),linear-gradient(90deg,var(--grid-minor) 1px,transparent 1px);background-size:100px 100px,100px 100px,20px 20px,20px 20px;display:flex;justify-content:center;align-items:flex-start;padding:28px 16px;min-height:0}
.rack-wrap{display:flex;flex-direction:column;align-items:center;gap:12px}
.rack-title{font:700 17px var(--cond);letter-spacing:.07em;text-transform:uppercase;color:var(--fg);display:flex;gap:8px;align-items:center;background:var(--surface);border:1.5px solid var(--fg);padding:4px 12px;border-radius:2px}
.rack{--u:21px;display:grid;grid-template-columns:30px auto 30px;background:var(--rack-metal);border-radius:8px;padding:16px 4px;box-shadow:0 14px 34px rgba(10,14,20,.28),inset 0 0 0 1px rgba(255,255,255,.06)}
.rack-scale{display:flex;flex-direction:column;font:500 11px/1 var(--mono);color:var(--rack-muted);text-align:center}
.rack-scale span{height:var(--u);display:grid;place-items:center}
.rack-body{position:relative;width:420px;height:calc(var(--units) * var(--u));background:repeating-linear-gradient(to top,var(--rack-hole) 0 1px,#1B2027 1px var(--u));border-left:8px solid var(--rack-rail);border-right:8px solid var(--rack-rail)}
.rack-body::before,.rack-body::after{content:"";position:absolute;top:0;bottom:0;width:8px;background:repeating-linear-gradient(to top,transparent 0 6px,#090B0E 6px 10px,transparent 10px var(--u))}
.rack-body::before{left:-8px} .rack-body::after{right:-8px}
.slot{position:absolute;left:0;right:0;height:var(--u)}
.placing .slot:hover{background:rgba(255,209,0,.3);cursor:copy}
.ritem{position:absolute;border-radius:2px;display:flex;align-items:center;gap:9px;padding:0 10px;font:600 13.5px var(--font);color:var(--rack-text);background:linear-gradient(180deg,#3E4652,#2D343E);border:1px solid #56606E;overflow:hidden;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.08);white-space:nowrap}
.ritem:hover{border-color:#8A97A8}
.ritem .led{width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 7px var(--c);flex:none}
.ritem .rn{overflow:hidden;text-overflow:ellipsis;min-width:0}
.ritem .rr{margin-left:auto;font:600 11px var(--mono);flex:none;background:var(--tape);color:var(--tape-ink);padding:0 4px;border-radius:1px}
.ritem::after{content:"";position:absolute;right:66px;top:24%;bottom:24%;width:46px;background:repeating-linear-gradient(90deg,rgba(0,0,0,.4) 0 2px,transparent 2px 5px);opacity:.7;pointer-events:none}
.ritem.half::after,.ritem.acc::after{display:none}
.ritem.acc{background:repeating-radial-gradient(circle at 50% 50%,#1E242B 0 1.3px,#2C333C 1.5px 4px);color:var(--rack-muted);font-weight:500}
.ritem.panel{background:linear-gradient(180deg,#323942,#272D35)}
.ritem.panel::after{right:70px;width:auto;left:130px;background:repeating-linear-gradient(90deg,#0F1216 0 7px,transparent 7px 12px);opacity:.9;top:30%;bottom:30%;border-radius:2px}
.ritem.sel{outline:3px solid var(--tape);outline-offset:1px;z-index:2}
.ritem.dw .rn::after{content:"  ⚠";color:#F2A93B}
.schem .ritem{background:color-mix(in srgb,var(--c) 38%,#1C2229);border-color:var(--c)}
.schem .ritem::after{display:none}
.schem .ritem.acc{background:#2A3039;border-color:#4D5664}
.rghost{position:absolute;left:2px;right:2px;border:2px dashed var(--tape);background:rgba(255,209,0,.18);border-radius:2px;pointer-events:none;z-index:3}
.side-body{position:relative;height:calc(var(--units) * var(--u));width:var(--w);background:repeating-linear-gradient(to top,#171B21 0 1px,#1E242B 1px var(--u));border-left:4px solid #5A6577;border-right:4px solid #3A4250}
.sbar{position:absolute;left:0;height:calc(var(--u) - 3px);border-radius:1px;background:color-mix(in srgb,var(--c) 60%,#20262F)}
.sres{position:absolute;height:calc(var(--u) - 3px);background:repeating-linear-gradient(45deg,rgba(255,255,255,.2) 0 3px,transparent 3px 7px)}
.sres.over{background:repeating-linear-gradient(45deg,rgba(255,111,120,.8) 0 3px,transparent 3px 7px)}
.side-legend{display:flex;justify-content:space-between;font:500 11px var(--mono);color:var(--rack-muted);margin-top:8px}

/* Synoptique */
.syn-wrap{position:relative;min-height:0;background:var(--paper);overflow:hidden;touch-action:none}
#syn{width:100%;height:100%;display:block;cursor:grab;user-select:none;-webkit-user-select:none}
#syn.panning{cursor:grabbing}
#syn .gmin{stroke:var(--grid-minor);stroke-width:1;fill:none}
#syn .gmaj{stroke:var(--grid-major);stroke-width:1;fill:none}
.node .box{fill:var(--surface);stroke:var(--fg-3);stroke-width:1.2}
.node .hdr{fill:var(--rail)}
.node .nt{font:700 16px var(--cond);fill:#F3F5F7;letter-spacing:.02em}
.node .ns{font:500 11.5px var(--mono);fill:#A3ADB8}
.node .drag{cursor:move}
.ro .node .drag{cursor:default}
.node.sel .box{stroke:var(--sel);stroke-width:3}
.node.hl .box{stroke:var(--err);stroke-width:3}
.node.hl.info .box{stroke:var(--info)}
.port circle{fill:var(--surface);stroke:var(--c);stroke-width:2.5;cursor:crosshair}
.port:hover circle,.port.used circle{fill:var(--c)}
.port.armed circle{fill:var(--tape);stroke:var(--fg);stroke-width:3}
.ro .port circle{cursor:default}
.port text{font:600 13px var(--font);fill:var(--fg-2);pointer-events:none}
.cable .vis{fill:none;stroke:var(--c);stroke-width:2.5;stroke-linejoin:round}
.cable .hit{fill:none;stroke:transparent;stroke-width:16;cursor:pointer}
.cable.sel .vis{stroke-width:4.5}
.cable.hl .vis{stroke:var(--err);stroke-dasharray:8 5;stroke-width:3.5}
.cable.warnc .vis{stroke-dasharray:5 4}
.cable .lbl rect{fill:var(--tape);stroke:rgba(0,0,0,.35);stroke-width:.8}
.cable .lbl text{font:600 11.5px var(--mono);fill:var(--tape-ink)}
.cable .lbl.none rect{fill:var(--surface);stroke:var(--warn);stroke-width:1.5}
.cable .lbl.none text{fill:var(--warn)}
.cable.sel .lbl rect{stroke:var(--fg);stroke-width:2}
.cable.off{display:none}
#preview{fill:none;stroke:var(--fg);stroke-width:2.5;stroke-dasharray:7 5;pointer-events:none}
.floatbar{position:absolute;left:max(14px,env(safe-area-inset-left,0px));bottom:14px;display:flex;gap:2px;align-items:center;background:var(--surface);border:1px solid var(--line-2);border-radius:6px;padding:4px;box-shadow:var(--shadow-lg)}
.floatbar .zl{font:600 13px var(--mono);min-width:52px;text-align:center;color:var(--fg-2)}
.synhint{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--line-2);border-radius:4px;padding:7px 14px;font-size:14px;font-weight:600;color:var(--fg-2);box-shadow:var(--shadow-lg);white-space:nowrap;max-width:calc(100% - 28px);overflow:hidden;text-overflow:ellipsis}
.synhint.armed{background:var(--tape);color:var(--tape-ink);border-color:var(--tape)}
.vcounts{display:flex;gap:6px;flex-wrap:wrap}
.vitem{display:flex;gap:10px;padding:9px 10px;border-radius:4px;cursor:pointer;border:1px solid transparent;background:none;text-align:left;width:100%;align-items:flex-start}
.vitem:hover{background:var(--surface-2)}
.vitem.on{border-color:var(--fg-2);background:var(--surface-2)}
.vitem .ic{width:18px;height:18px;margin-top:2px}
.vitem.err .ic{color:var(--err)} .vitem.warn .ic{color:var(--warn)} .vitem.info .ic{color:var(--info)}
.vitem b{display:block;font-size:15px} .vitem span{font-size:13.5px;color:var(--fg-3)}
.layer{display:flex;align-items:center;gap:10px;font-size:15px;padding:4px 0;cursor:pointer}
.layer input{accent-color:var(--fg);width:18px;height:18px}
.layer b{margin-left:auto;font:600 14px var(--mono);color:var(--fg-3)}
.insp-num{display:flex;gap:8px;align-items:center}
.insp-num .input{font-family:var(--mono);font-weight:600;background:var(--tape);color:var(--tape-ink);border-color:rgba(0,0,0,.3)}
.insp-num .input::placeholder{color:rgba(17,19,22,.55)}
.ends{display:flex;flex-direction:column;gap:6px;font-size:15px}
.ends div{display:grid;grid-template-columns:48px minmax(0,1fr);gap:8px}
.ends span{color:var(--fg-3)}

/* ---------- Recette ---------- */
.rc-head{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:center}
.ring{width:132px;height:132px;border-radius:50%;display:grid;place-items:center;position:relative}
.ring::before{content:"";position:absolute;inset:14px;border-radius:50%;background:var(--surface)}
.ring div{position:relative;text-align:center}
.ring b{display:block;font:700 38px/1 var(--cond)}
.ring span{font:600 12.5px var(--cond);color:var(--fg-3);letter-spacing:.1em;text-transform:uppercase}
.rc-counts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:6px}
.rc-count{padding:12px 16px;border-left:1px solid var(--line)}
.rc-count:first-child{border-left:0}
.rc-count span{font:600 14px var(--cond);letter-spacing:.1em;text-transform:uppercase;color:var(--fg-3);display:flex;align-items:center;gap:8px}
.rc-count b{display:block;font:700 36px/1.1 var(--cond);font-variant-numeric:tabular-nums}
.rc-group{padding:0;overflow:hidden}
.rc-group>header{display:flex;align-items:center;gap:10px;padding:12px 18px;background:var(--surface-2);border-bottom:1.5px solid var(--fg-2)}
.rc-group>header b{font:700 17px var(--cond);letter-spacing:.07em;text-transform:uppercase}
.rc-group>header .muted{margin-left:auto;font-family:var(--mono);font-size:13.5px}
.rc-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;padding:13px 18px;border-top:1px solid var(--line);align-items:center}
.rc-group>header+.rc-row{border-top:0}
.rc-main{display:flex;gap:12px;align-items:flex-start;min-width:0}
.rc-main .sw{margin-top:6px}
.rc-main b{font-weight:700}
.rc-main .path{color:var(--fg-2);font-size:15px;overflow-wrap:anywhere}
.rc-by{display:flex;align-items:center;gap:6px;margin-top:5px;font-size:13.5px;color:var(--fg-3);flex-wrap:wrap}
.stseg{display:inline-flex;border:1px solid var(--line-2);border-radius:6px;overflow:hidden;background:var(--surface)}
.stseg button{border:0;background:none;height:36px;padding:0 12px;font-size:14px;font-weight:700;color:var(--fg-3);border-left:1px solid var(--line-2);white-space:nowrap}
.stseg button:first-child{border-left:0}
.stseg button:hover{color:var(--fg);background:var(--surface-2)}
.stseg button.on.todo{background:var(--fg-2);color:var(--surface)}
.stseg button.on.ok{background:var(--ok);color:#fff}
.stseg button.on.res{background:var(--warn);color:#fff}
.stseg button.on.ko{background:var(--err);color:#fff}
.rc-comment{grid-column:1/-1;display:flex;flex-direction:column;gap:8px}
.rc-comment div{display:flex;gap:8px;justify-content:flex-end}

/* ---------- Catalogue ---------- */

const same=(a,b)=>a[0]===b[0]&&a[1]===b[1]&&a[2]===b[2];
function cPath(c){
 const[x1,y1]=pPos(c.a),[x2,y2]=pPos(c.b);
 if(c.a[1]==='o'&&c.b[1]==='i'&&x2>x1+50){const mx=Math.round(x1+Math.max(100,(x2-x1)*.62)+((c.id%5)-2)*4);return{d:`M${x1} ${y1}H${mx}V${y2}H${x2}`,lx:x1+8,ly:y1,left:true}}

 return{d:`M${x1} ${y1}H${x1+d1}V${ym}H${x2+d2}V${y2}H${x2}`,lx:(x1+d1+x2+d2)/2,ly:ym};

 SYN.cables.forEach(c=>{const a=portSig(c.a),b=portSig(c.b);if(a!==b)out.push({sev:'err',t:'Incompatibilité',d:`${c.num||'Sans numéro'} : ${SIG[a].n} → ${SIG[b].n}`,cables:[c.id]})});

function applyView(){$('#world').setAttribute('transform',`translate(${SYN.x},${SYN.y}) scale(${SYN.k})`);$('#zl').textContent=Math.round(SYN.k*100)+' %'}
function fitSyn(){
 const w=$('#synWrap');if(!w)return;const W=w.clientWidth,H=w.clientHeight;
 let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;SYN.nodes.forEach(n=>{x0=Math.min(x0,n.x-20);y0=Math.min(y0,n.y-20);x1=Math.max(x1,n.x+NW+20);y1=Math.max(y1,n.y+nodeH(n)+60)});
 SYN.userMoved=true;SYN.k=Math.max(.3,Math.min(1.2,Math.min(W/(x1-x0),(H-50)/(y1-y0))*.95));
 SYN.x=(W-(x1-x0)*SYN.k)/2-x0*SYN.k;SYN.y=40+((H-50)-(y1-y0)*SYN.k)/2-y0*SYN.k;applyView();
}
function zoomAt(f,cx,cy){SYN.userMoved=true;const k2=Math.max(.25,Math.min(2.5,SYN.k*f));SYN.x=cx-(cx-SYN.x)*(k2/SYN.k);SYN.y=cy-(cy-SYN.y)*(k2/SYN.k);SYN.k=k2;applyView()}
function setHint(){const h=$('#synHint');if(!h)return;if(SYN.pend){h.className='synhint armed';h.textContent=`Depuis ${pName(SYN.pend)} : touchez le port d’arrivée (Échap pour annuler)`}else{h.className='synhint';h.textContent=editable()?'Touchez un port de sortie, puis un port d’entrée pour tirer un câble':'Lecture seule : naviguez et inspectez'}}
function nextNum(code,L){let m=0;const re=new RegExp('^'+code+'-'+L+'2(\\d{4})$');SYN.cables.forEach(c=>{const r=re.exec(c.num||'');if(r)m=Math.max(m,+r[1])});return `${code}-${L}2${String(m+1).padStart(4,'0')}`}
function finishCable(b){
 let a=SYN.pend;SYN.pend=null;$('#preview')&&$('#preview').setAttribute('d','');
 if(same(a,b)){synDraw();setHint();return}
 if(a[1]==='i'&&b[1]==='o')[a,b]=[b,a];
 const w=[];if(a[1]===b[1])w.push(a[1]==='o'?'deux sorties reliées':'deux entrées reliées');
 const sa=portSig(a),sb=portSig(b);if(sa!==sb)w.push(`signaux différents (${SIG[sa].n} → ${SIG[sb].n})`);
 const rem=SYN.cables.filter(c=>same(c.a,a)||same(c.b,a)||same(c.a,b)||same(c.b,b));
 SYN.cables=SYN.cables.filter(c=>!rem.includes(c));
 const c={id:SYN.nextId++,a,b,num:'',model:''};SYN.cables.push(c);SYN.sel={t:'c',id:c.id};SYN.hl=null;
 synAll();setHint();
 if(rem.length)toast(`Le port était occupé : ${rem.map(r=>r.num||'câble sans numéro').join(', ')} remplacé.`,'info');
 if(w.length)toast('Câble tracé avec avertissement : '+w.join(', ')+'.','warn');else toast(`Câble tracé : ${esc(pName(a))} → ${esc(pName(b))}`);
}
function mountSyn(){
 const svg=$('#syn'),wrap=$('#synWrap');let drag=null;
 const toW=e=>{const r=svg.getBoundingClientRect();return[(e.clientX-r.left-SYN.x)/SYN.k,(e.clientY-r.top-SYN.y)/SYN.k]};
 const parse=s=>{const p=s.split(':');return[p[0],p[1],+p[2]]};
 const prev=e=>{if(!SYN.pend)return;const[x1,y1]=pPos(SYN.pend),[x2,y2]=toW(e);$('#preview').setAttribute('d',`M${x1} ${y1}L${x2} ${y2}`)};
 svg.addEventListener('pointerdown',e=>{
  const port=e.target.closest('[data-port]'),dn=e.target.closest('.drag'),cab=e.target.closest('[data-cable]'),nd=e.target.closest('[data-node]');
  if(port&&editable()){
   e.preventDefault();const p=parse(port.dataset.port);
   if(SYN.pend){finishCable(p);return}
   SYN.pend=p;drag={t:'cable',start:p,sx:e.clientX,sy:e.clientY,moved:false};svg.setPointerCapture(e.pointerId);synDraw();prev(e);setHint();return;
  }
  if(dn&&nd){const n=node(nd.dataset.node);SYN.sel={t:'n',id:n.id};const[wx,wy]=toW(e);if(editable())drag={t:'node',n,ox:wx-n.x,oy:wy-n.y};svg.setPointerCapture(e.pointerId);synDraw();return}
  if(cab){SYN.sel={t:'c',id:+cab.dataset.cable};synAll();return}
  drag={t:'pan',sx:e.clientX,sy:e.clientY,vx:SYN.x,vy:SYN.y,moved:false};svg.setPointerCapture(e.pointerId);svg.classList.add('panning');
 });
 svg.addEventListener('pointermove',e=>{
  if(SYN.pend)prev(e);
  if(!drag)return;
  if(drag.t==='pan'){const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;if(Math.abs(dx)+Math.abs(dy)>3){drag.moved=true;SYN.userMoved=true}SYN.x=drag.vx+dx;SYN.y=drag.vy+dy;applyView()}
  else if(drag.t==='node'){const[wx,wy]=toW(e);drag.n.x=Math.round((wx-drag.ox)/10)*10;drag.n.y=Math.round((wy-drag.oy)/10)*10;synDraw()}
  else if(drag.t==='cable'&&Math.abs(e.clientX-drag.sx)+Math.abs(e.clientY-drag.sy)>6)drag.moved=true;
 });
 svg.addEventListener('pointerup',e=>{
  svg.classList.remove('panning');if(!drag)return;const d=drag;drag=null;
  if(d.t==='cable'){const el=document.elementFromPoint(e.clientX,e.clientY);const p=el&&el.closest&&el.closest('[data-port]');if(p&&p.dataset.port!==d.start.join(':'))finishCable(parse(p.dataset.port));else if(d.moved){SYN.pend=null;$('#preview').setAttribute('d','');synDraw();setHint()}}
  else if(d.t==='pan'&&!d.moved){if(SYN.pend){SYN.pend=null;$('#preview').setAttribute('d','');setHint()}if(SYN.sel||SYN.hl){SYN.sel=null;SYN.hl=null;synAll()}}
  else if(d.t==='node')$('#synSide').innerHTML=synSide();
 });
 svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect();zoomAt(Math.exp(-e.deltaY*.0016),e.clientX-r.left,e.clientY-r.top)},{passive:false});
 wrap.addEventListener('click',e=>{const z=e.target.closest('[data-z]');if(z){zoomAt(+z.dataset.z>0?1.2:1/1.2,wrap.clientWidth/2,wrap.clientHeight/2)}});
 $('#synSide').addEventListener('click',e=>{
  const vi=e.target.closest('[data-vi]');
  if(vi){const v=validate()[+vi.dataset.vi];SYN.hl={...v,i:+vi.dataset.vi};SYN.sel=v.cables&&v.cables.length===1?{t:'c',id:v.cables[0]}:null;synAll();
   const ids=v.nodes||[];const ns=v.cables?SYN.cables.filter(c=>v.cables.includes(c.id)).map(c=>c.a[0]):ids;const n=node(ns[0]);if(n){SYN.x=wrap.clientWidth/2-(n.x+NW)*SYN.k;SYN.y=wrap.clientHeight/2-(n.y+40)*SYN.k;applyView()}}
 });
 $('#synSide').addEventListener('change',e=>{
  const l=e.target.closest('[data-layer]');if(l){l.checked?SYN.hidden.delete(l.dataset.layer):SYN.hidden.add(l.dataset.layer);synDraw();return}
  const c=SYN.sel&&SYN.cables.find(x=>x.id===SYN.sel.id);if(!c)return;
  if(e.target.id==='cnum'){c.num=e.target.value.trim().toUpperCase();synAll();toast('Numéro enregistré')}
  if(e.target.id==='cmodel'){c.model=e.target.value;$('#synSide').innerHTML=synSide()}
 });
 requestAnimationFrame(()=>{if(SYN.userMoved)return applyView();const w=$('#synWrap').clientWidth;SYN.k=w<700?.72:1;SYN.x=16;SYN.y=64;applyView()});
}

function openPalette(){PAL={q:'',i:0,items:palItems()};$('#modal').hidden=false;$('#dialog').innerHTML=`<div class="pal-in">${ic('search')}<input id="palIn" placeholder="Rechercher un projet, un équipement, un câble, une action…" autocomplete="off" aria-label="Recherche"><kbd>Échap</kbd></div><div class="pal-list" id="palList"></div><div class="pal-foot"><span>↑ ↓ pour naviguer</span><span>Entrée pour ouvrir</span></div>`;palDraw();$('#palIn').focus()}
function palFiltered(){const q=norm(PAL.q);return PAL.items.filter(x=>!q||norm(x.t+' '+x.k).includes(q)).slice(0,9)}
function palDraw(){const l=palFiltered();PAL.i=Math.min(PAL.i,Math.max(0,l.length-1));$('#palList').innerHTML=l.map((x,j)=>`<button class="pal-item ${j===PAL.i?'on':''}" data-pi="${j}">${ic(x.i)}<span>${esc(x.t)}</span><span class="k">${x.k}</span></button>`).join('')||'<div class="empty" style="margin:8px">Aucun résultat.</div>'}

/* ================= Overlays ================= */
function openDrawer(html){const d=$('#drawer');d.innerHTML=html;d.classList.add('open');d.setAttribute('aria-hidden','false');$('#scrim').classList.add('open')}
function closeDrawer(){const d=$('#drawer');d.classList.remove('open');d.setAttribute('aria-hidden','true');if(!$('#sidebar').classList.contains('open'))$('#scrim').classList.remove('open')}
function closeModal(){$('#modal').hidden=true;$('#dialog').innerHTML=''}
function closeAll(){closeDrawer();closeModal();$('#notifs').hidden=true;$('#sidebar').classList.remove('open');$('#scrim').classList.remove('open')}
function openWizard(){closeAll();wzReset();$('#modal').hidden=false;wzRender()}
function openProj(id){if(id===1)return go('projet');const p=PROJ.find(x=>x.id===id);toast(`Dans cette maquette, seul « ${esc(P.nom)} » est détaillé. « ${esc(p.nom)} » ouvrira sa propre fiche.`,'info')}
function notifs(){
 const n=$('#notifs');if(!n.hidden){n.hidden=true;return}
 n.innerHTML=`<header><h2>Notifications</h2><button class="btn sm ghost" data-act="readall">Tout marquer comme lu</button></header>${NOTIFS.map((x,i)=>`<button class="notif ${x.un?'unread':''}" data-ni="${i}" style="width:100%;border:0;border-bottom:1px solid var(--line);text-align:left;background:${x.un?'':'none'}"><span class="ni chip ${x.k}" style="height:30px;width:30px;padding:0;justify-content:center">${ic(x.ic)}</span><span><b>${x.t}</b><span class="np">${x.p}</span><time>${x.w}</time></span></button>`).join('')}`;
 n.hidden=false;
}

/* ================= Vues ================= */
const VIEWS={
 accueil:{html:vAccueil},projets:{html:vProjets},projet:{html:vProjet},inventaire:{html:vInventaire},
 racks:{html:vRacks,full:true,mount:mountRacks},synoptique:{html:vSynoptique,full:true,mount:mountSyn},
 recette:{html:vRecette},catalogue:{html:vCatalogue},admin:{html:vAdmin},
};

/* ================= Événements ================= */
document.addEventListener('click',e=>{
 const t=e.target;
 const g=t.closest('[data-go]');if(g){e.preventDefault();closeAll();go(g.dataset.go);return}
 const sn=t.closest('[data-soon]');if(sn){soon(sn.dataset.soon);return}
 const pj=t.closest('[data-proj]');if(pj){openProj(+pj.dataset.proj);return}
 const a=t.closest('[data-act]');
 if(a){const k=a.dataset.act;
  if(k==='wizard')return openWizard();
  if(k==='closem')return closeModal();
  if(k==='closed')return closeDrawer();
  if(k==='wznext')return wzNext();
  if(k==='wzback'){WZ.i=Math.max(0,WZ.i-1);return wzRender()}
  if(k==='pclear'){S.pf.st=[];return render()}
  if(k==='lock'){S.lockOther=!S.lockOther;RACK.placing=null;SYN.pend=null;render();toast(S.lockOther?'Vue de Léa Martin : lecture seule, Damien P. a la main.':'Retour à votre vue : vous avez la main.','info');return}
  if(k==='release'){toast('Main cédée. Le premier membre qui ouvre l’écran pourra éditer.','info');return}
  if(k==='askhand'){toast('Demande envoyée à Damien P.','ok','lm');return}
  if(k==='rmove'){RACK.placing=RACK.sel;rackRefresh();toast('Touchez la nouvelle position dans la baie.','info');return}
  if(k==='rremove'){const it=RACK.items.find(i=>i.id===RACK.sel);RACK.items.splice(RACK.items.indexOf(it),1);delete it.pos;RACK.pending.unshift(it);RACK.sel=null;rackRefresh();toast(`${esc(it.nom)} remis à placer. Ses câbles ont été supprimés.`,'warn');return}
  if(k==='fit'){SYN.userMoved=false;return fitSyn()}
  if(k==='cdel'){const c=SYN.cables.find(x=>x.id===SYN.sel.id);SYN.cables=SYN.cables.filter(x=>x!==c);SYN.sel=null;SYN.hl=null;synAll();toast(`Câble ${c.num||'sans numéro'} supprimé`,'warn');return}
  if(k==='autonum'){const l=SYN.cables.filter(c=>!c.num).sort((x,y)=>portSig(x.a).localeCompare(portSig(y.a))||node(x.a[0]).y-node(y.a[0]).y);l.forEach(c=>{c.num=nextNum(node(c.a[0]).cont,SIG[portSig(c.a)].L)});synAll();toast(l.length?`${l.length} câble${l.length>1?'s':''} numéroté${l.length>1?'s':''} : ${l.map(c=>c.num).join(', ')}`:'Tous les câbles ont déjà un numéro.',l.length?'ok':'info');return}
  if(k==='rcsave'){const key=S.rc.open;S.rc.by[key]={u:'dp',w:'11/11 '+new Date().toTimeString().slice(0,5),c:$('#rcc').value.trim()};S.rc.open=null;rcRefresh(key);toast('Commentaire enregistré dans le journal du point');return}
  if(k==='rccancel'){S.rc.open=null;rcRefresh();return}
  if(k==='pv'){toast('Procès-verbal PDF généré : A4, signatures prestataire et client.','ok');return}
  if(k==='newcat')return newCatDrawer();
  if(k==='addmat')return addMatDrawer();
  if(k==='catdup'){const c=CAT.find(x=>x.id===a.dataset.id);const n={...c,id:c.id+'-'+Date.now(),nom:c.nom+' (copie)',used:0,fresh:true};CAT.splice(CAT.indexOf(c)+1,0,n);closeDrawer();$('#catBody').innerHTML=catRows();n.fresh=false;toast(`« ${esc(n.nom)} » créée, active.`);return}
  if(k==='catdel'){const c=CAT.find(x=>x.id===a.dataset.id);if(c.used){toast(`Utilisé dans ${c.used} projet(s) — suppression impossible`,'err');return}CAT.splice(CAT.indexOf(c),1);closeDrawer();$('#catBody').innerHTML=catRows();toast('Fiche supprimée','warn');return}
  if(k==='ncsave'){const nm=$('#ncName').value.trim();if(!nm){$('#ncName').focus();$('#ncDup').innerHTML='<span class="help err">Le nom-référence est obligatoire.</span>';return}
   const c={id:'n'+Date.now(),nom:nm,marque:$('#ncBrand').value,cat:SIG[$('#ncFn').value].n,f:$('#ncFn').value,u:+$('#ncU').value||1,larg:$('#ncLarg .on').dataset.l,prof:+$('#ncProf').value,poids:+$('#ncKg').value,w:+$('#ncW').value,ports:{[$('#ncFn').value]:0},used:0,fresh:true};
   CAT.unshift(c);closeDrawer();S.cat.f='all';S.cat.q='';render();c.fresh=false;toast(`Fiche « ${esc(nm)} » enregistrée.`);return}
  if(k==='otarun')return runOta();
  if(k==='otanight'){toast('Installation planifiée cette nuit à 03:30. Les utilisateurs seront prévenus.','info');return}
  if(k==='otacheck'){toast('Aucune nouvelle version sur le canal '+S.ota.canal+'.','info');return}
  if(k==='otaroll'){toast('Retour à 1.4.2 : la version actuelle sera conservée, le service redémarrera.','warn');return}
  if(k==='otaok'){S.ota.phase='idle';$('#admBody').innerHTML=admBody();return}
  if(k==='copy'){const s=$('#addr').textContent;const ok=()=>toast('Adresse copiée');try{navigator.clipboard.writeText(s).then(ok,()=>{selectText($('#addr'))})}catch(_){selectText($('#addr'))}return}
  if(k==='backup'){toast('Sauvegarde du site lancée : données, fichiers, réglages et points de restauration.');return}
  if(k==='readall'){NOTIFS.forEach(n=>n.un=false);chrome(route());$('#notifs').hidden=true;notifs();return}
 }
 const ni=t.closest('[data-ni]');if(ni){const n=NOTIFS[+ni.dataset.ni];n.un=false;$('#notifs').hidden=true;go(n.go);return}
 const pi=t.closest('[data-pi]');if(pi){const x=palFiltered()[+pi.dataset.pi];closeModal();x&&x.run();return}
 const iv=t.closest('[data-inter]');if(iv){S.pf.inter=iv.dataset.inter;return render()}
 const ps=t.closest('[data-pst]');if(ps){const s=ps.dataset.pst,a2=S.pf.st;a2.includes(s)?a2.splice(a2.indexOf(s),1):a2.push(s);return render()}
 const ts=t.closest('[data-tst]');if(ts){const tk=TASKS[+ts.dataset.tst];tk.st=TST[(TST.indexOf(tk.st)+1)%TST.length];$('#tasks tbody').innerHTML=tasksRows();toast(`« ${esc(tk.t)} » : ${tk.st}`);return}
 const lc=t.closest('[data-loc]');if(lc){S.inv.loc=lc.dataset.loc;S.inv.cont=LOCS.find(l=>l.id===S.inv.loc).conts[0];$$('.loc').forEach(b=>b.classList.toggle('on',b===lc));$('#invMain').innerHTML=invMain();return}
 const ct=t.closest('[data-cont]');if(ct){S.inv.cont=ct.dataset.cont;$('#invMain').innerHTML=invMain();return}
 const q=t.closest('[data-q]');if(q){const tr=q.closest('tr');changeQty(tr.dataset.an,+q.dataset.q);return}
 const am=t.closest('[data-amadd]');if(am){const c=CAT.find(x=>x.id===am.dataset.amadd);addToCont(c);return}
 const pd=t.closest('[data-pend]');if(pd&&editable()){RACK.placing=RACK.placing===pd.dataset.pend?null:pd.dataset.pend;RACK.sel=null;rackRefresh();if(RACK.placing)toast('Touchez une position dans la baie.','info');return}
 const fc=t.closest('[data-face]');if(fc){RACK.face=fc.dataset.face;RACK.sel=null;render();return}
 const rm=t.closest('[data-rmode]');if(rm){RACK.mode=rm.dataset.rmode;render();return}
 const rs=t.closest('[data-rst]');if(rs){const row=rs.closest('[data-rc]'),k2=row.dataset.rc,s=rs.dataset.rst;S.rc.st[k2]=s;if(s==='todo'){delete S.rc.by[k2];S.rc.open=null}else{S.rc.by[k2]={u:'dp',w:'11/11 '+new Date().toTimeString().slice(0,5),c:(S.rc.by[k2]||{}).c||''};S.rc.open=(s==='res'||s==='ko')?k2:null}rcRefresh(k2);if(S.rc.open)setTimeout(()=>{const x=$('#rcc');x&&(x.focus(),x.setSelectionRange(x.value.length,x.value.length))},20);return}
 const rf=t.closest('[data-rf]');if(rf){S.rc.f=rf.dataset.rf;$$('[data-rf]').forEach(b=>b.classList.toggle('on',b===rf));$('#rcBody').innerHTML=rcBody();return}
 const cr=t.closest('[data-cat]');if(cr){catDrawer(cr.dataset.cat);return}
 const cf=t.closest('[data-cf]');if(cf){S.cat.f=cf.dataset.cf;$$('[data-cf]').forEach(b=>b.classList.toggle('on',b===cf));$('#catBody').innerHTML=catRows();return}
 const ad=t.closest('[data-adm]');if(ad){S.adm=ad.dataset.adm;$$('[data-adm]').forEach(b=>b.classList.toggle('on',b===ad));$('#admBody').innerHTML=admBody();return}
 const cn=t.closest('[data-canal]');if(cn){S.ota.canal=cn.dataset.canal;$('#admBody').innerHTML=admBody();return}
 const wz=t.closest('[data-wz]');if(wz){WZ.d[wz.dataset.wz]=wz.dataset.v;if(wz.dataset.wz==='inter'&&WZ.d.inter==='Prestation'&&WZ.d.regie==='Installation fixe')WZ.d.regie='';wzRender();return}
 const wg=t.closest('[data-wzgo]');if(wg){WZ.i=+wg.dataset.wzgo;wzRender();return}
 const nl=t.closest('#ncLarg button');if(nl){$$('#ncLarg button').forEach(b=>b.classList.toggle('on',b===nl));return}
 if(t.closest('#modal')&&!t.closest('#dialog'))return closeModal();
 if(!t.closest('#notifs')&&!t.closest('#bellBtn'))$('#notifs').hidden=true;
});
function selectText(el){const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);toast('Adresse sélectionnée : copiez-la avec Ctrl+C','info')}
function addToCont(c){
 const id=S.inv.cont;
 if(id==='bv1'){const n={id:'r'+(++uid),nom:c.nom,h:c.u,larg:c.larg==='1/2'?.5:1,sig:c.f,poids:c.poids,w:c.w,prof:c.prof,kind:'eq',rep:nextRep()};RACK.pending.push(n)}
 else{const a=CONT[id].arts.find(x=>x.nom===c.nom);if(a)a.qty++;else CONT[id].arts.push({nom:c.nom,kind:'eq',h:CONT[id].rack?c.u:0,qty:1,poids:c.poids,w:c.w,sig:c.f})}
 $('#invMain').innerHTML=invMain();const r=$(`#arts tr[data-an="${CSS.escape(c.nom)}"]`);r&&r.classList.add('flash');
 const s=contStats(id),C=CONT[id];
 if(C.rack&&s.U>C.u)toast(`Plus assez de place : ${s.U} U pour ${C.u} U disponibles.`,'warn');else toast(`${esc(c.nom)} ajouté à ${C.nom}`);
}
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.id==='pq'){S.pf.q=t.value;$('#plist').innerHTML=projList();return}
 if(t.id==='rq'){S.rc.q=t.value;$('#rcBody').innerHTML=rcBody();return}
 if(t.id==='cq'){S.cat.q=t.value;$('#catBody').innerHTML=catRows();return}
 if(t.id==='amq'){$('#amList').innerHTML=amList(t.value);return}
 if(t.id==='palIn'){PAL.q=t.value;PAL.i=0;palDraw();return}
 if(t.dataset.wzi){WZ.d[t.dataset.wzi]=t.value;if(t.dataset.wzi==='nom'){const h=$('#nmh');h.outerHTML=nameHelp()}return}
 if(t.id==='ncName'){const q=norm(t.value);const box=$('#ncDup');if(q.length<2){box.innerHTML='';return}
  const m=CAT.filter(c=>norm(c.nom).includes(q)||norm(c.marque).includes(q)).slice(0,5);
  box.innerHTML=m.length?`<div class="dup"><b>${m.length} fiche${m.length>1?'s':''} proche${m.length>1?'s':''} dans le catalogue</b>${m.map(c=>`<span>${esc(c.nom)} · ${esc(c.marque)} <span class="muted">(${norm(c.nom).includes(q)?'nom':'marque'})</span></span>`).join('')}</div>`:'<span class="help ok">Aucun doublon trouvé.</span>';return}
 if(t.id==='ncW'){const v=Math.round((+t.value||0)*3.412);$('#ncBtu').placeholder=v;$('#ncBtuHelp').textContent=`Suggestion : ${nf(v)} (puissance × 3,412)`}
});
document.addEventListener('change',e=>{
 if(e.target.id==='pStatut'){P.statut=e.target.value;render();toast(`Statut du projet : ${P.statut}`)}
});
document.addEventListener('keydown',e=>{
 if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#modal').hidden?openPalette():closeModal();return}
 if(e.key==='Escape'){if(SYN.pend){SYN.pend=null;const p=$('#preview');p&&p.setAttribute('d','');synDraw();setHint();return}if(RACK.placing){RACK.placing=null;if(route()==='racks')rackRefresh();return}closeAll();return}
 if($('#palIn')&&document.activeElement===$('#palIn')){const l=palFiltered();if(e.key==='ArrowDown'){PAL.i=Math.min(l.length-1,PAL.i+1);palDraw();e.preventDefault()}if(e.key==='ArrowUp'){PAL.i=Math.max(0,PAL.i-1);palDraw();e.preventDefault()}if(e.key==='Enter'&&l[PAL.i]){const x=l[PAL.i];closeModal();x.run()}return}
 if(e.key==='Enter'&&$('.wz-body')&&!$('#modal').hidden&&e.target.tagName!=='TEXTAREA'){e.preventDefault();wzNext()}
 if((e.key==='Delete'||e.key==='Backspace')&&route()==='synoptique'&&SYN.sel&&SYN.sel.t==='c'&&editable()&&!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)){const c=SYN.cables.find(x=>x.id===SYN.sel.id);SYN.cables=SYN.cables.filter(x=>x!==c);SYN.sel=null;synAll();toast(`Câble ${c.num||'sans numéro'} supprimé`,'warn')}
});
$('#menuBtn').innerHTML=ic('menu');
$('#menuBtn').onclick=()=>{$('#sidebar').classList.add('open');$('#scrim').classList.add('open')};
$('#scrim').onclick=()=>{$('#sidebar').classList.remove('open');closeDrawer();$('#scrim').classList.remove('open')};
$('#searchBtn').innerHTML=`${ic('search')}<span>Rechercher…</span><kbd>⌘K</kbd>`;
$('#searchBtn').onclick=openPalette;
$('#themeBtn').onclick=toggleTheme;
$('#bellBtn').onclick=e=>{e.stopPropagation();notifs()};
window.addEventListener('hashchange',render);

/* ================= Simulation du temps réel ================= */
function live(){
 const r=route();
 if(DESIGN.has(r)||!$('#modal').hidden)return;
 if(r==='inventaire'){
  const arts=artsOf(S.inv.cont).filter(a=>!a.rack);if(!arts.length)return;
  const a=arts[Math.floor(Math.random()*arts.length)];const d=a.qty>1&&Math.random()<.5?-1:1;a.qty+=d;$('#invMain').innerHTML=invMain();
  const row=$(`#arts tr[data-an="${CSS.escape(a.nom)}"]`);row&&row.classList.add('flash');
  toast(`Léa Martin a ${d>0?'ajouté':'retiré'} 1 × ${esc(a.nom)}`,'ok','lm');pushFeed('lm',`a modifié la quantité de ${a.nom} dans`,CONT[S.inv.cont].nom);return;
 }
 if(r==='recette'){
  const it=rcItems().filter(x=>rcSt(x.k)==='todo');if(!it.length)return;const x=it[0];S.rc.st[x.k]='ok';S.rc.by[x.k]={u:'hb',w:'11/11 '+new Date().toTimeString().slice(0,5),c:''};
  rcRefresh(x.k);toast(`Hugo Bernard a passé ${esc(x.t)} en OK`,'ok','hb');pushFeed('hb',`a passé ${x.t} en OK sur`,P.nom);return;
 }
 if(r==='projet'){const t=TASKS.find(t=>t.st==='À faire'&&t.u!=='dp');if(!t)return;t.st='En cours';const b=$('#tasks tbody');if(b){b.innerHTML=tasksRows();b.querySelector(`[data-ti="${TASKS.indexOf(t)}"]`).classList.add('flash')}toast(`${U[t.u].n} a commencé « ${esc(t.t)} »`,'ok',t.u);return}
 if(r==='catalogue'){const c=CAT[Math.floor(Math.random()*CAT.length)];c.w+=5;c.fresh=true;$('#catBody').innerHTML=catRows();c.fresh=false;toast(`Sofia Roux a modifié la fiche « ${esc(c.nom)} »`,'ok','sr');return}
 if(r==='accueil'){const ev=[['sr','a placé 2 × Enregistreur 1U SSD dans','Baie vidéo V1'],['lm','a ajouté le point de recette « Retour PGM caméras » à',P.nom],['hb','a coché 8 contrôles de construction de','Baie audio A1']];const x=ev[Math.floor(Math.random()*ev.length)];pushFeed(...x);const f=$('#feed');f&&(f.innerHTML=feedHtml());FEED[0].fresh=false;}
}
function pushFeed(u,t,o){FEED.unshift({u,t,o,w:'à l’instant',fresh:true});FEED.length=Math.min(FEED.length,12);setTimeout(()=>{FEED.forEach(f=>f.fresh=false)},100)}
setInterval(live,10000);

/* ================= Démarrage ================= */
(function(){const t=store.get('sa-theme');if(t)document.documentElement.dataset.theme=t;themeIcon();render()})();
</script>
