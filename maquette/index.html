<title>Strata Arkyo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout : éditorial clair — page blanche, navigation par onglets en tête, grands titres, listes lues comme un document, aucun cadre superflu. */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F5F6F7; --sunken:#EBEDEF; --line:#E4E6E9; --line-2:#C5C9CF;
  --fg:#0B0C0E; --fg-2:#383C43; --fg-3:#686D76;
  --accent:#1F3DF0; --accent-soft:#E9EDFF;
  --urg:#D3261C; --soon:#B25E00;
  --primary:#0B0C0E; --primary-fg:#FFFFFF;
  --ok:#0C7A4B; --ok-soft:#E3F4EB; --warn:#9A5800; --warn-soft:#FCF0DC; --err:#C8231B; --err-soft:#FCE6E4; --info:#4D5560; --info-soft:#EEF0F2;
  --st-prep:#4B57D6; --st-pret:#08839A; --st-cours:#D06A0C; --st-fini:#0C7A4B; --st-annule:#8A919B;
  --sig-v:#2459E0; --sig-a:#0E8550; --sig-l:#B78400; --sig-c:#7A44C9; --sig-p:#CF3A2F; --sig-n:#0A8797; --sig-s:#BD3489; --sig-i:#69788C; --sig-f:#D06006;
  --rack-metal:#1F2329; --rack-rail:#323943; --rack-hole:#121519; --rack-text:#EEF1F4; --rack-muted:#97A1AD;
  --canvas:#F7F8F9; --dot:#D9DDE2; --seg-on:#FFFFFF;
  --scrim:rgba(11,12,14,.32);
  --shadow-lg:0 24px 64px rgba(11,12,14,.16),0 2px 8px rgba(11,12,14,.06);
  --display:'Bricolage Grotesque','Helvetica Neue',Arial,sans-serif;
  --font:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E0F11; --surface:#0E0F11; --surface-2:#18191C; --sunken:#212327; --line:#25272B; --line-2:#3A3D43;
  --fg:#F4F4F2; --fg-2:#C9CBCF; --fg-3:#959AA2;
  --accent:#8EA2FF; --accent-soft:#1A2147;
  --urg:#FF6B5F; --soon:#F2A43C;
  --primary:#F4F4F2; --primary-fg:#0E0F11;
  --ok:#45CF92; --ok-soft:#10291E; --warn:#F2A43C; --warn-soft:#2E2210; --err:#FF6B5F; --err-soft:#341613; --info:#A4ABB4; --info-soft:#1C1E22;
  --st-prep:#97A0FF; --st-pret:#3CC7DA; --st-cours:#FF9E4F; --st-fini:#45CF92; --st-annule:#8E96A1;
  --sig-v:#6E9BFF; --sig-a:#45CB87; --sig-l:#F4C53A; --sig-c:#B18CF5; --sig-p:#FF7468; --sig-n:#35C8D8; --sig-s:#F370C0; --sig-i:#A0AEC0; --sig-f:#FF9A4A;
  --rack-metal:#1A1D22; --rack-rail:#2D333C; --rack-hole:#0B0D10;
  --canvas:#131417; --dot:#2A2D33; --seg-on:#34373D;
  --scrim:rgba(0,0,0,.6);
  --shadow-lg:0 24px 64px rgba(0,0,0,.6);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E0F11; --surface:#0E0F11; --surface-2:#18191C; --sunken:#212327; --line:#25272B; --line-2:#3A3D43;
  --fg:#F4F4F2; --fg-2:#C9CBCF; --fg-3:#959AA2;
  --accent:#8EA2FF; --accent-soft:#1A2147;
  --urg:#FF6B5F; --soon:#F2A43C;
  --primary:#F4F4F2; --primary-fg:#0E0F11;
  --ok:#45CF92; --ok-soft:#10291E; --warn:#F2A43C; --warn-soft:#2E2210; --err:#FF6B5F; --err-soft:#341613; --info:#A4ABB4; --info-soft:#1C1E22;
  --st-prep:#97A0FF; --st-pret:#3CC7DA; --st-cours:#FF9E4F; --st-fini:#45CF92; --st-annule:#8E96A1;
  --sig-v:#6E9BFF; --sig-a:#45CB87; --sig-l:#F4C53A; --sig-c:#B18CF5; --sig-p:#FF7468; --sig-n:#35C8D8; --sig-s:#F370C0; --sig-i:#A0AEC0; --sig-f:#FF9A4A;
  --rack-metal:#1A1D22; --rack-rail:#2D333C; --rack-hole:#0B0D10;
  --canvas:#131417; --dot:#2A2D33; --seg-on:#34373D;
  --scrim:rgba(0,0,0,.6);
  --shadow-lg:0 24px 64px rgba(0,0,0,.6);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.55 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--fg)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
h1,h2,h3{margin:0;text-wrap:balance;font-family:var(--display)}
h1{font-weight:700;font-size:34px;line-height:1.08;letter-spacing:-.025em}
.display{font-size:clamp(44px,6.2vw,84px);line-height:.98;letter-spacing:-.04em;font-weight:700}
h2{font-weight:600;font-size:26px;line-height:1.15;letter-spacing:-.02em}
h3{font-weight:600;font-size:21px;letter-spacing:-.015em}
p{margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--fg-3)} .small{font-size:14px}
.ic{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:17px;height:17px}
.tape{display:inline-block;font:500 13.5px/1.3 var(--mono);border:1px solid var(--fg);color:var(--fg);padding:1px 8px;border-radius:999px;white-space:nowrap;letter-spacing:.01em}
.tape.none{border-color:var(--err);color:var(--err);border-style:dashed}
.urg{color:var(--urg);font-weight:700}

/* ---------- En-tête ---------- */
.app{display:flex;flex-direction:column;height:100%}
.mast{display:flex;align-items:center;gap:36px;height:76px;flex:none;padding-left:max(40px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--bg);position:relative;z-index:20}
.word{font:800 22px/1 var(--display);letter-spacing:-.035em;border:0;background:none;padding:0;color:var(--fg);white-space:nowrap}
.icon-btn.menu-btn{display:none}
.topnav{display:flex;gap:28px;height:100%}
.topnav button{border:0;background:none;padding:0;font-size:16px;font-weight:500;color:var(--fg-3);height:100%;border-bottom:2px solid transparent;margin-bottom:-1px}
.topnav button:hover{color:var(--fg)}
.topnav button.on{color:var(--fg);border-bottom-color:var(--fg)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:6px}
.search-btn{display:flex;align-items:center;gap:10px;height:42px;padding:0 10px 0 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface-2);color:var(--fg-3);min-width:240px;font-size:15px}
.search-btn:hover{border-color:var(--line-2);color:var(--fg-2)}
kbd{margin-left:auto;font:500 12px var(--mono);padding:2px 7px;border-radius:999px;border:1px solid var(--line-2);color:var(--fg-3)}
.mode{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;white-space:nowrap;padding:0 10px}
.mode.live{color:var(--ok)}
.mode.live i{width:9px;height:9px;border-radius:50%;background:currentColor;animation:pulse 1.8s infinite}
.mode.design{color:var(--soon)}
.mode .ic{width:16px;height:16px}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,currentColor 55%,transparent)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.presence{display:flex;padding:0 6px 0 10px}
.av{width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;font:600 12px var(--font);color:#fff;background:var(--c);border:2px solid var(--bg);flex:none}
.presence .av{margin-left:-8px}
.av.sm{width:26px;height:26px;font-size:10.5px;border-width:0}
.av.lg{width:42px;height:42px;font-size:14px}
.icon-btn{width:42px;height:42px;display:inline-grid;place-items:center;border-radius:999px;border:0;background:none;color:var(--fg-2);position:relative;flex:none}
.icon-btn:hover{background:var(--surface-2);color:var(--fg)}
.icon-btn.sm{width:36px;height:36px}
.icon-btn .badge{position:absolute;top:5px;right:5px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--urg);color:#fff;font:700 11px var(--font);display:grid;place-items:center;border:2px solid var(--bg)}
#view{flex:1;overflow:auto;padding-block:56px 120px;padding-left:max(40px,env(safe-area-inset-left,0px));padding-right:max(40px,env(safe-area-inset-right,0px));min-height:0}
#view.full{padding:0;overflow:hidden;display:flex;flex-direction:column}
.page{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:64px}
.tabbar{display:none!important}

/* Menu plein écran (mobile) */
.sidebar{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;flex-direction:column;gap:22px;padding-block:calc(env(safe-area-inset-top,0px) + 14px) calc(env(safe-area-inset-bottom,0px) + 20px);padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:auto;opacity:0;visibility:hidden;transform:translateY(-12px);transition:opacity .2s,transform .2s,visibility .2s}
.sidebar.open{opacity:1;visibility:visible;transform:none}
.menu-top{display:flex;justify-content:space-between;align-items:center}
.menu-links,.menu-sub{display:flex;flex-direction:column;align-items:flex-start}
.menu-links button{border:0;background:none;padding:4px 0;font:700 44px/1.12 var(--display);letter-spacing:-.035em;color:var(--fg-3);text-align:left}
.menu-links button.on{color:var(--fg)}
.menu-sub button{border:0;background:none;padding:6px 0;font-size:20px;font-weight:500;color:var(--fg-2)}
.menu-sub button.on{color:var(--fg);font-weight:700}
.menu-sub .sn-label{padding:14px 0 2px}
.side-foot{margin-top:auto;display:flex;align-items:center;gap:12px;padding-top:18px;border-top:1px solid var(--line)}
.side-foot b{display:block} .side-foot span{font-size:14px;color:var(--fg-3)}

/* ---------- Éléments ---------- */
.hero{display:flex;flex-direction:column;gap:22px;max-width:980px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
.page-head>div:first-child{min-width:0}
.eyebrow{font-size:14px;font-weight:600;color:var(--fg-3);letter-spacing:.04em;margin-bottom:12px}
.hero .eyebrow{margin:0}
.lead{color:var(--fg-2);max-width:40ch;font:400 clamp(21px,2.1vw,27px)/1.4 var(--font);letter-spacing:-.01em}
.ilink{border:0;background:none;padding:0;font:inherit;color:var(--fg);text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:4px}
.ilink:hover{color:var(--accent)}
.head-actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 22px;border-radius:999px;border:1px solid var(--line-2);background:var(--bg);font-weight:600;color:var(--fg);white-space:nowrap;font-size:15.5px}
.btn:hover{border-color:var(--fg)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-fg)}
.btn.primary:hover{opacity:.88}
.btn.ghost{background:none;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{height:38px;padding:0 16px;font-size:14.5px;gap:6px}
.btn.danger{color:var(--err)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.card{background:none;border:0;padding:0;min-width:0}
.card-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1.5px solid var(--fg);margin-bottom:6px}
.card-head>div{min-width:0}
.card-head .small{font-size:14px}
.chip{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 11px;border-radius:999px;font-size:13.5px;font-weight:600;background:var(--sunken);color:var(--fg-2);white-space:nowrap}
.chip .dot{width:9px;height:9px;border-radius:50%;background:currentColor;flex:none}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.err{background:var(--err-soft);color:var(--err)} .chip.info{background:var(--info-soft);color:var(--info)} .chip.accent{background:var(--accent-soft);color:var(--accent)}
.chip.st{background:none;padding:0;color:var(--fg);font-size:15px}
.chip.st .dot{background:var(--c)}
.chip .ic{width:14px;height:14px}
.bar{height:4px;border-radius:2px;background:var(--sunken);overflow:hidden;min-width:40px}
.bar>i{display:block;height:100%;background:var(--fg);border-radius:inherit;transition:width .4s}
.bar.ok>i{background:var(--ok)} .bar.warn>i{background:var(--soon)} .bar.err>i{background:var(--urg)}
.sw{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--c);flex:none}
.grid-2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:72px;align-items:start}
.seg{display:inline-flex;gap:2px;padding:3px;flex:none;max-width:100%;overflow-x:auto;scrollbar-width:none;background:var(--sunken);border-radius:10px;align-self:flex-start}
.seg::-webkit-scrollbar{display:none}
.seg button{border:0;background:none;height:34px;padding:0 14px;border-radius:7px;font-size:14.5px;font-weight:500;color:var(--fg-2);white-space:nowrap}
.seg button:hover{color:var(--fg)}
.seg button.on{background:var(--seg-on);color:var(--fg);font-weight:600;box-shadow:0 1px 2px rgba(11,12,14,.14),0 0 0 1px var(--line)}
.seg button[disabled]{opacity:.4;cursor:not-allowed}
.input{height:46px;border:0;border-bottom:1.5px solid var(--line-2);border-radius:0;background:transparent;padding:0 2px;min-width:0;width:100%;font-size:16px}
.input:focus{outline:none;border-bottom-color:var(--fg)}
textarea.input{height:auto;padding:12px;resize:vertical;min-height:96px;border:1.5px solid var(--line-2);border-radius:10px}
textarea.input:focus{border-color:var(--fg)}
select.input{cursor:pointer}
.search{position:relative;flex:1;min-width:220px;max-width:420px}
.search .ic{position:absolute;left:2px;top:13px;color:var(--fg-3)}
.search .input{padding-left:32px}
.toolbar{display:flex;gap:12px 14px;flex-wrap:wrap;align-items:center}
.fchip{height:38px;padding:0 16px;border:1px solid var(--line-2);border-radius:999px;background:var(--bg);font-size:14.5px;font-weight:500;color:var(--fg-2);display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.fchip:hover{border-color:var(--fg)}
.fchip[style]::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c)}
.fchip.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.flabel{font-size:14px;font-weight:600;color:var(--fg-2)}
.field .help{font-size:14px;color:var(--fg-3)}
.field .help.err{color:var(--err)} .field .help.ok{color:var(--ok)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px 24px}
.form-grid .span{grid-column:1/-1}
.form-grid .seg{border-bottom:0}
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:15.5px}
.tbl th{font-size:13px;font-weight:600;letter-spacing:.03em;color:var(--fg-3);text-align:left;padding:12px 14px 12px 0;border-bottom:1px solid var(--line-2);white-space:nowrap}
.tbl td{padding:16px 14px 16px 0;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr.click:hover td{background:var(--surface-2)}
.flash,.flash td{animation:flash 2.4s ease-out}
@keyframes flash{0%,35%{background:var(--accent-soft)}100%{background:transparent}}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line-2);border-radius:999px}
.stepper button{width:36px;height:36px;border:0;background:none;color:var(--fg-2);font-size:19px;border-radius:999px}
.stepper button:hover{background:var(--surface-2)}
.stepper span{min-width:26px;text-align:center;font:600 15.5px var(--mono)}
.empty{padding:40px 0;color:var(--fg-3);font-size:17px}

/* ---------- Accueil ---------- */
.figs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:40px;border-top:1.5px solid var(--fg);padding-top:28px}
.fig b{display:block;font:700 76px/.95 var(--display);letter-spacing:-.045em;font-variant-numeric:tabular-nums}
.fig b small{font-size:.5em;letter-spacing:-.02em}
.fig span{display:block;margin-top:12px;color:var(--fg-2);font-size:16px;max-width:22ch}
.fig.alert b{color:var(--urg)}
.cols{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:72px;align-items:start}
.rows{display:flex;flex-direction:column}
.row-link,.prow{display:grid;align-items:center;gap:24px;padding:20px 0;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left}
.row-link{grid-template-columns:60px minmax(0,1fr) auto 20px}
.row-link:hover .r-main b,.prow:hover .r-main b{text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:5px}
.row-link>.ic,.prow>.ic{color:var(--fg-3);transition:transform .15s}
.row-link:hover>.ic,.prow:hover>.ic{transform:translateX(4px);color:var(--fg)}
.r-date b{display:block;font:700 34px/1 var(--display);letter-spacing:-.03em}
.r-date span{font-size:14px;color:var(--fg-3)}
.r-main{display:flex;flex-direction:column;gap:3px;min-width:0}
.r-main b{font:600 22px/1.2 var(--display);letter-spacing:-.015em}
.r-main span{color:var(--fg-3);font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-j{font:600 16px var(--mono);color:var(--fg-2);white-space:nowrap}
.r-j.urg{color:var(--urg)} .r-j.soon{color:var(--soon)} .r-j.off{color:var(--fg-3)}
.r-col{display:flex;flex-direction:column;gap:6px;font-size:15.5px;min-width:0}
.r-col .lbl{font-size:13px;color:var(--fg-3)}
.feed{display:flex;flex-direction:column}
.feed-item{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.feed-item p{font-size:15.5px;color:var(--fg-2)} .feed-item p b{color:var(--fg);font-weight:600}
.feed-item time{font-size:13.5px;color:var(--fg-3)}
.stackbar{display:flex;height:10px;border-radius:999px;overflow:hidden;gap:3px;margin-top:22px}
.stackbar i{display:block;background:var(--c)}
.legend{display:flex;flex-wrap:wrap;gap:12px 36px;margin-top:20px}
.legend div{display:flex;align-items:center;gap:10px;font-size:16px}
.legend b{font:600 16px var(--mono)}

/* ---------- Projets ---------- */
.proj-grid{display:flex;flex-direction:column}
.prow{grid-template-columns:minmax(0,1fr) 170px 170px 64px 20px}
.group-h{display:flex;align-items:baseline;gap:12px;padding-bottom:14px;border-bottom:1.5px solid var(--fg)}
.group-h .chip.st{font:600 26px var(--display);letter-spacing:-.02em;gap:12px}
.group-h .chip.st .dot{width:12px;height:12px}
.group-h .count{font:500 18px var(--mono);color:var(--fg-3)}

/* ---------- Projet ---------- */
.ptop{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap}
.ptop-main{min-width:0;display:flex;flex-direction:column;gap:14px}
.ptop .eyebrow{margin:0}
.pmeta{display:flex;flex-wrap:wrap;gap:6px 24px;font-size:18px;color:var(--fg-2)}
.ptop.compact{padding:16px max(28px,env(safe-area-inset-right,0px)) 0 max(28px,env(safe-area-inset-left,0px));align-items:center}
.ptop.compact .ptop-main{flex-direction:row;align-items:baseline;gap:14px;flex-wrap:wrap}
.ptop.compact h1{font-size:24px}
.st-select{display:inline-flex;align-items:center;gap:10px;color:var(--fg);font-weight:600;border:1px solid var(--line-2);border-radius:999px;padding:0 6px 0 16px;height:44px}
.st-select .dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.st-select select{border:0;background:none;color:inherit;font-weight:600;height:100%;cursor:pointer;font-size:15.5px;padding-right:6px}
.st-select select option{color:var(--fg);background:var(--bg)}
.subnav{position:relative;border-bottom:1px solid var(--line);margin-top:-24px}
.sn-row{display:flex;overflow-x:auto;scrollbar-width:none}
.sn-row::-webkit-scrollbar{display:none}
.sn-group{display:flex;flex-direction:column;gap:2px;padding-left:28px;margin-left:28px;border-left:1px solid var(--line);flex:none}
.sn-group:first-child{padding-left:0;margin-left:0;border-left:0}
.sn-label{display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--fg-3);white-space:nowrap;padding-top:6px}
.sn-label .ic{width:12px;height:12px}
.sn-label.lock{color:var(--soon)}
.sn-items{display:flex;gap:26px}
.subnav button{border:0;background:none;padding:10px 0 13px;font-size:16px;font-weight:500;color:var(--fg-3);border-bottom:3px solid transparent;white-space:nowrap;margin-bottom:-1px}
.subnav button:hover{color:var(--fg)}
.subnav button.on{color:var(--fg);font-weight:650;border-color:var(--fg)}
.subnav button.soon{opacity:.4}
.subnav.flat .sn-group{gap:0}
.sn-pick{display:none}
.sn-pick summary{list-style:none;display:flex;align-items:center;gap:10px;height:52px;cursor:pointer}
.sn-pick summary::-webkit-details-marker{display:none}
.sn-pick summary .sn-label{padding:0}
.sn-pick summary b{font-size:17px}
.sn-pick summary .pos{margin-left:auto;font-size:13px;color:var(--fg-3);font-family:var(--mono)}
.sn-pick summary .chev{display:inline-grid;transition:transform .15s}
.sn-pick[open] summary .chev{transform:rotate(180deg)}
.sn-panel{position:absolute;left:0;right:0;top:100%;z-index:60;background:var(--bg);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);padding:8px 8px 12px;display:flex;flex-direction:column;gap:8px}
.sn-panel .sn-label{padding:10px 12px 2px}
.sn-panel button{display:flex;width:100%;text-align:left;padding:11px 12px;border-radius:9px;border-bottom:0;margin:0;color:var(--fg-2)}
.sn-panel button.on{background:var(--sunken);color:var(--fg);font-weight:650}
.crumb{border:0;background:none;padding:0;font:inherit;color:var(--fg-3);text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px}
.crumb:hover{color:var(--fg)}
.dom{display:grid;grid-template-columns:140px minmax(0,1fr) 60px;gap:18px;align-items:center;padding:18px 0;border-bottom:1px solid var(--line)}
.dom b{font:600 19px var(--display);letter-spacing:-.01em}
.dom .d-sub{grid-column:2/4;margin-top:-10px;font-size:14.5px;color:var(--fg-3)}
.dom .pct{text-align:right;font:600 16px var(--mono)}
.todos{display:flex;flex-direction:column}
.todo{display:flex;align-items:center;gap:16px;padding:18px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.todo:hover b{text-decoration:underline;text-underline-offset:4px}
.todo .ti{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none}
.todo .ti.err{background:var(--err-soft);color:var(--err)} .todo .ti.warn{background:var(--warn-soft);color:var(--warn)} .todo .ti.info{background:var(--info-soft);color:var(--info)}
.todo b{display:block;font-size:17px;font-weight:600} .todo span{font-size:14.5px;color:var(--fg-3)}
.todo>.ic:last-child{margin-left:auto;color:var(--fg-3)}
.online{display:flex;flex-direction:column}
.online div{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.online b{display:block;font-weight:600} .online span{font-size:14.5px;color:var(--fg-3)}
.card>.small.muted{margin-top:16px}
.task-st{border:0;cursor:pointer}

/* ---------- Inventaire ---------- */
.inv{display:flex;flex-direction:column;gap:40px}
.loc-list{display:flex;flex-direction:row;flex-wrap:wrap;gap:10px}
.loc-list>.card-head,.loc-list>.hint{display:none}
.loc{display:inline-flex;align-items:center;gap:10px;padding:6px 18px 6px 6px;border-radius:999px;border:1px solid var(--line-2);background:var(--bg);text-align:left}
.loc:hover{border-color:var(--fg)}
.loc.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.loc .code{font:500 13px var(--mono);padding:5px 9px;border-radius:999px;background:var(--sunken);color:var(--fg-2)}
.loc.on .code{background:var(--bg);color:var(--fg)}
.loc .ln{display:flex;flex-direction:column;line-height:1.2}
.loc b{font-weight:600}
.loc .small{font-size:13px}
.loc.on .muted{color:inherit;opacity:.7}
.inv-main{display:flex;flex-direction:column;gap:48px;min-width:0}
.cont-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:32px}
.cont{display:flex;flex-direction:column;gap:6px;text-align:left;background:none;border:0;border-top:3px solid var(--line);padding:18px 0 0}
.cont:hover{border-top-color:var(--fg-3)}
.cont.on{border-top-color:var(--fg)}
.cont-top{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.cont-name{font:600 24px/1.15 var(--display);letter-spacing:-.02em}
.meters{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.meter{display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:12px;align-items:center;font-size:14px;color:var(--fg-3)}
.meter .mono{font-size:14px;color:var(--fg-2)}
.meter.err .mono{color:var(--urg);font-weight:600}
.art-name{display:flex;align-items:center;gap:12px;min-width:0}
.art-name b{font-weight:600}
.art-name .small{display:block}

/* ---------- Écrans de conception ---------- */
.design-top{flex:none;background:var(--bg);border-bottom:1px solid var(--line)}
.design-top .subnav{margin-top:0;border-bottom:0;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.lockbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:10px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));font-size:15px;border-top:1px solid var(--line)}
.lockbar.mine{background:var(--surface-2)}
.lockbar.other{background:var(--warn-soft)}
.lockbar .ic{width:18px;height:18px}
.lockbar .lk{display:inline-flex;align-items:center;gap:10px;min-width:0}
.lockbar .sp{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.saved{display:inline-flex;align-items:center;gap:7px;font-size:14px;color:var(--fg-3)}
.saved i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.dtool{display:flex;align-items:center;gap:14px 20px;flex-wrap:wrap;padding-block:10px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));border-top:1px solid var(--line)}
.dtool .seg{border-bottom:0}
.dtool .meter{grid-template-columns:auto 90px auto}
.dtool .gap{flex:1}
.dtool select.input{width:auto;height:40px}
.design-body{flex:1;min-height:0;display:grid;grid-template-columns:280px minmax(0,1fr) 340px}
.design-body.two{grid-template-columns:minmax(0,1fr) 350px}
.pane{background:var(--bg);overflow:auto;padding:24px;display:flex;flex-direction:column;gap:28px;min-height:0}
.pane.left{border-right:1px solid var(--line)}
.pane.right{border-left:1px solid var(--line)}
.pane h2{font-size:20px;padding-bottom:10px;border-bottom:1.5px solid var(--fg)}
.pane section{display:flex;flex-direction:column;gap:10px}
.pane .card{border-top:0}
.pend{display:flex;align-items:center;gap:12px;padding:12px 0;border:0;border-bottom:1px solid var(--line);background:none;cursor:grab;text-align:left;width:100%;border-radius:0}
.pend:hover b{text-decoration:underline;text-underline-offset:4px}
.pend.on{background:var(--accent-soft);padding-left:10px;border-radius:8px}
.pend .ph{font:500 12.5px var(--mono);padding:3px 8px;border-radius:999px;border:1px solid var(--line-2);color:var(--fg-2);flex:none}
.pend b{display:block;font-weight:600} .pend span{font-size:13.5px;color:var(--fg-3)}
.ro .pend{cursor:default}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 16px;font-size:15.5px;margin:0}
.kv dt{color:var(--fg-3)}
.kv dd{margin:0;font-weight:600;text-align:right;font-variant-numeric:tabular-nums;min-width:0;overflow-wrap:anywhere}
.alert{display:flex;gap:12px;padding:14px 16px;border-radius:12px;font-size:15px;align-items:flex-start}
.alert.warn{background:var(--warn-soft)} .alert.warn>.ic{color:var(--warn)}
.alert.err{background:var(--err-soft)} .alert.err>.ic{color:var(--err)}
.alert.info{background:var(--surface-2);color:var(--fg-2)}
.alert .ic{width:19px;height:19px;margin-top:1px}

/* Rack */
.rack-stage{overflow:auto;background:var(--canvas);display:flex;justify-content:center;align-items:flex-start;padding:36px 16px;min-height:0}
.rack-wrap{display:flex;flex-direction:column;align-items:center;gap:16px}
.rack-title{font:600 20px var(--display);letter-spacing:-.015em;color:var(--fg);display:flex;gap:10px;align-items:center}
.rack{--u:21px;display:grid;grid-template-columns:30px auto 30px;background:var(--rack-metal);border-radius:10px;padding:18px 4px;box-shadow:0 24px 50px rgba(10,14,20,.22)}
.rack-scale{display:flex;flex-direction:column;font:500 11px/1 var(--mono);color:var(--rack-muted);text-align:center}
.rack-scale span{height:var(--u);display:grid;place-items:center}
.rack-body{position:relative;width:420px;height:calc(var(--units) * var(--u));background:repeating-linear-gradient(to top,var(--rack-hole) 0 1px,#1A1E24 1px var(--u));border-left:8px solid var(--rack-rail);border-right:8px solid var(--rack-rail)}
.rack-body::before,.rack-body::after{content:"";position:absolute;top:0;bottom:0;width:8px;background:repeating-linear-gradient(to top,transparent 0 6px,#08090B 6px 10px,transparent 10px var(--u))}
.rack-body::before{left:-8px} .rack-body::after{right:-8px}
.slot{position:absolute;left:0;right:0;height:var(--u)}
.placing .slot:hover{background:rgba(142,162,255,.32);cursor:copy}
.ritem{position:absolute;border-radius:3px;display:flex;align-items:center;gap:9px;padding:0 10px;font:500 13.5px var(--font);color:var(--rack-text);background:linear-gradient(180deg,#3B424C,#2C323A);border:1px solid #535C68;overflow:hidden;cursor:pointer;white-space:nowrap}
.ritem:hover{border-color:#8B97A6}
.ritem .led{width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 7px var(--c);flex:none}
.ritem .rn{overflow:hidden;text-overflow:ellipsis;min-width:0}
.ritem .rr{margin-left:auto;font:500 11px var(--mono);flex:none;color:var(--rack-muted)}
.ritem::after{content:"";position:absolute;right:62px;top:26%;bottom:26%;width:44px;background:repeating-linear-gradient(90deg,rgba(0,0,0,.4) 0 2px,transparent 2px 5px);opacity:.6;pointer-events:none}
.ritem.half::after,.ritem.acc::after{display:none}
.ritem.acc{background:repeating-radial-gradient(circle at 50% 50%,#1D2228 0 1.3px,#2A3038 1.5px 4px);color:var(--rack-muted)}
.ritem.panel{background:linear-gradient(180deg,#31373F,#262B32)}
.ritem.panel::after{right:66px;width:auto;left:130px;background:repeating-linear-gradient(90deg,#0E1114 0 7px,transparent 7px 12px);opacity:.9;top:30%;bottom:30%;border-radius:2px}
.ritem.sel{outline:3px solid #8EA2FF;outline-offset:1px;z-index:2}
.ritem.dw .rn::after{content:"  ⚠";color:#F2A43C}
.schem .ritem{background:color-mix(in srgb,var(--c) 38%,#1C2229);border-color:var(--c)}
.schem .ritem::after{display:none}
.schem .ritem.acc{background:#2A3039;border-color:#4D5664}
.rghost{position:absolute;left:2px;right:2px;border:2px dashed #8EA2FF;background:rgba(142,162,255,.18);border-radius:3px;pointer-events:none;z-index:3}
.side-body{position:relative;height:calc(var(--units) * var(--u));width:var(--w);background:repeating-linear-gradient(to top,#171B21 0 1px,#1E242B 1px var(--u));border-left:4px solid #5A6577;border-right:4px solid #3A4250}
.sbar{position:absolute;left:0;height:calc(var(--u) - 3px);border-radius:2px;background:color-mix(in srgb,var(--c) 60%,#20262F)}
.sres{position:absolute;height:calc(var(--u) - 3px);background:repeating-linear-gradient(45deg,rgba(255,255,255,.2) 0 3px,transparent 3px 7px)}
.sres.over{background:repeating-linear-gradient(45deg,rgba(255,107,95,.85) 0 3px,transparent 3px 7px)}
.side-legend{display:flex;justify-content:space-between;font:500 11px var(--mono);color:var(--rack-muted);margin-top:8px}

/* Synoptique */
.syn-wrap{position:relative;min-height:0;background:var(--canvas);overflow:hidden;touch-action:none}
#syn{width:100%;height:100%;display:block;cursor:grab;user-select:none;-webkit-user-select:none}
#syn.panning{cursor:grabbing}
#syn .gmin{stroke:none;fill:none}
#syn .gmaj{stroke:none;fill:none}
#syn .gdot{fill:var(--dot)}
.node .box{fill:var(--bg);stroke:var(--fg);stroke-width:1.3}
.node .hdr{fill:var(--bg)}
.node .sep{stroke:var(--line-2)}
.node .nt{font:600 15.5px var(--font);fill:var(--fg)}
.node .ns{font:500 11.5px var(--mono);fill:var(--fg-3)}
.node .drag{cursor:move}
.ro .node .drag{cursor:default}
.node.sel .box{stroke:var(--accent);stroke-width:3}
.node.hl .box{stroke:var(--err);stroke-width:3}
.node.hl.info .box{stroke:var(--info)}
.port circle{fill:var(--bg);stroke:var(--c);stroke-width:2.5;cursor:crosshair}
.port:hover circle,.port.used circle{fill:var(--c)}
.port.armed circle{fill:var(--accent);stroke:var(--fg);stroke-width:3}
.ro .port circle{cursor:default}
.port text{font:500 13px var(--font);fill:var(--fg-2);pointer-events:none}
.cable .vis{fill:none;stroke:var(--c);stroke-width:2.2;stroke-linejoin:round}
.cable .hit{fill:none;stroke:transparent;stroke-width:16;cursor:pointer}
.cable.sel .vis{stroke-width:4}
.cable.hl .vis{stroke:var(--err);stroke-dasharray:8 5;stroke-width:3.2}
.cable.warnc .vis{stroke-dasharray:5 4}
.cable .lbl rect{fill:var(--bg);stroke:var(--fg);stroke-width:1}
.cable .lbl text{font:500 11.5px var(--mono);fill:var(--fg)}
.cable .lbl.none rect{stroke:var(--err);stroke-dasharray:3 2}
.cable .lbl.none text{fill:var(--err)}
.cable.sel .lbl rect{fill:var(--fg)} .cable.sel .lbl text{fill:var(--bg)}
.cable.off{display:none}
#preview{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-dasharray:7 5;pointer-events:none}
.floatbar{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:16px;display:flex;gap:2px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:4px;box-shadow:var(--shadow-lg)}
.floatbar .zl{font:500 13px var(--mono);min-width:52px;text-align:center;color:var(--fg-2)}
.synhint{position:absolute;top:16px;left:50%;transform:translateX(-50%);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:8px 18px;font-size:14.5px;color:var(--fg-2);box-shadow:var(--shadow-lg);white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
.synhint.armed{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.vcounts{display:flex;gap:8px;flex-wrap:wrap}
.vitem{display:flex;gap:12px;padding:12px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%;align-items:flex-start;cursor:pointer}
.vitem:hover b{text-decoration:underline;text-underline-offset:4px}
.vitem.on{background:var(--surface-2);padding-left:10px;border-radius:8px}
.vitem .ic{width:18px;height:18px;margin-top:3px}
.vitem.err .ic{color:var(--err)} .vitem.warn .ic{color:var(--warn)} .vitem.info .ic{color:var(--info)}
.vitem b{display:block;font-weight:600} .vitem span{font-size:14px;color:var(--fg-3)}
.layer{display:flex;align-items:center;gap:12px;font-size:15.5px;padding:5px 0;cursor:pointer}
.layer input{accent-color:var(--fg);width:18px;height:18px}
.layer b{margin-left:auto;font:500 14.5px var(--mono);color:var(--fg-3)}
.insp-num{display:flex;gap:10px;align-items:center}
.insp-num .input{font-family:var(--mono);font-weight:500}
.ends{display:flex;flex-direction:column;gap:8px;font-size:15.5px}
.ends div{display:grid;grid-template-columns:48px minmax(0,1fr);gap:8px}
.ends span{color:var(--fg-3)}

/* ---------- Recette ---------- */
.rc-head{display:grid;grid-template-columns:auto minmax(0,1fr);gap:56px;align-items:center}
.ring{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;position:relative}
.ring::before{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--bg)}
.ring div{position:relative;text-align:center}
.ring b{display:block;font:700 42px/1 var(--display);letter-spacing:-.03em}
.ring span{font-size:13.5px;color:var(--fg-3)}
.rc-counts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:32px}
.rc-count span{font-size:15px;color:var(--fg-2);display:flex;align-items:center;gap:8px}
.rc-count b{display:block;font:700 60px/1 var(--display);letter-spacing:-.04em;font-variant-numeric:tabular-nums;margin-bottom:8px}
.rc-group{padding:0}
.rc-group>header{display:flex;align-items:baseline;gap:12px;padding-bottom:14px;border-bottom:1.5px solid var(--fg)}
.rc-group>header b{font:600 24px var(--display);letter-spacing:-.02em}
.rc-group>header .muted{margin-left:auto;font:500 15px var(--mono)}
.rc-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 20px;padding:18px 0;border-bottom:1px solid var(--line);align-items:center}
.rc-main{display:flex;gap:14px;align-items:flex-start;min-width:0}
.rc-main .sw{margin-top:8px}
.rc-main b{font-weight:600}
.rc-main .path{color:var(--fg-2);font-size:15.5px;overflow-wrap:anywhere;margin-left:6px}
.rc-by{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:14px;color:var(--fg-3);flex-wrap:wrap}
.stseg{display:inline-flex;border:1px solid var(--line-2);border-radius:999px;padding:3px;gap:2px}
.stseg button{border:0;background:none;height:34px;padding:0 14px;font-size:14.5px;font-weight:500;color:var(--fg-3);border-radius:999px;white-space:nowrap}
.stseg button:hover{color:var(--fg);background:var(--surface-2)}
.stseg button.on.todo{background:var(--sunken);color:var(--fg)}
.stseg button.on.ok{background:var(--ok);color:#fff}
.stseg button.on.res{background:var(--soon);color:#fff}
.stseg button.on.ko{background:var(--urg);color:#fff}
.rc-comment{grid-column:1/-1;display:flex;flex-direction:column;gap:10px}
.rc-comment div{display:flex;gap:8px;justify-content:flex-end}

/* ---------- Catalogue ---------- */
.cat-name{display:flex;align-items:center;gap:12px;min-width:0}
.cat-name b{display:block;font-weight:600}
.cat-name span{font-size:14px;color:var(--fg-3)}
.ports{display:flex;gap:10px;flex-wrap:wrap}
.pchip{display:inline-flex;align-items:center;gap:5px;font:500 13px var(--mono);color:var(--fg-2)}
.pchip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.dup{background:var(--warn-soft);border-radius:12px;padding:12px 14px;font-size:14.5px;display:flex;flex-direction:column;gap:4px}
.dup b{color:var(--warn)}
.faceprev{background:var(--rack-metal);border-radius:10px;padding:16px 12px}
.faceprev .ritem{position:relative;cursor:default}

/* ---------- Administration ---------- */
.adm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:40px}
.sys-card{display:flex;flex-direction:column;gap:16px;border-top:1.5px solid var(--fg);padding-top:18px}
.sys-card header{display:flex;align-items:center;gap:12px}
.sys-card .si{color:var(--fg-3);display:grid}
.sys-card header b{display:block;font:600 22px var(--display);letter-spacing:-.015em} .sys-card header span{font-size:14px;color:var(--fg-3)}
.copyline{display:flex;gap:10px;align-items:center;padding:6px 6px 6px 18px;border:1px solid var(--line-2);border-radius:999px;margin-top:16px}
.copyline code{font:500 16px var(--mono);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ota{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:56px;margin-top:20px}
.ver{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.ver b{font:700 72px/1 var(--display);letter-spacing:-.04em}
.notes{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:16px;color:var(--fg-2)}
.steps{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column}

function secnav(groups,a,label,attr='data-go'){
 const all=groups.flatMap(g=>g.items), cur=all.find(x=>x[0]===a)||all[0], pos=all.indexOf(cur)+1;
 const lbl=g=>g.g?`<span class="sn-label ${g.lock?'lock':''}" ${g.lock?'title="Écrans de conception : une seule personne modifie à la fois, les autres voient en lecture seule"':''}>${g.g}${g.lock?ic('lock'):''}</span>`:'';
 const btn=([k,l,at,badge])=>`<button class="${k===a?'on':''}" ${at||attr}="${at==='data-soon'?l:k}" ${k===a?'aria-current="page"':''}>${l}${badge||''}</button>`;
 const flat=groups.length===1&&!groups[0].g;
 return `<nav class="subnav ${flat?'flat':''}" aria-label="${label}">
 <div class="sn-row">${groups.map(g=>`<div class="sn-group">${lbl(g)}<div class="sn-items">${g.items.map(btn).join('')}</div></div>`).join('')}</div>
 <details class="sn-pick"><summary>${groups.length>1?`<span class="sn-label">${(groups.find(g=>g.items.includes(cur))||{}).g||''}</span>`:''}<b>${cur[1]}</b><span class="pos">${pos} / ${all.length}</span><span class="chev">${ic('chevd')}</span></summary>
 <div class="sn-panel">${groups.map(g=>`${lbl(g)}${g.items.map(btn).join('')}`).join('')}</div></details>
 </nav>`;
}

const NW=220,HH=50,PS=26;
const node=id=>SYN.nodes.find(n=>n.id===id);

const portOf=p=>{const n=node(p[0]);return (p[1]==='o'?n.outs:n.ins)[p[2]]};

const pPos=p=>{const n=node(p[0]);return[p[1]==='o'?n.x+NW:n.x,n.y+HH+p[2]*PS+PS/2+2]};
const pName=p=>`${node(p[0]).nom} › ${portOf(p)[0]}`;
const same=(a,b)=>a[0]===b[0]&&a[1]===b[1]&&a[2]===b[2];
function cPath(c){
 const[x1,y1]=pPos(c.a),[x2,y2]=pPos(c.b);
 if(c.a[1]==='o'&&c.b[1]==='i'&&x2>x1+50){const mx=Math.round(x1+Math.max(100,(x2-x1)*.62)+((c.id%5)-2)*4);return{d:`M${x1} ${y1}H${mx}V${y2}H${x2}`,lx:x1+8,ly:y1,left:true}}
 const d1=c.a[1]==='o'?26:-26,d2=c.b[1]==='i'?-26:26,ym=Math.max(y1,y2)+28+(c.id%4)*6;
 return{d:`M${x1} ${y1}H${x1+d1}V${ym}H${x2+d2}V${y2}H${x2}`,lx:(x1+d1+x2+d2)/2,ly:ym};
}
function validate(){
 const out=[],by={};
 SYN.cables.forEach(c=>{if(c.num)(by[c.num]=by[c.num]||[]).push(c.id)});
 Object.entries(by).forEach(([n,ids])=>{if(ids.length>1)out.push({sev:'err',t:'Numéro en double',d:`${n} sur ${ids.length} câbles`,cables:ids})});
 SYN.cables.forEach(c=>{const a=portSig(c.a),b=portSig(c.b);if(a!==b)out.push({sev:'err',t:'Incompatibilité',d:`${c.num||'Sans numéro'} : ${SIG[a].n} → ${SIG[b].n}`,cables:[c.id]})});

 SYN.nodes.forEach(n=>{if(!SYN.cables.some(c=>c.a[0]===n.id||c.b[0]===n.id))out.push({sev:'info',t:'Équipement non câblé',d:n.nom,nodes:[n.id]})});
 return out;
}

 }).join('');
 const nodes=SYN.nodes.map(n=>{
  const h=nodeH(n),sel=SYN.sel&&SYN.sel.t==='n'&&SYN.sel.id===n.id,hn=(hl.nodes||[]).includes(n.id);
  let s=`<g class="node ${sel?'sel':''} ${hn?'hl '+(hl.sev||''):''}" data-node="${n.id}" transform="translate(${n.x},${n.y})"><rect class="box" width="${NW}" height="${h}" rx="10"/><path class="hdr" d="M0 10a10 10 0 0 1 10-10h${NW-20}a10 10 0 0 1 10 10v${HH-10}H0z"/><line class="sep" x1="0" x2="${NW}" y1="${HH}" y2="${HH}"/><circle cx="16" cy="${HH/2}" r="5" style="fill:${sigc(n.f)}"/><text class="nt" x="30" y="22">${esc(n.nom)}</text><text class="ns" x="30" y="40">${n.cont} · ${esc(n.rep)}</text><rect class="drag" width="${NW}" height="${HH}" fill="transparent"/>`;

 let a=SYN.pend;SYN.pend=null;$('#preview')&&$('#preview').setAttribute('d','');
 if(same(a,b)){synDraw();setHint();return}

 SYN.cables=SYN.cables.filter(c=>!rem.includes(c));

function mountSyn(){

 const parse=s=>{const p=s.split(':');return[p[0],p[1],+p[2]]};
 const prev=e=>{if(!SYN.pend)return;const[x1,y1]=pPos(SYN.pend),[x2,y2]=toW(e);$('#preview').setAttribute('d',`M${x1} ${y1}L${x2} ${y2}`)};
 svg.addEventListener('pointerdown',e=>{

  drag={t:'pan',sx:e.clientX,sy:e.clientY,vx:SYN.x,vy:SYN.y,moved:false};svg.setPointerCapture(e.pointerId);svg.classList.add('panning');
 });
 svg.addEventListener('pointermove',e=>{
  if(SYN.pend)prev(e);

  if(drag.t==='pan'){const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;if(Math.abs(dx)+Math.abs(dy)>3){drag.moved=true;SYN.userMoved=true}SYN.x=drag.vx+dx;SYN.y=drag.vy+dy;applyView()}
  else if(drag.t==='node'){const[wx,wy]=toW(e);drag.n.x=Math.round((wx-drag.ox)/10)*10;drag.n.y=Math.round((wy-drag.oy)/10)*10;synDraw()}

 });

  svg.classList.remove('panning');if(!drag)return;const d=drag;drag=null;
  if(d.t==='cable'){const el=document.elementFromPoint(e.clientX,e.clientY);const p=el&&el.closest&&el.closest('[data-port]');if(p&&p.dataset.port!==d.start.join(':'))finishCable(parse(p.dataset.port));else if(d.moved){SYN.pend=null;$('#preview').setAttribute('d','');synDraw();setHint()}}

  else if(d.t==='node')$('#synSide').innerHTML=synSide();
 });

 wrap.addEventListener('click',e=>{const z=e.target.closest('[data-z]');if(z){zoomAt(+z.dataset.z>0?1.2:1/1.2,wrap.clientWidth/2,wrap.clientHeight/2)}});

const OTA_STEPS=['Téléchargement du paquet signé (41,8 Mo)','Vérification de la signature ed25519','Contrôle d’intégrité SHA-256','Essai du nouveau moteur à blanc','Bascule vers la version 1.5.0','Redémarrage du service strata-arkyo'];
function otaCard(){
 const o=S.ota;
 if(o.phase==='idle'&&o.cur===o.next) return `<section class="card"><div class="card-head"><h2>Mise à jour OTA</h2><span class="chip ok">${ic('ok')}À jour</span></div><div class="ver"><b>${o.cur}</b><span class="muted">installée aujourd’hui · version 1.4.2 conservée pour retour arrière</span></div><div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap"><button class="btn sm" data-act="otacheck">${ic('refresh','sm')}Rechercher une mise à jour</button><button class="btn sm" data-act="otaroll">${ic('undo','sm')}Revenir à 1.4.2</button></div></section>`;
 if(o.phase==='idle') return `<section class="card"><div class="card-head"><h2>Mise à jour OTA</h2><span class="chip accent">${ic('download')}Disponible</span></div>
  <div class="ota"><div style="display:flex;flex-direction:column;gap:12px"><div class="ver"><b>${o.next}</b><span class="muted">canal ${o.canal} · publiée le 9 novembre 2026</span></div>
   <ul class="notes"><li>Synoptique : tracé multi-câbles vers des ports consécutifs.</li><li>Recette : journal par point exportable dans le procès-verbal.</li><li>Moteur : validation du câblage 3× plus rapide sur les projets de plus de 1 000 câbles.</li><li>Format de stockage enrichi de façon additive : retour à 1.4.2 possible.</li></ul></div>
   <div style="display:flex;flex-direction:column;gap:10px"><dl class="kv"><dt>Installée</dt><dd>${o.cur}</dd><dt>Taille</dt><dd>41,8 Mo</dd><dt>Interruption</dt><dd>≈ 20 secondes</dd><dt>Utilisateurs prévenus</dt><dd>4 connectés</dd></dl>
   <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:auto"><button class="btn primary" data-act="otarun">${ic('download','sm')}Installer maintenant</button><button class="btn" data-act="otanight">${ic('clock','sm')}Cette nuit à 03:30</button></div></div></div></section>`;
 return `<section class="card"><div class="card-head"><h2>Installation de ${o.next}</h2>${o.phase==='done'?`<span class="chip ok">${ic('ok')}Terminée</span>`:'<span class="chip accent">En cours</span>'}</div>
  <ol class="steps">${OTA_STEPS.map((s,i)=>{const st=o.phase==='done'||i<o.step?'done':i===o.step?'act':'';return `<li class="${st}">${st==='done'?`<span class="st-i">${ic('ok')}</span>`:st==='act'?'<span class="spinner"></span>':'<span class="st-i"></span>'}<span>${s}</span><span class="mono small muted">${i===0&&st==='act'?o.pct+' %':''}</span></li>`}).join('')}</ol>
  ${i0bar(o)}${o.phase==='done'?`<div class="alert info" style="margin-top:12px">${ic('info')}<span>Strata Arkyo ${o.next} est active. La version ${o.prev} reste installée : retour automatique si le moteur ne démarre pas 3 fois de suite.</span></div><button class="btn sm" style="margin-top:12px" data-act="otaok">Fermer</button>`:''}</section>`;
}
const i0bar=o=>o.phase==='run'&&o.step===0?`<div class="bar" style="margin-top:10px"><i style="width:${o.pct}%"></i></div>`:'';

function runOta(){
 const o=S.ota;o.phase='run';o.step=0;o.pct=0;o.prev=o.cur;
 const draw=()=>{const b=$('#admBody');if(b&&S.adm==='maj'&&route()==='admin')b.innerHTML=admBody()};draw();
 const dl=setInterval(()=>{o.pct=Math.min(100,o.pct+9);draw();if(o.pct>=100){clearInterval(dl);next()}},140);
 const next=()=>{o.step++;draw();if(o.step<OTA_STEPS.length){setTimeout(next,o.step===3?1500:900)}else{o.phase='done';o.cur=o.next;NOTIFS=NOTIFS.filter(n=>n.ic!=='download');draw();chrome(route());toast(`Strata Arkyo ${o.cur} est active.`)}};
}

 return [

  {t:'Comment s’appelle le projet ?',b:()=>`<div class="field"><label for="wzNom">Nom du projet</label><input class="input" id="wzNom" data-wzi="nom" value="${esc(d.nom)}" placeholder="Ex. Finale régionale de basket" autocomplete="off">${nameHelp()}</div>`,v:()=>!d.nom.trim()?'Le nom est obligatoire.':nameTaken()?'Un projet porte déjà ce nom.':'',r:['Nom',d.nom]},
  {t:'Pour quel client ?',b:()=>`<div class="seg">${[['interne','Projet interne'],['externe','Client externe']].map(([k,l])=>`<button class="${d.ct===k?'on':''}" data-wz="ct" data-v="${k}">${l}</button>`).join('')}</div>${d.ct==='externe'?`<div class="field"><label for="wzCl">Nom du client</label><input class="input" id="wzCl" data-wzi="client" list="clients" value="${esc(d.client)}" placeholder="Commencez à taper…" autocomplete="off"><datalist id="clients">${[...new Set(PROJ.map(p=>p.client).filter(c=>c!=='Projet interne'))].map(c=>`<option value="${esc(c)}">`).join('')}</datalist><span class="help">Suggestions tirées des clients déjà saisis.</span></div>`:''}`,v:()=>d.ct==='externe'&&!d.client.trim()?'Le nom du client est obligatoire.':'',r:['Client',d.ct==='interne'?'Projet interne':d.client]},
  {t:'Quelles dates ?',b:()=>`<div class="form-grid"><div class="field"><label for="w1">Début de planification</label><input class="input" type="date" id="w1" data-wzi="p0" min="${TODAY_ISO}" value="${d.p0}"></div><div class="field"><label for="w2">Fin de planification</label><input class="input" type="date" id="w2" data-wzi="p1" min="${d.p0||TODAY_ISO}" value="${d.p1}"></div>
   ${d.inter==='Prestation'?`<div class="field"><label for="w3">Début de tournage</label><input class="input" type="date" id="w3" data-wzi="t0" min="${TODAY_ISO}" value="${d.t0}"></div><div class="field"><label for="w4">Fin de tournage</label><input class="input" type="date" id="w4" data-wzi="t1" min="${d.t0||TODAY_ISO}" value="${d.t1}"></div>`:`<div class="field span"><label for="w5">Mise en service</label><input class="input" type="date" id="w5" data-wzi="ms" min="${d.p1||TODAY_ISO}" value="${d.ms}"><span class="help">Strictement après la fin de planification.</span></div>`}</div>`,
   v:()=>{if(!d.p0||!d.p1)return'Les dates de planification sont obligatoires.';if(d.p0<TODAY_ISO)return'Pas de date passée.';if(d.p1<d.p0)return'La fin doit suivre le début.';if(d.inter==='Prestation'){if(!d.t0||!d.t1)return'Les dates de tournage sont obligatoires.';if(d.t0<TODAY_ISO)return'Pas de date passée.';if(d.t1<d.t0)return'Le tournage doit finir après son début.'}else{if(!d.ms)return'La date de mise en service est obligatoire.';if(d.ms<=d.p1)return'La mise en service doit suivre la fin de planification.'}return''},
   r:['Dates',d.inter==='Prestation'?`Tournage ${d.t0?fdate(d.t0):'?'} → ${d.t1?fdate(d.t1):'?'}`:`Mise en service ${d.ms?fdate(d.ms):'?'}`]},
  {t:'Où se déroule-t-il ?',b:()=>`<div class="field"><label for="wzL">Lieu du projet</label><input class="input" id="wzL" data-wzi="lieu" value="${esc(d.lieu)}" placeholder="Ex. Palais des sports, Angers"></div><div class="field"><label for="wzE">Premier emplacement</label><input class="input" id="wzE" data-wzi="emp" value="${esc(d.emp)}" placeholder="Ex. Régie, Plateau, Car régie"><span class="help">Obligatoire. Son code câble sera dérivé du nom.</span></div>`,v:()=>d.emp.trim()?'':'Le premier emplacement est obligatoire.',r:['Emplacement',`${d.emp}${d.lieu?' · '+d.lieu:''}`]},
  {t:'Premier contenant',b:()=>`<div class="form-grid"><div class="field"><label for="wzCt">Type</label><select class="input" id="wzCt" data-wzi="ctype">${['Baie 19"','Flight-case','Valise rigide type SKB','Valise étanche type Peli','Mobilier'].map(t=>`<option ${t===d.ctype?'selected':''}>${t}</option>`).join('')}</select></div><div class="field"><label for="wzCn">Nom</label><input class="input" id="wzCn" data-wzi="cnom" value="${esc(d.cnom)}" placeholder="Ex. Flight-case vidéo"></div><div class="field"><label for="wzCu">Hauteur (U)</label><input class="input" id="wzCu" type="number" min="1" max="56" data-wzi="cu" value="${d.cu}"></div></div>`,v:()=>d.cnom.trim()?'':'Donnez un nom au contenant.',r:['Contenant',`${d.cnom} · ${d.ctype} · ${d.cu} U`]},
  {t:'Une description ?',b:()=>`<div class="field"><label for="wzD">Description (facultative)</label><textarea class="input" id="wzD" data-wzi="desc" placeholder="Contexte, contraintes, interlocuteurs…">${esc(d.desc)}</textarea></div>`,v:()=>'',r:['Description',d.desc||'—']},
 ];

function linkGeo(l){
 const a=SCH.objs.find(o=>o.id===l.a),b=SCH.objs.find(o=>o.id===l.b);if(!a||!b)return null;
 const hor=b.x-a.x>BW;let x1,y1,x2,y2,d,lx,ly,dir;
 if(hor){x1=a.x+BW/2;y1=a.y;x2=b.x-BW/2;y2=b.y;dir=[1,0];const mx=(x1+x2)/2;
  d=l.style==='droit'?`M${x1} ${y1}L${x2} ${y2}`:l.style==='courbe'?`M${x1} ${y1}C${mx} ${y1} ${mx} ${y2} ${x2} ${y2}`:`M${x1} ${y1}H${mx}V${y2}H${x2}`;lx=mx;ly=(y1+y2)/2}
 else{const dn=b.y>a.y;x1=a.x;y1=a.y+(dn?BH/2:-BH/2);x2=b.x;y2=b.y+(dn?-BH/2:BH/2);dir=[0,dn?1:-1];const my=(y1+y2)/2;
  d=l.style==='droit'?`M${x1} ${y1}L${x2} ${y2}`:l.style==='courbe'?`M${x1} ${y1}C${x1} ${my} ${x2} ${my} ${x2} ${y2}`:`M${x1} ${y1}V${my}H${x2}V${y2}`;lx=(x1+x2)/2;ly=my}
 if(l.style==='droit'){const L=Math.hypot(x2-x1,y2-y1)||1;dir=[(x2-x1)/L,(y2-y1)/L]}
 const bx=x2-dir[0]*1.3,by=y2-dir[1]*1.3,arrow=`${x2},${y2} ${bx-dir[1]*.65},${by+dir[0]*.65} ${bx+dir[1]*.65},${by-dir[0]*.65}`;
 return{d,lx,ly,arrow};
}

}

 const rs=t.closest('[data-rst]');if(rs){const row=rs.closest('[data-rc]'),k2=row.dataset.rc,s=rs.dataset.rst;S.rc.st[k2]=s;if(s==='todo'){delete S.rc.by[k2];S.rc.open=null}else{S.rc.by[k2]={u:'dp',w:'11/11 '+new Date().toTimeString().slice(0,5),c:(S.rc.by[k2]||{}).c||''};S.rc.open=(s==='res'||s==='ko')?k2:null}rcRefresh(k2);if(S.rc.open)setTimeout(()=>{const x=$('#rcc');x&&(x.focus(),x.setSelectionRange(x.value.length,x.value.length))},20);return}
 const rf=t.closest('[data-rf]');if(rf){S.rc.f=rf.dataset.rf;$$('[data-rf]').forEach(b=>b.classList.toggle('on',b===rf));$('#rcBody').innerHTML=rcBody();return}
 const cr=t.closest('[data-cat]');if(cr){catDrawer(cr.dataset.cat);return}
 const cf=t.closest('[data-cf]');if(cf){S.cat.f=cf.dataset.cf;$$('[data-cf]').forEach(b=>b.classList.toggle('on',b===cf));$('#catBody').innerHTML=catRows();return}
 const ad=t.closest('[data-adm]');if(ad){S.adm=ad.dataset.adm;render();return}
 const cn=t.closest('[data-canal]');if(cn){S.ota.canal=cn.dataset.canal;$('#admBody').innerHTML=admBody();return}
 const wz=t.closest('[data-wz]');if(wz){WZ.d[wz.dataset.wz]=wz.dataset.v;if(wz.dataset.wz==='inter'&&WZ.d.inter==='Prestation'&&WZ.d.regie==='Installation fixe')WZ.d.regie='';wzRender();return}
 const wg=t.closest('[data-wzgo]');if(wg){WZ.i=+wg.dataset.wzgo;wzRender();return}
 const nl=t.closest('#ncLarg button');if(nl){$$('#ncLarg button').forEach(b=>b.classList.toggle('on',b===nl));return}
 if(t.closest('#modal')&&!t.closest('#dialog'))return closeModal();
 if(!t.closest('#notifs')&&!t.closest('#bellBtn'))$('#notifs').hidden=true;
});
function selectText(el){const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);toast('Adresse sélectionnée : copiez-la avec Ctrl+C','info')}
function addToCont(c){
 const id=S.inv.cont;
 if(id==='bv1'){const n={id:'r'+(++uid),nom:c.nom,h:c.u,larg:c.larg==='1/2'?.5:1,sig:c.f,poids:c.poids,w:c.w,prof:c.prof,kind:'eq',rep:nextRep()};RACK.pending.push(n)}
 else{const a=CONT[id].arts.find(x=>x.nom===c.nom);if(a)a.qty++;else CONT[id].arts.push({nom:c.nom,kind:'eq',h:CONT[id].rack?c.u:0,qty:1,poids:c.poids,w:c.w,sig:c.f})}
 $('#invMain').innerHTML=invMain();const r=$(`#arts tr[data-an="${CSS.escape(c.nom)}"]`);r&&r.classList.add('flash');
 const s=contStats(id),C=CONT[id];
 if(C.rack&&s.U>C.u)toast(`Plus assez de place : ${s.U} U pour ${C.u} U disponibles.`,'warn');else toast(`${esc(c.nom)} ajouté à ${C.nom}`);
}
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.id==='pq'){S.pf.q=t.value;$('#plist').innerHTML=projList();return}
 if(t.id==='rq'){S.rc.q=t.value;$('#rcBody').innerHTML=rcBody();return}
 if(t.id==='cq'){S.cat.q=t.value;$('#catBody').innerHTML=catRows();return}
 if(t.id==='amq'){$('#amList').innerHTML=amList(t.value);return}
 if(t.id==='palIn'){PAL.q=t.value;PAL.i=0;palDraw();return}
 if(t.dataset.wzi){WZ.d[t.dataset.wzi]=t.value;if(t.dataset.wzi==='nom'){const h=$('#nmh');h.outerHTML=nameHelp()}return}
 if(t.id==='ncName'){const q=norm(t.value);const box=$('#ncDup');if(q.length<2){box.innerHTML='';return}
  const m=CAT.filter(c=>norm(c.nom).includes(q)||norm(c.marque).includes(q)).slice(0,5);
  box.innerHTML=m.length?`<div class="dup"><b>${m.length} fiche${m.length>1?'s':''} proche${m.length>1?'s':''} dans le catalogue</b>${m.map(c=>`<span>${esc(c.nom)} · ${esc(c.marque)} <span class="muted">(${norm(c.nom).includes(q)?'nom':'marque'})</span></span>`).join('')}</div>`:'<span class="help ok">Aucun doublon trouvé.</span>';return}
 if(t.id==='ncW'){const v=Math.round((+t.value||0)*3.412);$('#ncBtu').placeholder=v;$('#ncBtuHelp').textContent=`Suggestion : ${nf(v)} (puissance × 3,412)`}
});
document.addEventListener('change',e=>{
 const ph=e.target.dataset&&e.target.dataset.phase;if(ph){const it=RACK.items.find(i=>i.id===ph);it.ph=e.target.value;rackRefresh();toast(`${esc(it.nom)} passe sur la phase ${it.ph}`);return}
 const hf=e.target.dataset&&e.target.dataset.hf;if(hf!==undefined){const h=HF[+hf];h.f=(+e.target.value).toFixed(3);$('#netBody').innerHTML=hfHtml();toast(`${esc(h.eq)} : ${h.f.replace('.',',')} MHz`);return}
 if(e.target.id==='pStatut'){P.statut=e.target.value;render();toast(`Statut du projet : ${P.statut}`)}
});
document.addEventListener('submit',e=>{if(e.target.id==='scanForm'){e.preventDefault();doScan($('#scanIn').value)}});
document.addEventListener('keydown',e=>{
 if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#modal').hidden?openPalette():closeModal();return}
 if(e.key==='Escape'){if(PLAN.placing){PLAN.placing=null;planAll();return}if(SYN.pend){SYN.pend=null;const p=$('#preview');p&&p.setAttribute('d','');synDraw();setHint();return}if(RACK.placing){RACK.placing=null;if(route()==='racks')rackRefresh();return}closeAll();return}
 if($('#palIn')&&document.activeElement===$('#palIn')){const l=palFiltered();if(e.key==='ArrowDown'){PAL.i=Math.min(l.length-1,PAL.i+1);palDraw();e.preventDefault()}if(e.key==='ArrowUp'){PAL.i=Math.max(0,PAL.i-1);palDraw();e.preventDefault()}if(e.key==='Enter'&&l[PAL.i]){const x=l[PAL.i];closeModal();x.run()}return}
 if(e.key==='Enter'&&$('.wz-body')&&!$('#modal').hidden&&e.target.tagName!=='TEXTAREA'){e.preventDefault();wzNext()}
 if((e.key==='Delete'||e.key==='Backspace')&&route()==='synoptique'&&SYN.sel&&SYN.sel.t==='c'&&editable()&&!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)){const c=SYN.cables.find(x=>x.id===SYN.sel.id);if(c.id<100||c.inRev)SYN.del++;SYN.cables=SYN.cables.filter(x=>x!==c);SYN.sel=null;synAll();toast(`Câble ${c.num||'sans numéro'} supprimé`,'warn')}
});
$('#menuBtn').innerHTML=ic('menu');
$('#menuBtn').onclick=()=>{$('#sidebar').classList.add('open')};
$('#scrim').onclick=()=>{$('#sidebar').classList.remove('open');closeDrawer();$('#scrim').classList.remove('open')};
$('#searchBtn').innerHTML=`${ic('search')}<span>Rechercher…</span><kbd>⌘K</kbd>`;
$('#searchBtn').onclick=openPalette;
$('#themeBtn').onclick=toggleTheme;
$('#bellBtn').onclick=e=>{e.stopPropagation();notifs()};
window.addEventListener('hashchange',render);

/* ================= Simulation du temps réel ================= */
function live(){
 const r=route();
 if(DESIGN.has(r)||!$('#modal').hidden)return;
 if(r==='inventaire'){
  const arts=artsOf(S.inv.cont).filter(a=>!a.rack);if(!arts.length)return;
  const a=arts[Math.floor(Math.random()*arts.length)];const d=a.qty>1&&Math.random()<.5?-1:1;a.qty+=d;$('#invMain').innerHTML=invMain();
  const row=$(`#arts tr[data-an="${CSS.escape(a.nom)}"]`);row&&row.classList.add('flash');
  toast(`Léa Martin a ${d>0?'ajouté':'retiré'} 1 × ${esc(a.nom)}`,'ok','lm');pushFeed('lm',`a modifié la quantité de ${a.nom} dans`,CONT[S.inv.cont].nom);return;
 }
 if(r==='recette'){
  const it=rcItems().filter(x=>rcSt(x.k)==='todo');if(!it.length)return;const x=it[0];S.rc.st[x.k]='ok';S.rc.by[x.k]={u:'hb',w:'11/11 '+new Date().toTimeString().slice(0,5),c:''};
  rcRefresh(x.k);toast(`Hugo Bernard a passé ${esc(x.t)} en OK`,'ok','hb');pushFeed('hb',`a passé ${x.t} en OK sur`,P.nom);return;
 }
 if(r==='projet'){const t=TASKS.find(t=>t.st==='À faire'&&t.u!=='dp');if(!t)return;t.st='En cours';const b=$('#tasks tbody');if(b){b.innerHTML=tasksRows();b.querySelector(`[data-ti="${TASKS.indexOf(t)}"]`).classList.add('flash')}toast(`${U[t.u].n} a commencé « ${esc(t.t)} »`,'ok',t.u);return}
 if(r==='preparation'){const it=prepItems(),set=PREP.done[PREP.phase],x=it.find(i=>!set.has(i.code));if(!x)return;set.add(x.code);PREP.flash=x.code;prepRefresh(true);toast(`Hugo Bernard a scanné ${esc(x.nom)} ${x.code}`,'ok','hb');return}
 if(r==='catalogue'){const c=CAT[Math.floor(Math.random()*CAT.length)];c.w+=5;c.fresh=true;$('#catBody').innerHTML=catRows();c.fresh=false;toast(`Sofia Roux a modifié la fiche « ${esc(c.nom)} »`,'ok','sr');return}
 if(r==='accueil'){const ev=[['sr','a placé 2 × Enregistreur 1U SSD dans','Baie vidéo V1'],['lm','a ajouté le point de recette « Retour PGM caméras » à',P.nom],['hb','a coché 8 contrôles de construction de','Baie audio A1']];const x=ev[Math.floor(Math.random()*ev.length)];pushFeed(...x);const f=$('#feed');f&&(f.innerHTML=feedHtml());FEED[0].fresh=false;}
}
function pushFeed(u,t,o){FEED.unshift({u,t,o,w:'à l’instant',fresh:true});FEED.length=Math.min(FEED.length,12);setTimeout(()=>{FEED.forEach(f=>f.fresh=false)},100)}
setInterval(live,10000);

/* ================= Démarrage ================= */
(function(){const t=store.get('sa-theme');if(t)document.documentElement.dataset.theme=t;themeIcon();render()})();
</script>
