 <rect class="pl-court" x="15" y="13" width="40" height="20"/><line class="pl-line" x1="35" y1="13" x2="35" y2="33"/><path class="pl-line" d="M15 17A6 6 0 0 1 21 23A6 6 0 0 1 15 29M55 17A6 6 0 0 0 49 23A6 6 0 0 0 55 29"/>
 <text class="pl-lbl" x="35" y="24.4" text-anchor="middle">Terrain 40 × 20 m</text>
 <rect class="pl-door" x="-0.5" y="29" width="1" height="6"/><text class="pl-lbl sm" x="-1.2" y="37" text-anchor="end">Accès technique</text>
 <text class="pl-lbl" x="-12" y="22" text-anchor="middle">Parking cars régie</text>`;
 if(L.cable)PLAN.routes.forEach(r=>{const P=routePts(r),l=routeLen(r);let bi=1,bl=0;for(let i=1;i<P.length;i++){const d=Math.hypot(P[i][0]-P[i-1][0],P[i][1]-P[i-1][1]);if(d>bl){bl=d;bi=i}}const mx=(P[bi][0]+P[bi-1][0])/2,my=(P[bi][1]+P[bi-1][1])/2,txt=nf(l.tot,1)+' m',w=txt.length*0.82+1.2;s+=`<g class="route" style="--c:${sigc(r.sig)}"><path d="M${P.map(p=>p.join(' ')).join('L')}"/><g transform="translate(${mx-w/2},${my-1})"><rect width="${w}" height="2" rx="0.4"/><text x="${w/2}" y="1.45" text-anchor="middle">${txt}</text></g></g>`});
 PLAN.objs.forEach(o=>{if(!L[o.lay])return;const sel=PLAN.sel===o.id?'sel':'',c=PLAY[o.lay][1];
  if(o.lay==='cont')s+=`<g class="obj cont ${sel}" data-obj="${o.id}" style="--c:${c}"><rect class="shape" x="${o.x-o.w/2}" y="${o.y-o.h/2}" width="${o.w}" height="${o.h}" rx="${Math.min(.4,o.h/4)}"/><text class="pl-name" x="${o.x}" y="${o.y+o.h/2+1.9}" text-anchor="middle">${esc(o.nom)}</text></g>`;
  else if(o.lay==='v'&&o.dir!==undefined)s+=`<g class="obj ${sel}" data-obj="${o.id}" style="--c:${c}"><path class="cone" d="${cone(o)}"/><circle class="shape" cx="${o.x}" cy="${o.y}" r="1"/><text class="pl-name" x="${o.x}" y="${o.y-1.7}" text-anchor="middle">${esc(o.nom.split(' · ')[0])}</text></g>`;
  else s+=`<g class="obj ${sel}" data-obj="${o.id}" style="--c:${c}"><circle class="shape" cx="${o.x}" cy="${o.y}" r="0.9"/><text class="pl-sym" x="${o.x}" y="${o.y+0.38}" text-anchor="middle">${o.lay==='a'?(o.id.startsWith('hp')?'E':'M'):o.lay==='l'?'L':'V'}</text></g>`;
 });
 return s;
}
function cartoPend(){const groups=['v','a','l'];return groups.map(g=>{const l=PLAN.todo.filter(o=>o.lay===g),n=PLAN.objs.filter(o=>o.lay===g).length;return `<section><h2>${PLAY[g][0]} <span class="muted small">${n} placés</span></h2>${l.length?l.map(o=>`<button class="pend ${PLAN.placing===o.id?'on':''}" data-plpend="${o.id}"><span class="sw" style="--c:${PLAY[g][1]}"></span><span style="min-width:0"><b>${esc(o.nom)}</b><span>À placer</span></span></button>`).join(''):'<p class="small muted">Tout est placé.</p>'}</section>`}).join('')}
function cartoSide(){
 const o=pobj(PLAN.sel),ro=editable()?'':'disabled';
 if(o){

  <dl class="kv"><dt>Position</dt><dd class="mono">x ${nf(o.x,1)} m · y ${nf(o.y,1)} m</dd>${o.z!==undefined?`<dt>Hauteur</dt><dd>${nf(o.z,1)} m</dd>`:''}<dt>Étage</dt><dd>Niveau 0 · salle</dd></dl>
  ${o.dir!==undefined?`<div class="field"><label for="pdir">Orientation · ${((o.dir%360)+360)%360}°</label><input type="range" id="pdir" data-pl="dir" min="-180" max="180" value="${o.dir}" ${ro}></div><div class="field"><label for="pfov">Angle de champ · ${o.fov}°</label><input type="range" id="pfov" data-pl="fov" min="8" max="90" value="${o.fov}" ${ro}></div>`:''}
  ${links.length?`<section><h3>Liaisons</h3>${links.map(r=>{const l=routeLen(r);return `<div class="layer"><span class="sw" style="--c:${sigc(r.sig)}"></span>${esc(r.nom)}<b>${nf(l.tot,1)} m</b></div>`}).join('')}</section>`:''}
  ${editable()&&o.lay!=='cont'?`<button class="btn sm danger" data-act="plremove">${ic('trash','sm')}Retirer du plan</button>`:''}</section>`;
 }
 return `<section><h2>Longueurs de tirage</h2>${PLAN.routes.map(r=>{const l=routeLen(r);return `<div class="lenrow"><div><b>${esc(r.nom)}</b><span>${esc(pobj(r.a).nom)} → ${esc(pobj(r.b).nom)}</span><span>plan ${nf(l.plan,1)} m${l.up?` + montées ${nf(l.up,1)} m`:''}</span></div><strong class="mono">${nf(l.tot,1)} m</strong></div>`}).join('')}
 <p class="small muted">Somme des segments et des montées, arrondie aux 10 cm supérieurs. Déplacez un contenant : les longueurs suivent.</p></section>
 <section><h2>À tracer</h2><div class="todo" style="padding-top:4px"><span class="ti warn">${ic('alert','sm')}</span><span><b>CR-2 → Tribune presse</b><span>Le niveau +1 n'a pas encore de fond de plan.</span></span></div></section>
 <section><h2>Calques</h2>${Object.entries(PLAY).map(([k,[n,c]])=>`<label class="layer"><input type="checkbox" data-play="${k}" ${PLAN.lay[k]?'checked':''}><span class="sw" style="--c:${c}"></span>${n}<b>${k==='cable'?PLAN.routes.length:PLAN.objs.filter(o=>o.lay===k).length}</b></label>`).join('')}</section>`;
}
function vPlans(){
 return `<div class="design ${editable()?'':'ro'}" style="display:flex;flex-direction:column;height:100%;min-height:0">
 <div class="design-top">${projTop('plans',true)}${lockbar('ce plan')}
  <div class="dtool">

   ${PLAN.mode==='carto'?`<div class="seg"><button class="on">Niveau 0 · salle</button><button data-soon="Niveau +1 · tribune presse">Niveau +1</button></div>`:''}
   ${PLAN.mode==='feu'?`<span class="muted small">Afficher</span><div class="seg">${[['num','Numéro'],['adr','Adresse'],['canal','Canaux']].map(([k,l])=>`<button class="${FEU.disp===k?'on':''}" data-fdisp="${k}">${l}</button>`).join('')}</div>`:''}
   <span class="gap"></span>
   ${PLAN.mode==='carto'?`<span class="muted small">Échelle calibrée : 2 repères, 40,0 m</span><button class="btn sm" data-soon="Outil de mesure">${ic('fit','sm')}Mesurer</button>`:PLAN.mode==='schema'?`<span class="muted small">Page 1 sur 2 · Vue d’ensemble</span>`:`<span class="muted small">Pont nord et pont sud · 7 m</span>`}
   <button class="btn sm" data-soon="Export du plan">${ic('download','sm')}Exporter</button>
  </div>
 </div>
 <div class="design-body">
  <aside class="pane left" id="planPend">${planPend()}</aside>
  <div class="syn-wrap" id="planWrap">
   <svg id="plan" aria-label="Plan du lieu"><defs><pattern id="pgrid" width="5" height="5" patternUnits="userSpaceOnUse"><path class="pl-grid" d="M5 0H0V5"/></pattern></defs><g id="pworld"><rect x="-200" y="-200" width="500" height="400" fill="url(#pgrid)"/><g id="pcontent">${planSvg()}</g></g></svg>
   <div class="synhint" id="planHint">${planHint()}</div>
   <div class="floatbar"><button class="icon-btn sm" data-pz="-1" aria-label="Zoom arrière">${ic('zout')}</button><span class="zl" id="pzl">100 %</span><button class="icon-btn sm" data-pz="1" aria-label="Zoom avant">${ic('zin')}</button><button class="icon-btn sm" data-act="pfit" aria-label="Tout afficher">${ic('fit')}</button><span class="scalebar" id="pscale"></span></div>
  </div>
  <aside class="pane right" id="planSide">${planSide()}</aside>

function planView(){const w=$('#pworld');if(!w)return;w.setAttribute('transform',`translate(${PLAN.x},${PLAN.y}) scale(${PLAN.k*10})`);$('#pzl').textContent=Math.round(PLAN.k*100)+' %';const px=PLAN.k*10*10;$('#pscale').innerHTML=PLAN.mode==='schema'?'':`<i style="width:${px}px"></i>10 m`}
function planAll(){const c=$('#pcontent');if(!c)return;c.innerHTML=planSvg();$('#planSide').innerHTML=planSide();$('#planPend').innerHTML=planPend();const h=$('#planHint');if(h){if(PLAN.placing){const o=curTodo().find(x=>x.id===PLAN.placing);h.className='synhint armed';h.textContent=`Touchez le plan pour poser ${o?oname(o):''} (Échap pour annuler)`}else{h.className='synhint';h.textContent=planHint()}}}
function planFit(){const w=$('#planWrap');if(!w)return;const W=w.clientWidth,H=w.clientHeight,[x0,x1,y0,y1]={carto:[-26,72,-2,48],schema:[-3,110,-6,46],feu:[8,74,4,42]}[PLAN.mode];PLAN.k=Math.max(.3,Math.min(3,Math.min(W/((x1-x0)*10),(H-60)/((y1-y0)*10))*.96));PLAN.x=(W-(x1-x0)*PLAN.k*10)/2-x0*PLAN.k*10;PLAN.y=40+((H-60)-(y1-y0)*PLAN.k*10)/2-y0*PLAN.k*10;planView()}
function planZoom(f,cx,cy){const k2=Math.max(.3,Math.min(4,PLAN.k*f));PLAN.x=cx-(cx-PLAN.x)*(k2/PLAN.k);PLAN.y=cy-(cy-PLAN.y)*(k2/PLAN.k);PLAN.k=k2;PLAN.userMoved=true;planView()}
function mountPlan(){
 const svg=$('#plan'),wrap=$('#planWrap');let drag=null;
 const toW=e=>{const r=svg.getBoundingClientRect();return[(e.clientX-r.left-PLAN.x)/(PLAN.k*10),(e.clientY-r.top-PLAN.y)/(PLAN.k*10)]};
 svg.addEventListener('pointerdown',e=>{
  const g=e.target.closest('[data-obj]');
  if(PLAN.placing&&editable()){const[x,y]=toW(e);const T=curTodo(),i=T.findIndex(o=>o.id===PLAN.placing);const o=T.splice(i,1)[0];o.x=Math.round(x*10)/10;o.y=Math.round(y*10)/10;curObjs().push(o);PLAN.placing=null;PLAN.sel=o.id;if(o.lay)PLAN.lay[o.lay]=1;planAll();toast(`${esc(oname(o))} posé`);return}
  const lk=e.target.closest('[data-link]');if(lk&&!g){PLAN.selLink=+lk.dataset.link;PLAN.sel=null;planAll();return}
  if(g){const o=curObjs().find(x=>x.id===g.dataset.obj);PLAN.sel=o.id;PLAN.selLink=null;const[x,y]=toW(e);if(editable())drag={t:'obj',o,ox:x-o.x,oy:y-o.y,moved:false};svg.setPointerCapture(e.pointerId);planAll();return}
  drag={t:'pan',sx:e.clientX,sy:e.clientY,vx:PLAN.x,vy:PLAN.y,moved:false};svg.setPointerCapture(e.pointerId);svg.classList.add('panning');
 });
 svg.addEventListener('pointermove',e=>{
  if(!drag)return;
  if(drag.t==='pan'){const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;if(Math.abs(dx)+Math.abs(dy)>3){drag.moved=true;PLAN.userMoved=true}PLAN.x=drag.vx+dx;PLAN.y=drag.vy+dy;planView()}
  else{const[x,y]=toW(e);drag.o.x=Math.round((x-drag.ox)*10)/10;drag.o.y=Math.round((y-drag.oy)*10)/10;drag.moved=true;$('#pcontent').innerHTML=planSvg()}
 });
 svg.addEventListener('pointerup',()=>{svg.classList.remove('panning');if(!drag)return;const d=drag;drag=null;if(d.t==='pan'&&!d.moved&&(PLAN.sel||PLAN.selLink)){PLAN.sel=null;PLAN.selLink=null;planAll()}if(d.t==='obj'&&d.moved){planAll();if(d.o.lay==='cont'){const rs=PLAN.routes.filter(r=>r.a===d.o.id||r.b===d.o.id);if(rs.length)toast(`Longueurs recalculées : ${rs.map(r=>esc(r.nom)+' '+nf(routeLen(r).tot,1)+' m').join(', ')}`,'info')}}});
 svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect();planZoom(Math.exp(-e.deltaY*.0016),e.clientX-r.left,e.clientY-r.top)},{passive:false});
 wrap.addEventListener('click',e=>{const z=e.target.closest('[data-pz]');if(z)planZoom(+z.dataset.pz>0?1.25:0.8,wrap.clientWidth/2,wrap.clientHeight/2)});
 const redraw=()=>{$('#pcontent').innerHTML=planSvg()};
 $('#planSide').addEventListener('input',e=>{const t=e.target,d=t.dataset,o=curObjs().find(x=>x.id===PLAN.sel),l=SCH.links.find(x=>x.id===PLAN.selLink);
  if(d.pl&&o){o[d.pl]=+t.value;redraw();const lb=t.previousElementSibling;if(lb)lb.textContent=d.pl==='dir'?`Orientation · ${((o.dir%360)+360)%360}°`:`Angle de champ · ${o.fov}°`}
  else if(d.sedit&&o){o.label=t.value;redraw()}
  else if(d.llbl!==undefined&&l){l.lbl=t.value;redraw()}});
 $('#planSide').addEventListener('change',e=>{const t=e.target,d=t.dataset,o=curObjs().find(x=>x.id===PLAN.sel),l=SCH.links.find(x=>x.id===PLAN.selLink);
  if(d.play!==undefined){PLAN.lay[d.play]=t.checked?1:0;redraw();return}
  if(d.larrow!==undefined&&l){l.arrow=t.checked;redraw();return}
  if(d.lsig!==undefined&&l){l.sig=t.value;planAll();return}
  if(d.ssig!==undefined&&o){o.sig=t.value;planAll();return}
  if(d.fxf&&o){o[d.fxf]=Math.max(1,Math.round(+t.value||1));planAll();const c=fxConf(o);toast(c?`Chevauchement avec #${c.num} ${c.type} dans l’univers ${o.u}`:`#${o.num} : univers ${o.u}, adresse ${o.adr}`,c?'err':'ok');return}
  if(d.fxm!==undefined&&o){o.mode=t.value;planAll();return}});
 requestAnimationFrame(()=>{if(!$('#planWrap'))return;PLAN.userMoved?planView():planFit()});
}


/* ===== Modes de l'écran Plans ===== */
const curObjs=()=>PLAN.mode==='schema'?SCH.objs:PLAN.mode==='feu'?FEU.fx:PLAN.objs;
const curTodo=()=>PLAN.mode==='schema'?SCH.todo:PLAN.mode==='feu'?FEU.todo:PLAN.todo;
const oname=o=>o.nom||o.label||(o.type+' #'+o.num);
const planSvg=()=>PLAN.mode==='schema'?schemaSvg():PLAN.mode==='feu'?feuSvg():cartoSvg();
const planPend=()=>PLAN.mode==='schema'?schemaPend():PLAN.mode==='feu'?feuPend():cartoPend();
const planSide=()=>PLAN.mode==='schema'?schemaSide():PLAN.mode==='feu'?feuSide():cartoSide();
function planHint(){if(!editable())return 'Lecture seule : naviguez et inspectez';return PLAN.mode==='schema'?'Glissez un bloc · touchez une liaison pour changer son tracé':PLAN.mode==='feu'?'Glissez un appareil sur le pont · touchez-le pour son adressage':'Glissez un élément pour le déplacer · touchez-le pour le régler'}

const BW=16,BH=5;
function linkGeo(l){
 const a=SCH.objs.find(o=>o.id===l.a),b=SCH.objs.find(o=>o.id===l.b);if(!a||!b)return null;
 const hor=b.x-a.x>BW;let x1,y1,x2,y2,d,lx,ly,dir;
 if(hor){x1=a.x+BW/2;y1=a.y;x2=b.x-BW/2;y2=b.y;dir=[1,0];const mx=(x1+x2)/2;
  d=l.style==='droit'?`M${x1} ${y1}L${x2} ${y2}`:l.style==='courbe'?`M${x1} ${y1}C${mx} ${y1} ${mx} ${y2} ${x2} ${y2}`:`M${x1} ${y1}H${mx}V${y2}H${x2}`;lx=mx;ly=(y1+y2)/2}
 else{const dn=b.y>a.y;x1=a.x;y1=a.y+(dn?BH/2:-BH/2);x2=b.x;y2=b.y+(dn?-BH/2:BH/2);dir=[0,dn?1:-1];const my=(y1+y2)/2;
  d=l.style==='droit'?`M${x1} ${y1}L${x2} ${y2}`:l.style==='courbe'?`M${x1} ${y1}C${x1} ${my} ${x2} ${my} ${x2} ${y2}`:`M${x1} ${y1}V${my}H${x2}V${y2}`;lx=(x1+x2)/2;ly=my}
 if(l.style==='droit'){const L=Math.hypot(x2-x1,y2-y1)||1;dir=[(x2-x1)/L,(y2-y1)/L]}
 const bx=x2-dir[0]*1.3,by=y2-dir[1]*1.3,arrow=`${x2},${y2} ${bx-dir[1]*.65},${by+dir[0]*.65} ${bx+dir[1]*.65},${by-dir[0]*.65}`;
 return{d,lx,ly,arrow};
}
function schemaSvg(){
 let s='';
 SCH.objs.filter(o=>o.kind==='zone').forEach(o=>{s+=`<g class="obj zone ${PLAN.sel===o.id?'sel':''}" data-obj="${o.id}"><rect class="zrect" x="${o.x-o.w/2}" y="${o.y-o.h/2}" width="${o.w}" height="${o.h}" rx="1"/><text class="zlbl" x="${o.x-o.w/2+1.2}" y="${o.y-o.h/2+2.4}">${esc(o.label)}</text></g>`});
 SCH.links.forEach(l=>{const g=linkGeo(l);if(!g)return;const t=l.lbl?l.lbl:'',w=t.length*.78+1.4;s+=`<g class="slink ${PLAN.selLink===l.id?'sel':''}" data-link="${l.id}" style="--c:${sigc(l.sig)}"><path class="hit" d="${g.d}"/><path class="vis" d="${g.d}"/>${l.arrow?`<polygon points="${g.arrow}"/>`:''}${t?`<g transform="translate(${g.lx-w/2},${g.ly-1})"><rect width="${w}" height="2" rx=".4"/><text x="${w/2}" y="1.42" text-anchor="middle">${esc(t)}</text></g>`:''}</g>`});
 SCH.objs.filter(o=>o.kind==='blk').forEach(o=>{s+=`<g class="obj blk ${PLAN.sel===o.id?'sel':''}" data-obj="${o.id}" style="--c:${sigc(o.sig)}"><rect class="shape" x="${o.x-BW/2}" y="${o.y-BH/2}" width="${BW}" height="${BH}" rx=".8"/><circle cx="${o.x-BW/2+1.3}" cy="${o.y}" r=".55" style="fill:var(--c)"/><text class="blbl" x="${o.x-BW/2+2.4}" y="${o.y+.55}">${esc(o.label)}</text></g>`});

 }
 if(r==='recette'){
  const it=rcItems().filter(x=>rcSt(x.k)==='todo');if(!it.length)return;const x=it[0];S.rc.st[x.k]='ok';S.rc.by[x.k]={u:'hb',w:'11/11 '+new Date().toTimeString().slice(0,5),c:''};
  rcRefresh(x.k);toast(`Hugo Bernard a passé ${esc(x.t)} en OK`,'ok','hb');pushFeed('hb',`a passé ${x.t} en OK sur`,P.nom);return;
 }
 if(r==='projet'){const t=TASKS.find(t=>t.st==='À faire'&&t.u!=='dp');if(!t)return;t.st='En cours';const b=$('#tasks tbody');if(b){b.innerHTML=tasksRows();b.querySelector(`[data-ti="${TASKS.indexOf(t)}"]`).classList.add('flash')}toast(`${U[t.u].n} a commencé « ${esc(t.t)} »`,'ok',t.u);return}
 if(r==='preparation'){const it=prepItems(),set=PREP.done[PREP.phase],x=it.find(i=>!set.has(i.code));if(!x)return;set.add(x.code);PREP.flash=x.code;prepRefresh(true);toast(`Hugo Bernard a scanné ${esc(x.nom)} ${x.code}`,'ok','hb');return}
 if(r==='catalogue'){const c=CAT[Math.floor(Math.random()*CAT.length)];c.w+=5;c.fresh=true;$('#catBody').innerHTML=catRows();c.fresh=false;toast(`Sofia Roux a modifié la fiche « ${esc(c.nom)} »`,'ok','sr');return}
 if(r==='accueil'){const ev=[['sr','a placé 2 × Enregistreur 1U SSD dans','Baie vidéo V1'],['lm','a ajouté le point de recette « Retour PGM caméras » à',P.nom],['hb','a coché 8 contrôles de construction de','Baie audio A1']];const x=ev[Math.floor(Math.random()*ev.length)];pushFeed(...x);const f=$('#feed');f&&(f.innerHTML=feedHtml());FEED[0].fresh=false;}
}
function pushFeed(u,t,o){FEED.unshift({u,t,o,w:'à l’instant',fresh:true});FEED.length=Math.min(FEED.length,12);setTimeout(()=>{FEED.forEach(f=>f.fresh=false)},100)}
setInterval(live,10000);

/* ================= Démarrage ================= */
(function(){const t=store.get('sa-theme');if(t)document.documentElement.dataset.theme=t;themeIcon();render()})();
</script>
