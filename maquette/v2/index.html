<style>
/* =====================================================================
   Strata Arkyo — maquette v2 · direction « Strates »
   Le papier éditorial reste, mais il prend de l'épaisseur : plaques en
   couches, puits et touches, matière (grain, alu brossé, laque), signaux
   du métier en couleur et objets dessinés (baies, faces avant, connecteurs,
   car régie, flight-case). Voir DESIGN.md.
   ===================================================================== */
:root{
  color-scheme:light;
  /* Matières : craie, papier mat, plaques claires */
  --bg:#ECEAE5; --bg-deep:#E2DFD8; --bg-glow:rgba(255,255,255,.85);
  --surface:#FCFBF9; --surface-2:#F5F3EF; --surface-3:#EEEBE6; --sunken:#E4E1DA;
  --line:#E1DDD5; --line-2:#C8C3B9; --line-soft:rgba(46,38,24,.09);
  --fg:#141518; --fg-2:#3A3D44; --fg-3:#5E626A; --fg-4:#8C8F95;
  --accent:#2943E4; --accent-soft:#E7EAFD; --accent-2:#1D33C2;
  --urg:#D12A1F; --soon:#A35700;
  --primary:#16181C; --primary-fg:#FFFFFF;
  --ok:#0B7A49; --ok-soft:#E1F2E8; --warn:#975500; --warn-soft:#FBEFD9; --err:#C42318; --err-soft:#FBE5E2; --info:#4C545F; --info-soft:#ECEDEE;

  --live:#16A35A; --live-soft:#DDF2E5; --live-ink:#0B6B3B;
  --lock:#D98300; --lock-soft:#FBEED6; --lock-ink:#8A4D00;

  --gauge-face:#F4ECD3; --gauge-ink:#3B3428; --gauge-ndl:#16181C; --wk-c:rgba(46,38,24,.05);
  /* Statuts de projet */
  --st-prep:#4B57D6; --st-pret:#08839A; --st-cours:#D06A0C; --st-fini:#0C7A4B; --st-annule:#8A919B;
  /* Familles de signaux */
  --sig-v:#2459E0; --sig-a:#0E8550; --sig-l:#B78400; --sig-c:#7A44C9; --sig-p:#CF3A2F; --sig-n:#0A8797; --sig-s:#BD3489; --sig-i:#69788C; --sig-f:#D06006;

  --canvas:#F3F1EC; --dot:#CFCAC0; --node-bg:#FFFFFF; --node-edge:#CEC9BF;

  --inst-fg:#F3F2EE; --inst-fg-2:#B4B8BF; --inst-fg-3:#8E939B; --inst-seg:#2B2F35;

  --ill-glass:#34414F; --ill-glass-hi:#5A6A7C; --ill-tyre:#1D1F23; --ill-rim:#A9AFB7; --ill-chassis:#2B2E33; --ill-roof:#DAD6CE; --ill-dish:#EEECE6; --ill-light:#FFC94D;

  --ill-screen:#0E1115; --ill-desk:#2A2D32; --ill-desk-top:#3D4148; --ill-wall:#E9E6DF;
  /* Logo */
  --logo-bg:#16181C; --logo-edge:rgba(255,255,255,.14);
  /* Profondeur : plaques, puits, touches */
  --e1:0 0 0 1px rgba(46,38,24,.075),0 1px 1px rgba(46,38,24,.05),0 3px 8px -2px rgba(46,38,24,.08),inset 0 1px 0 rgba(255,255,255,.9);
  --e2:0 0 0 1px rgba(46,38,24,.08),0 2px 3px rgba(46,38,24,.06),0 16px 32px -10px rgba(46,38,24,.24),inset 0 1px 0 rgba(255,255,255,.95);

  --key-bg-h:linear-gradient(180deg,#FFFFFF 0%,#F8F6F2 100%);
  --primary-bg:linear-gradient(180deg,#33363D 0%,#16181C 100%);

  --scrim:rgba(24,22,18,.38);

  /* Typographie */
  --display:'Bricolage Grotesque','Helvetica Neue',Arial,sans-serif;
  --font:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;

/* ---------- Base ---------- */
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--bg)}
body{height:100%;margin:0;color:var(--fg);font:400 16px/1.55 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden;
  background-color:var(--bg);background-image:radial-gradient(1200px 560px at 78% -180px,var(--bg-glow),transparent 72%),var(--grain)}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--fg)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.defs{position:absolute;width:0;height:0;overflow:hidden}
h1,h2,h3{margin:0;text-wrap:balance;font-family:var(--display);color:var(--fg)}
h1{font-weight:720;font-size:clamp(34px,4.2vw,54px);line-height:1;letter-spacing:-.034em}
.display{font-size:clamp(46px,6.3vw,94px);line-height:.93;letter-spacing:-.048em;font-weight:760}
h2{font-weight:650;font-size:22px;line-height:1.15;letter-spacing:-.018em}
h3{font-weight:650;font-size:18px;line-height:1.2;letter-spacing:-.012em}
p{margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--fg-3)} .small{font-size:14px}
.ic{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:17px;height:17px}
.cx{width:20px;height:20px;flex:none;color:var(--c,currentColor);fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.urg{color:var(--urg);font-weight:700}
.eyebrow,.lbl-t{font:600 11.5px/1.25 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--fg-3)}
.eyebrow{margin-bottom:12px}

/* Témoins lumineux, rubans de repérage */
.led{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none;background:var(--c);box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 18%,transparent),0 0 8px color-mix(in srgb,var(--c) 70%,transparent)}
.tally{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 10px 0 9px;border-radius:8px;font:700 13.5px/1 var(--mono);letter-spacing:.02em;color:var(--c);white-space:nowrap;background:color-mix(in srgb,var(--c) 11%,var(--surface));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 30%,transparent)}
.tally::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.tally.off{--c:var(--fg-3)} .tally.off::before{box-shadow:none;opacity:.5}
.tape{--c:var(--fg-4);position:relative;display:inline-flex;align-items:center;font:600 12.5px/1 var(--mono);letter-spacing:.02em;color:#17181B;padding:5px 9px 5px 13px;border-radius:5px;white-space:nowrap;
  background:linear-gradient(180deg,#FFFFFF 0%,#F2F0EA 46%,#DEDAD1 100%);box-shadow:inset 0 0 0 1px rgba(0,0,0,.11),0 1px 1px rgba(0,0,0,.12),0 2px 5px -2px rgba(0,0,0,.18)}
.tape::before{content:"";position:absolute;left:4px;top:4px;bottom:4px;width:3px;border-radius:1px;background:var(--c)}
.tape.none{color:var(--err);background:var(--err-soft);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--err) 45%,transparent)}
.tape.none::before{background:var(--err)}

/* ---------- Coque ---------- */
.app{display:flex;flex-direction:column;height:100%}
.mast{--ring:var(--bg);display:flex;align-items:center;gap:26px;height:72px;flex:none;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));position:relative;z-index:20;border-bottom:1px solid var(--line-soft)}
.word{display:inline-flex;align-items:center;gap:10px;font:800 21px/1 var(--display);letter-spacing:-.035em;border:0;background:none;padding:0;color:var(--fg);white-space:nowrap}
.logo{width:30px;height:30px;flex:none;filter:drop-shadow(0 1px 1px rgba(0,0,0,.2)) drop-shadow(0 4px 8px rgba(0,0,0,.14))}

.topnav{display:flex;gap:2px;padding:4px;border-radius:999px;background:var(--sunken);box-shadow:var(--well)}

.top-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.search-btn{display:flex;align-items:center;gap:10px;height:40px;padding:0 6px 0 14px;border:0;border-radius:999px;background:var(--sunken);box-shadow:var(--well);color:var(--fg-3);min-width:230px;font-size:14.5px}
.search-btn:hover{color:var(--fg-2)}
kbd{margin-left:auto;font:600 11.5px/1 var(--mono);padding:5px 8px;border-radius:7px;background:var(--key-bg);box-shadow:var(--key);color:var(--fg-2)}

.mode .ic{width:15px;height:15px}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,currentColor 55%,transparent),0 0 8px currentColor}70%{box-shadow:0 0 0 7px transparent,0 0 8px currentColor}100%{box-shadow:0 0 0 0 transparent,0 0 8px currentColor}}
.presence{display:flex;padding:0 4px 0 10px}
.av{--ring:var(--surface);width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;font:650 11.5px var(--font);letter-spacing:.02em;color:#fff;flex:none;text-shadow:0 1px 1px rgba(0,0,0,.28);
  background:radial-gradient(circle at 34% 26%,color-mix(in srgb,var(--c) 62%,#fff) 0,var(--c) 58%,color-mix(in srgb,var(--c) 78%,#000) 100%);box-shadow:0 0 0 2px var(--ring),0 2px 5px rgba(0,0,0,.2)}

.icon-btn:hover{background:var(--key-bg);box-shadow:var(--key);color:var(--fg)}

.icon-btn .badge{position:absolute;top:2px;right:2px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--urg);color:#fff;font:700 10.5px/1 var(--font);display:grid;place-items:center;box-shadow:0 0 0 2px var(--bg),0 0 8px color-mix(in srgb,var(--urg) 55%,transparent)}
#view{flex:1;overflow:auto;padding-block:36px 120px;padding-left:max(40px,env(safe-area-inset-left,0px));padding-right:max(40px,env(safe-area-inset-right,0px));min-height:0}

.page{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:40px}
#view.enter .page>*{animation:rise .55s var(--ease) both}
#view.enter .page>*:nth-child(2){animation-delay:.05s} #view.enter .page>*:nth-child(3){animation-delay:.1s} #view.enter .page>*:nth-child(4){animation-delay:.15s} #view.enter .page>*:nth-child(n+5){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
.tabbar{display:none!important}

/* Menu plein écran (mobile) */
.sidebar{position:fixed;inset:0;z-index:80;background-color:var(--bg);background-image:radial-gradient(900px 500px at 80% -120px,var(--bg-glow),transparent 70%),var(--grain);display:flex;flex-direction:column;gap:22px;padding-block:calc(env(safe-area-inset-top,0px) + 12px) calc(env(safe-area-inset-bottom,0px) + 18px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:auto;opacity:0;visibility:hidden;transform:translateY(-12px);transition:opacity .2s,transform .2s var(--ease),visibility .2s}

.menu-top{display:flex;justify-content:space-between;align-items:center;min-height:44px}
.menu-links{display:flex;flex-direction:column;align-items:stretch;gap:2px}

.menu-proj{display:flex;flex-direction:column;gap:4px;padding:14px 8px 8px;border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--e1)}

.menu-sub button.on{background:var(--primary-bg);color:var(--primary-fg);box-shadow:var(--key-ink);font-weight:650}
.menu-sub .sn-label{padding:6px 12px 4px}
.side-foot{margin-top:auto;display:flex;align-items:center;gap:12px;padding:14px;border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--e1)}
.side-foot b{display:block} .side-foot span{font-size:13.5px;color:var(--fg-3)}

/* ---------- Composants ---------- */
.hero{display:flex;flex-direction:column;gap:22px;max-width:760px}
.hero .eyebrow{margin:0}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
.page-head>div:first-child{min-width:0}
.lead{color:var(--fg-2);max-width:34ch;font:400 clamp(19px,1.8vw,24px)/1.42 var(--font);letter-spacing:-.012em}
.ilink{border:0;background:none;padding:0;font:inherit;color:var(--fg);font-weight:600;text-decoration:underline;text-decoration-thickness:2px;text-decoration-color:var(--accent);text-underline-offset:5px}
.ilink:hover{color:var(--accent)}
.head-actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:12px;border:0;background:var(--key-bg);box-shadow:var(--key);font-weight:600;color:var(--fg);white-space:nowrap;font-size:15px;transition:transform .12s,box-shadow .15s,background .15s}
.btn:hover{background:var(--key-bg-h)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--primary-bg);color:var(--primary-fg);box-shadow:var(--key-ink)}
.btn.primary:hover{filter:brightness(1.12)}
.btn.ghost{background:none;box-shadow:none}
.btn.ghost:hover{background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line-soft)}
.btn.sm{height:36px;padding:0 13px;font-size:14px;gap:6px;border-radius:10px}
.btn.danger{color:var(--err)}
.btn[disabled]{opacity:.42;cursor:not-allowed;transform:none}
.card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--e1);padding:22px 24px 24px;min-width:0;position:relative}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px 12px;flex-wrap:wrap;padding-bottom:14px;margin-bottom:4px;border-bottom:1px solid var(--line)}

.card-head h2{font-size:21px}
.card-head .small{font-size:13.5px}
.card-head .eyebrow{margin-bottom:6px}
.chip{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 10px;border:0;border-radius:999px;font-size:13px;font-weight:600;background:var(--surface-3);color:var(--fg-2);white-space:nowrap;box-shadow:inset 0 0 0 1px var(--line-soft)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.err{background:var(--err-soft);color:var(--err)} .chip.info{background:var(--info-soft);color:var(--info)} .chip.accent{background:var(--accent-soft);color:var(--accent)}
.chip.st{background:none;box-shadow:none;padding:0;color:var(--fg);font-size:15px;height:auto}
.chip.st .dot{background:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 18%,transparent),0 0 9px color-mix(in srgb,var(--c) 75%,transparent)}
.chip .ic{width:14px;height:14px}
.bar{height:6px;border-radius:99px;background:var(--seg-off);box-shadow:inset 0 1px 1px rgba(0,0,0,.1);overflow:hidden;min-width:40px}
.bar>i{display:block;height:100%;border-radius:inherit;background:linear-gradient(180deg,color-mix(in srgb,var(--bar-c,var(--fg)) 72%,#fff),var(--bar-c,var(--fg)));transition:width .4s var(--ease)}
.bar.ok{--bar-c:var(--ok)} .bar.warn{--bar-c:var(--soon)} .bar.err{--bar-c:var(--urg)}
/* Vumètre à segments : progression (prog) ou charge (load, vert → ambre → rouge) */
.vu{--vu-c:var(--fg);display:inline-flex;gap:2px;align-items:stretch;height:10px;min-width:56px;flex:none}
.vu i{flex:1;min-width:2px;border-radius:1.5px;background:var(--seg-off)}

.vu.load i.on.g{--vu-c:var(--led-g)} .vu.load i.on.y{--vu-c:var(--led-y)} .vu.load i.on.r{--vu-c:var(--led-r)}
.vu.ok{--vu-c:var(--led-g)} .vu.warn{--vu-c:var(--led-y)} .vu.err{--vu-c:var(--led-r)} .vu.acc{--vu-c:var(--accent)}

.grid-2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;align-items:start}
.seg{display:inline-flex;gap:2px;padding:3px;flex:none;max-width:100%;overflow-x:auto;scrollbar-width:none;background:var(--sunken);border-radius:12px;box-shadow:var(--well);align-self:flex-start}
.seg::-webkit-scrollbar{display:none}
.seg button{border:0;background:none;height:34px;padding:0 14px;border-radius:9px;font-size:14px;font-weight:550;color:var(--fg-2);white-space:nowrap;transition:background .15s,box-shadow .15s,color .15s}
.seg button:hover{color:var(--fg)}
.seg button.on{background:var(--key-bg);color:var(--fg);font-weight:650;box-shadow:var(--key)}
.seg button[disabled]{opacity:.4;cursor:not-allowed}
.seg .muted{font-family:var(--mono);font-size:12.5px;margin-left:2px}
.input{height:44px;border:0;border-radius:12px;background-color:var(--sunken);box-shadow:var(--well);padding:0 14px;min-width:0;width:100%;font-size:15.5px;transition:box-shadow .15s}
.input:focus{outline:none;box-shadow:var(--well),0 0 0 2px var(--accent)}
.input::placeholder{color:var(--fg-3);opacity:1}
.input[disabled]{opacity:.6;cursor:not-allowed}
textarea.input{height:auto;padding:12px 14px;resize:vertical;min-height:96px;line-height:1.5}
select.input{appearance:none;-webkit-appearance:none;cursor:pointer;padding-right:36px;background-image:linear-gradient(45deg,transparent 50%,var(--fg-3) 50%),linear-gradient(135deg,var(--fg-3) 50%,transparent 50%);background-position:calc(100% - 19px) 52%,calc(100% - 14px) 52%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
select.input option{color:var(--fg);background:var(--surface)}
.search{position:relative;flex:1;min-width:220px;max-width:420px}
.search .ic{position:absolute;left:13px;top:12px;color:var(--fg-3);pointer-events:none}
.search .input{padding-left:40px}
.toolbar{display:flex;gap:10px 12px;flex-wrap:wrap;align-items:center}
.fchip{height:36px;padding:0 14px;border:0;border-radius:999px;background:var(--key-bg);box-shadow:var(--key);font-size:14px;font-weight:550;color:var(--fg-2);display:inline-flex;align-items:center;gap:8px;white-space:nowrap;transition:background .15s,color .15s,box-shadow .15s}
.fchip:hover{color:var(--fg)}
.fchip[style]::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 6px -1px var(--c)}
.fchip.cxf::before{display:none}
.fchip .cx{width:18px;height:18px}
.fchip.on{background:var(--primary-bg);color:var(--primary-fg);box-shadow:var(--key-ink)}
.fchip.on .cx{color:var(--primary-fg)}
.field{display:flex;flex-direction:column;gap:7px;min-width:0}
.field label,.flabel{font-size:13.5px;font-weight:600;color:var(--fg-2)}
.field .help{font-size:13.5px;color:var(--fg-3)}
.field .help.err{color:var(--err)} .field .help.ok{color:var(--ok)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 20px}
.form-grid .span{grid-column:1/-1}
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th{font:600 11px/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);text-align:left;padding:12px 14px 12px 0;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:14px 14px 14px 0;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr.click:hover td{background:var(--surface-2)}
.flash,.flash td{animation:flash 2.4s ease-out}
@keyframes flash{0%,35%{background:var(--accent-soft)}100%{background:transparent}}
.stepper{display:inline-flex;align-items:center;gap:2px;padding:3px;border-radius:12px;background:var(--sunken);box-shadow:var(--well)}
.stepper button{width:32px;height:32px;border:0;border-radius:9px;background:var(--key-bg);box-shadow:var(--key);color:var(--fg-2);font-size:18px;line-height:1}
.stepper button:hover{color:var(--fg)}
.stepper span{min-width:30px;text-align:center;font:600 15px var(--mono)}
.empty{padding:28px 0;color:var(--fg-3);font-size:16px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:9px 16px;font-size:15px;margin:0}
.kv dt{color:var(--fg-3)}
.kv dd{margin:0;font-weight:600;text-align:right;font-variant-numeric:tabular-nums;min-width:0;overflow-wrap:anywhere}
.alert{display:flex;gap:12px;padding:13px 15px;border-radius:12px;font-size:14.5px;align-items:flex-start;box-shadow:inset 0 0 0 1px var(--line-soft)}
.alert.warn{background:var(--warn-soft);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--warn) 25%,transparent)} .alert.warn>.ic{color:var(--warn)}
.alert.err{background:var(--err-soft);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--err) 25%,transparent)} .alert.err>.ic{color:var(--err)}
.alert.info{background:var(--surface-2);color:var(--fg-2)}

.spinner{display:inline-block;vertical-align:middle;width:20px;height:20px;border:2px solid var(--seg-off);border-top-color:var(--fg);border-radius:50%;animation:spin .8s linear infinite;flex:none}
.btn .spinner{width:16px;height:16px}
@keyframes spin{to{transform:rotate(360deg)}}

/* Illustrations */
.ill{display:block;width:100%;height:auto;overflow:visible}
.harness path{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.harness .pulse{stroke:#fff;stroke-width:2.2;stroke-dasharray:4 70;opacity:.75;animation:flow 3.2s linear infinite}
.harness .pulse:nth-of-type(2n){animation-duration:4.1s}
@keyframes flow{to{stroke-dashoffset:-148}}

/* ---------- Accueil ---------- */
.home-hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,580px);gap:40px;align-items:center}
.next{position:relative;display:flex;flex-direction:column;gap:12px;width:100%;text-align:left;border:0;padding:22px 24px 22px;border-radius:var(--r-xl);color:var(--inst-fg);overflow:hidden;isolation:isolate;
  background:radial-gradient(90% 110% at 92% -10%,var(--inst-hi) 0%,var(--inst) 56%,var(--inst-lo) 100%);box-shadow:var(--e-inst);transition:transform .25s var(--ease),box-shadow .25s}
.next::before{content:"";position:absolute;inset:0;z-index:-1;background-image:var(--grain);opacity:.6;pointer-events:none}
.next:hover{transform:translateY(-3px)}

.next-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.next .lbl-t{color:var(--inst-fg-3)}

.next-meta{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:18px;align-items:end;padding-top:14px;border-top:1px solid var(--inst-edge)}
.next-meta>span{display:flex;flex-direction:column;gap:6px;min-width:0}
.next-meta .lbl-t{font-size:10.5px}
.next-meta b{font-weight:600;font-size:14.5px;white-space:nowrap}
.next .vu{--vu-c:var(--led-g);width:100%}
.next .vu i{background:var(--inst-seg)}
.next .vu i.on{background:var(--led-g);box-shadow:0 0 8px -1px var(--led-g)}
.next .presence{padding:0 0 0 8px}
.next .av{--ring:var(--inst)}
.figs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.fig{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:start;padding:18px 18px 18px 20px;border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--e1);min-height:152px;overflow:hidden;text-align:left;border:0;color:var(--fg)}
.fig .lbl-t{grid-column:1/-1}
.fig b{display:block;font:760 56px/.92 var(--display);letter-spacing:-.05em;font-variant-numeric:tabular-nums;margin-top:10px}
.fig b small{font-size:.46em;letter-spacing:-.02em;margin-left:2px;color:var(--fg-3)}
.fig .fig-s{display:block;margin-top:10px;color:var(--fg-3);font-size:13.5px;line-height:1.35;max-width:20ch}
.fig .fig-v{align-self:end;justify-self:end}
.fig.alert-f{background:linear-gradient(180deg,color-mix(in srgb,var(--urg) 6%,var(--surface)),var(--surface));box-shadow:var(--e1),inset 0 0 0 1px color-mix(in srgb,var(--urg) 22%,transparent);cursor:pointer}
.fig.alert-f b{color:var(--urg)}
.fig.alert-f:hover{box-shadow:var(--e2),inset 0 0 0 1px color-mix(in srgb,var(--urg) 30%,transparent)}
.fig.alert-f .tally{--c:var(--urg)}
.fig.alert-f .tally::before{animation:blink 1.6s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.units{display:flex;flex-direction:column-reverse;gap:3px;width:56px;padding:6px 5px;border-radius:7px;background:#1C1F24;box-shadow:inset 0 0 0 1px rgba(0,0,0,.5),0 2px 6px -2px rgba(0,0,0,.4)}
.units i{display:flex;align-items:center;height:7px;border-radius:1.5px;background:linear-gradient(180deg,#3A3F46,#2A2E34);padding-left:4px}
.units i::before{content:"";width:4px;height:4px;border-radius:50%;background:var(--c);box-shadow:0 0 5px var(--c)}
.units i.off::before{background:#555B63;box-shadow:none}
.gauge{width:128px;height:76px;display:block}
.gauge .face{fill:var(--gauge-face);stroke:rgba(0,0,0,.18);stroke-width:1}
.gauge .tk{stroke:var(--gauge-ink);stroke-width:1.1}
.gauge .tk.mj{stroke-width:1.8}
.gauge .zone{fill:none;stroke:var(--led-g);stroke-width:3.4}

.gauge text.u{font-size:9.5px;opacity:.7}
.fig .vu{width:118px}
.cols{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:24px;align-items:start}
.rows{display:flex;flex-direction:column}
.r-date{display:flex;flex-direction:column;align-items:center;justify-content:center;width:52px;height:56px;border-radius:12px;background:var(--key-bg);box-shadow:var(--key);flex:none}
.r-date b{display:block;font:740 24px/1 var(--display);letter-spacing:-.03em}
.r-date span{font:600 10.5px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--fg-3);margin-top:3px}
.r-main{display:flex;flex-direction:column;gap:2px;min-width:0}
.r-main b{font:650 18px/1.2 var(--display);letter-spacing:-.012em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-main span{color:var(--fg-3);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-j{font:700 14px var(--mono);color:var(--fg-2);white-space:nowrap}
.r-j.urg{color:var(--urg)} .r-j.soon{color:var(--soon)} .r-j.off{color:var(--fg-3)}
.r-col{display:flex;flex-direction:column;gap:6px;font-size:15px;min-width:0}
.r-col .lbl{font-size:13px;color:var(--fg-3)}
/* Planning des 30 jours */
.tl{--lab:360px;display:flex;flex-direction:column;margin-top:6px}
.tl-head,.tl-row{display:grid;grid-template-columns:var(--lab) minmax(0,1fr);align-items:center}
.tl-head{height:30px;align-items:end}
.tl-ticks{position:relative;height:100%}
.tl-ticks span{position:absolute;bottom:6px;font:600 10.5px/1 var(--mono);letter-spacing:.04em;color:var(--fg-3);white-space:nowrap;padding-left:5px;border-left:1px solid var(--line-2)}
.tl-ticks span.now{color:var(--urg);border-color:var(--urg)}
.tl-row{width:100%;border:0;border-top:1px solid var(--line);background:none;padding:0;text-align:left;min-height:74px;color:var(--fg)}
.tl-row:hover .tl-lab b{text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:4px}
.tl-row:hover .tl-track{filter:saturate(1.15)}
.tl-lab{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:14px;align-items:center;padding:9px 20px 9px 0}
.tl-track{position:relative;align-self:stretch;min-height:56px;background:var(--wk);border-radius:6px}
.tl-track::before{content:"";position:absolute;left:0;top:-1px;bottom:0;width:2px;background:var(--urg);box-shadow:0 0 6px color-mix(in srgb,var(--urg) 60%,transparent)}
.tl-plan{position:absolute;top:50%;height:12px;margin-top:-6px;border-radius:99px;background:repeating-linear-gradient(-45deg,color-mix(in srgb,var(--c) 34%,transparent) 0 3px,color-mix(in srgb,var(--c) 12%,transparent) 3px 6px);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 40%,transparent)}
.tl-plan.cl{border-top-left-radius:0;border-bottom-left-radius:0}
.tl-plan.cr{border-top-right-radius:0;border-bottom-right-radius:0}
.tl-shoot{position:absolute;top:50%;height:24px;margin-top:-12px;border-radius:7px;min-width:12px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 70%,#fff) 0%,var(--c) 55%,color-mix(in srgb,var(--c) 85%,#000) 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 0 0 1px color-mix(in srgb,var(--c) 70%,#000),0 4px 10px -3px color-mix(in srgb,var(--c) 70%,transparent)}
.tl-ms{position:absolute;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;transform:rotate(45deg);border-radius:3px;background:var(--c);box-shadow:0 0 0 3px var(--surface),0 0 10px color-mix(in srgb,var(--c) 70%,transparent)}
.tl-legend{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--fg-3);align-items:center}
.tl-legend i{display:inline-block;vertical-align:-2px;margin-right:7px}
.tl-legend .k1{width:22px;height:12px;border-radius:4px;background:linear-gradient(180deg,#7C8592,#4F5761)}
.tl-legend .k2{width:22px;height:8px;border-radius:99px;background:repeating-linear-gradient(-45deg,rgba(100,106,116,.5) 0 3px,rgba(100,106,116,.15) 3px 6px)}
.tl-legend .k3{width:10px;height:10px;transform:rotate(45deg);border-radius:2px;background:#6D7580}
.feed{display:flex;flex-direction:column}
.feed-item{position:relative;display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.feed-item:last-child{border-bottom:0}
.feed-item p{font-size:15px;color:var(--fg-2)} .feed-item p b{color:var(--fg);font-weight:600}
.feed-item time{font:500 12px var(--mono);color:var(--fg-3)}
.stackbar{display:flex;height:24px;border-radius:9px;overflow:hidden;gap:3px;margin-top:18px;padding:3px;background:var(--sunken);box-shadow:var(--well)}
.stackbar i{display:block;border-radius:6px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 66%,#fff) 0%,var(--c) 55%,color-mix(in srgb,var(--c) 84%,#000) 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px 20px;margin-top:20px}
.legend div{display:flex;align-items:center;gap:10px;font-size:15px}
.legend b{margin-left:auto;font:600 15px var(--mono)}

/* ---------- Projets ---------- */
.pgroup{display:flex;flex-direction:column;gap:16px}
.group-h{display:flex;align-items:center;gap:12px}
.group-h .chip.st{font:650 24px/1 var(--display);letter-spacing:-.02em;gap:12px}
.group-h .chip.st .dot{width:11px;height:11px}
.group-h .count{font:600 13px/1 var(--mono);color:var(--fg-2);padding:5px 9px;border-radius:999px;background:var(--surface);box-shadow:var(--e1)}
.group-h::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line-2),transparent)}
.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.pcard{display:flex;flex-direction:column;border:0;padding:0;text-align:left;background:var(--surface);border-radius:20px;box-shadow:var(--e1);overflow:hidden;color:var(--fg);transition:transform .22s var(--ease),box-shadow .22s var(--ease)}
.pcard:hover{transform:translateY(-3px);box-shadow:var(--e2)}
.pcard:hover .pc-vis .ill{transform:translateX(-4px)}
.pc-vis{position:relative;display:flex;align-items:flex-end;justify-content:center;height:156px;padding:0 18px;overflow:hidden;background:radial-gradient(120% 100% at 50% 0%,var(--vis-a),var(--vis-b));box-shadow:inset 0 -1px 0 var(--line-soft)}
.pc-vis::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--c);box-shadow:0 0 12px color-mix(in srgb,var(--c) 60%,transparent)}
.pc-vis .ill{width:min(100%,300px);margin-bottom:2px;transition:transform .4s var(--ease)}
.pc-tag{position:absolute;left:14px;top:13px}
.pc-j{position:absolute;right:12px;top:10px}
.pc-j .tally{background:color-mix(in srgb,var(--c) 10%,var(--surface))}
.pcard.off .pc-vis .ill{filter:grayscale(1);opacity:.5}
.pcard.off .pc-vis::after{opacity:.5}
.pc-body{display:flex;flex-direction:column;gap:5px;padding:16px 18px 18px;min-width:0}
.pc-name{font:680 22px/1.12 var(--display);letter-spacing:-.022em}
.pc-sub{color:var(--fg-3);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc-foot{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:end;margin-top:10px;padding-top:12px;border-top:1px solid var(--line)}
.pc-foot>span{display:flex;flex-direction:column;gap:6px;min-width:0}
.pc-foot b{font-weight:600;font-size:14.5px;white-space:nowrap}
.pc-foot .lbl-t{font-size:10.5px}
.pc-foot .vu{width:100%}

/* ---------- Projet ---------- */
.ptop{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px 28px;align-items:end}
.ptop-main{min-width:0;display:flex;flex-direction:column;gap:14px}
.crumbs{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;font:600 11.5px/1.3 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--fg-3)}
.crumbs .sep{color:var(--fg-4)}
.crumb{border:0;background:none;padding:0;font:inherit;letter-spacing:inherit;text-transform:inherit;color:var(--fg-2);text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px}
.crumb:hover{color:var(--accent);text-decoration-color:currentColor}
.pmeta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 22px;font-size:15.5px;color:var(--fg-2)}
.pmeta>span{display:inline-flex;align-items:center;gap:7px}
.pmeta .ic{width:17px;height:17px;color:var(--fg-3)}
.pmeta .tally{--c:var(--urg)}
.ptop-side{display:flex;align-items:center;gap:10px}
.ptop.hero-p{grid-template-columns:minmax(0,1fr) minmax(0,520px);align-items:stretch;padding:30px 0 0 32px;border-radius:var(--r-xl);background:radial-gradient(110% 120% at 85% 0%,var(--vis-a),var(--vis-b));box-shadow:var(--e1);overflow:hidden;min-height:300px}
.ptop.hero-p .ptop-main{padding-bottom:30px;justify-content:flex-end}
.ptop.hero-p .ptop-side{justify-content:flex-start;margin-top:4px}
.ptop-vis{display:flex;align-items:flex-end;justify-content:flex-end;margin-right:-2px;min-width:0}
.ptop-vis .ill{width:100%;max-width:560px}
.ptop.compact{grid-template-columns:minmax(0,1fr) auto;padding:14px max(24px,env(safe-area-inset-right,0px)) 0 max(24px,env(safe-area-inset-left,0px));align-items:center}
.ptop.compact .ptop-main{flex-direction:row;align-items:baseline;gap:6px 14px;flex-wrap:wrap}
.ptop.compact h1{font-size:24px;letter-spacing:-.025em}
.st-select{display:inline-flex;align-items:center;gap:10px;color:var(--fg);font-weight:600;border-radius:12px;padding:0 6px 0 14px;height:42px;background:var(--key-bg);box-shadow:var(--key)}
.st-select .dot{width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.st-select select{border:0;background:none;color:inherit;font-weight:600;height:100%;cursor:pointer;font-size:15px;padding-right:6px}
.st-select select option{color:var(--fg);background:var(--surface)}
/* Sections du projet : trois groupes en touches */
.subnav{position:relative}
.sn-row{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 6px;margin:-2px -2px -6px}
.sn-row::-webkit-scrollbar{display:none}
.sn-group{display:flex;flex-direction:column;gap:6px;padding:9px 8px 8px;border-radius:16px;background:var(--surface);box-shadow:var(--e1);flex:none}
.sn-group.lock{background:linear-gradient(180deg,color-mix(in srgb,var(--lock) 7%,var(--surface)),var(--surface) 60%)}
.sn-label{display:flex;align-items:center;gap:6px;font:600 10.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--fg-3);white-space:nowrap;padding:2px 8px 0}
.sn-label .ic{width:12px;height:12px}
.sn-label.lock{color:var(--lock-ink)}
.sn-items{display:flex;gap:3px}
.subnav button{display:inline-flex;align-items:center;gap:8px;border:0;background:none;height:38px;padding:0 14px;border-radius:10px;font-size:15px;font-weight:550;color:var(--fg-2);white-space:nowrap;transition:background .15s,color .15s,box-shadow .15s}
.subnav button:hover{background:var(--surface-2);color:var(--fg)}
.subnav button.on{background:var(--primary-bg);color:var(--primary-fg);box-shadow:var(--key-ink);font-weight:650}
.subnav button.on::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--key-led);box-shadow:0 0 7px var(--key-led)}
.subnav.flat .sn-group{flex-direction:row;padding:5px}
.sn-pick{display:none;position:relative}
.sn-pick summary{list-style:none;display:flex;align-items:center;gap:10px;min-height:56px;padding:6px 14px 6px 16px;border-radius:16px;background:var(--surface);box-shadow:var(--e1);cursor:pointer}
.sn-pick summary::-webkit-details-marker{display:none}
.sn-pick summary .sn-label{padding:0}
.sn-pick summary .sn-cur{display:flex;flex-direction:column;gap:5px;min-width:0}
.sn-pick summary b{font:650 18px/1.1 var(--display);letter-spacing:-.015em}
.sn-pick summary .pos{margin-left:auto;font:600 12px var(--mono);color:var(--fg-3);padding:4px 8px;border-radius:7px;background:var(--sunken);box-shadow:var(--well)}
.sn-pick summary .chev{display:inline-grid;transition:transform .2s var(--ease)}
.sn-pick[open] summary .chev{transform:rotate(180deg)}
.sn-panel{position:absolute;left:0;right:0;top:calc(100% + 8px);z-index:60;background:var(--surface);border-radius:18px;box-shadow:var(--e3);padding:8px 8px 10px;display:flex;flex-direction:column;gap:2px;animation:pop .2s var(--ease)}
.sn-panel .sn-label{padding:12px 12px 6px}
.sn-panel button{display:flex;width:100%;text-align:left;padding:0 12px;height:44px;border-radius:10px;margin:0;color:var(--fg-2)}
/* Avancement : console de vumètres */
.console{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-top:10px}
.dom{display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 10px 16px;border:0;border-radius:14px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line-soft);text-align:center;color:var(--fg);min-width:0;transition:background .15s,box-shadow .15s}
.dom:hover{background:var(--surface-3);box-shadow:inset 0 0 0 1px var(--line-2)}
.dom .ch{font:600 10px/1 var(--mono);letter-spacing:.1em;color:var(--fg-4)}
.dom .pct{font:740 30px/1 var(--display);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.dom .pct small{font-size:.5em;color:var(--fg-3);margin-left:1px}
.dom .vu.v{height:124px;width:20px;padding:4px;border-radius:7px;background:#16181C;box-shadow:inset 0 1px 2px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.5);gap:2px}
.dom .vu.v i{background:#2A2E34}
.dom .vu.v i.on{background:var(--vu-c);box-shadow:0 0 6px -1px var(--vu-c)}
.dom .vu.v{--vu-c:#E8E6E0}
.dom .vu.v.ok{--vu-c:var(--led-g)} .dom .vu.v.warn{--vu-c:var(--led-y)} .dom .vu.v.err{--vu-c:var(--led-r)}
.dom b{font:650 16px/1.15 var(--display);letter-spacing:-.01em}
.dom .d-sub{font-size:12.5px;line-height:1.35;color:var(--fg-3)}
.dom-txt{display:flex;flex-direction:column;gap:4px;min-width:0}
.todos{display:flex;flex-direction:column}
.todo{display:flex;align-items:center;gap:14px;padding:14px 2px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%;color:var(--fg)}
.todo:last-child{border-bottom:0}
.todo:hover b{text-decoration:underline;text-underline-offset:4px}
.todo .ti{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.todo .ti.err{background:var(--err-soft);color:var(--err);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--err) 25%,transparent)}
.todo .ti.warn{background:var(--warn-soft);color:var(--warn);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--warn) 25%,transparent)}
.todo .ti.info{background:var(--info-soft);color:var(--info);box-shadow:inset 0 0 0 1px var(--line-soft)}
.todo b{display:block;font-size:16px;font-weight:600} .todo span{font-size:14px;color:var(--fg-3)}
.todo>.ic:last-child{margin-left:auto;color:var(--fg-3)}
.online{display:flex;flex-direction:column}
.online div{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}
.online div:last-child{border-bottom:0}
.online b{display:block;font-weight:600} .online span{font-size:14px;color:var(--fg-3)}
.online .dev{margin-left:auto;color:var(--fg-3);display:inline-flex;align-items:center;gap:6px;font:500 12px var(--mono)}
.card>.small.muted{margin-top:14px}
.task-st{border:0;cursor:pointer}

/* ---------- Inventaire ---------- */
.inv{display:flex;flex-direction:column;gap:28px}
.loc-list{display:flex;flex-direction:row;flex-wrap:wrap;gap:10px;background:none;box-shadow:none;padding:0}
.loc-list>.card-head,.loc-list>.hint{display:none}
.loc{display:inline-flex;align-items:center;gap:10px;padding:6px 16px 6px 6px;border-radius:14px;border:0;background:var(--key-bg);box-shadow:var(--key);text-align:left;color:var(--fg)}
.loc.on{background:var(--primary-bg);color:var(--primary-fg);box-shadow:var(--key-ink)}
.loc .code{font:600 12.5px var(--mono);padding:7px 9px;border-radius:9px;background:var(--sunken);box-shadow:var(--well);color:var(--fg-2)}

.loc .ln{display:flex;flex-direction:column;line-height:1.2}
.loc b{font-weight:600}
.loc .small{font-size:12.5px}

.inv-main{display:flex;flex-direction:column;gap:28px;min-width:0}
.cont-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.cont{display:grid;grid-template-columns:84px minmax(0,1fr);gap:16px;text-align:left;border:0;padding:16px;border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--e1);color:var(--fg);transition:box-shadow .2s,transform .2s var(--ease)}

.cont.on{box-shadow:var(--e2),0 0 0 2px var(--fg)}
.cont-info{display:flex;flex-direction:column;gap:4px;min-width:0}
.cont-top{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.cont-name{font:650 20px/1.15 var(--display);letter-spacing:-.018em}
.cont-vis{display:flex;align-items:flex-end;justify-content:center;border-radius:12px;padding:10px 8px;background:radial-gradient(120% 100% at 50% 0%,var(--vis-a),var(--vis-b));box-shadow:inset 0 0 0 1px var(--line-soft)}
.mini-rack{position:relative;overflow:hidden;display:flex;flex-direction:column-reverse;width:46px;height:148px;padding:6px 6px 8px;border-radius:5px;background:linear-gradient(90deg,#15181C,#262A30 50%,#15181C);box-shadow:inset 0 0 0 1px rgba(0,0,0,.6),0 8px 14px -6px rgba(0,0,0,.45);gap:1px}
.mini-rack i{display:block;flex:none;border-radius:1px;background:linear-gradient(180deg,#3A3F47,#2A2E34);position:relative}
.mini-rack i::before{content:"";position:absolute;left:3px;top:50%;width:3px;height:3px;margin-top:-1.5px;border-radius:50%;background:var(--c);box-shadow:0 0 4px var(--c)}
.mini-rack.case{background:linear-gradient(90deg,#2C3036,#3B4048 50%,#2C3036);box-shadow:inset 0 0 0 3px var(--ill-alu),0 8px 14px -6px rgba(0,0,0,.45);padding:7px 7px 9px}

.mini-case{width:64px;height:48px;border-radius:7px;background:linear-gradient(180deg,#3B4047,#24272C);box-shadow:inset 0 0 0 2px var(--ill-alu),0 8px 14px -6px rgba(0,0,0,.45);position:relative}

.meters{display:flex;flex-direction:column;gap:9px;margin-top:12px}
.meter{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px;color:var(--fg-3)}
.meter .vu{width:100%;min-width:40px}
.meter .mono{font-size:12.5px;color:var(--fg-2);white-space:nowrap}
.meter.err .mono{color:var(--urg);font-weight:700}
.art-name{display:flex;align-items:center;gap:12px;min-width:0}

.art-name .small{display:block}

/* ---------- Écrans de conception ---------- */
.design-top{flex:none;background:var(--surface);box-shadow:0 1px 0 var(--line),0 6px 16px -10px rgba(0,0,0,.18);position:relative;z-index:5}
.design-top .subnav{padding:10px max(24px,env(safe-area-inset-right,0px)) 10px max(24px,env(safe-area-inset-left,0px))}

/* Baie : face avant réaliste */
.rack-stage{position:relative;overflow:auto;display:flex;justify-content:center;align-items:flex-start;padding:30px 16px 48px;min-height:0;background:radial-gradient(70% 55% at 50% 8%,var(--stage-a) 0%,transparent 100%),linear-gradient(180deg,var(--stage-a),var(--stage-b))}

.rack{--u:21px;position:relative;display:grid;grid-template-columns:28px auto 28px;padding:22px 5px 24px;border-radius:12px;background:linear-gradient(90deg,#121418 0%,#22262C 9%,#1B1E23 50%,#22262C 91%,#121418 100%);box-shadow:0 0 0 1px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.09),inset 0 -2px 0 rgba(0,0,0,.4),0 30px 50px -24px rgba(0,0,0,.6),0 10px 24px -10px rgba(0,0,0,.35)}

.rack::after{content:"";position:absolute;left:18px;right:18px;bottom:-9px;height:9px;border-radius:0 0 5px 5px;background:linear-gradient(180deg,#0B0C0E,#202328);box-shadow:0 2px 0 rgba(0,0,0,.25)}

.rack-scale span:nth-child(5n+3){color:#C3CAD3}
.rack-body{position:relative;width:440px;height:calc(var(--units) * var(--u));background:repeating-linear-gradient(to top,#0A0C0E 0 1px,#111418 1px var(--u));border-left:11px solid transparent;border-right:11px solid transparent}
.rack-body::before,.rack-body::after{content:"";position:absolute;top:0;bottom:0;width:11px;
  background:repeating-linear-gradient(to top,transparent 0 calc(var(--u) / 6 - 1.8px),#050607 calc(var(--u) / 6 - 1.8px) calc(var(--u) / 6 + 1.8px),transparent calc(var(--u) / 6 + 1.8px) calc(var(--u) / 3)) 50% 0/4px 100% no-repeat,linear-gradient(90deg,#5E656E,#C3C8CE 42%,#959CA4 70%,#4E555D)}

.placing .slot:hover{background:rgba(142,162,255,.3);cursor:copy}
.ritem{--fp-bg:linear-gradient(180deg,#363B42 0%,#262A30 46%,#1D2025 100%);--fp-ink:#E8EBEE;--fp-mute:#8F98A3;
  position:absolute;container:fp/inline-size;border-radius:2px;display:flex;align-items:center;gap:8px;padding:0 8px 0 9px;font:600 12.5px/1 var(--font);color:var(--fp-ink);cursor:pointer;white-space:nowrap;background:var(--fp-bg);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 -1px 0 rgba(0,0,0,.45),0 0 0 1px rgba(0,0,0,.6),0 2px 3px rgba(0,0,0,.35);transition:filter .15s}

  background:radial-gradient(circle at 50% 6px,#C8CDD2 0 1.5px,#5A6068 1.9px 2.6px,transparent 3px),radial-gradient(circle at 50% calc(100% - 6px),#C8CDD2 0 1.5px,#5A6068 1.9px 2.6px,transparent 3px),var(--fp-bg);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 0 0 1px rgba(0,0,0,.55)}

.ritem .rn{overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto;letter-spacing:.005em}
.ritem .rr{font:600 9.5px/1 var(--mono);flex:none;color:#1A1B1E;padding:2px 4px;border-radius:2px;background:linear-gradient(180deg,#FBFAF6,#E3E0D8);box-shadow:0 0 0 .5px rgba(0,0,0,.4)}
.ritem .dec{flex:1 1 0;min-width:0;height:100%;display:flex;align-items:center;justify-content:flex-end;gap:6px;overflow:hidden;padding:3px 0}

.dec .rj{flex:1 1 auto;max-width:210px;height:calc(var(--u) * .42);background:linear-gradient(90deg,#08090B 0 72%,transparent 72%) 0 0/calc(var(--u) * .5) 100% repeat-x;box-shadow:inset 0 -1px 0 rgba(255,255,255,.06)}
.dec .rj.r2{height:78%;background:linear-gradient(90deg,#08090B 0 72%,transparent 72%) 0 0/calc(var(--u) * .5) 42% repeat-x,linear-gradient(90deg,#08090B 0 72%,transparent 72%) 0 100%/calc(var(--u) * .5) 42% repeat-x}
.dec .sfp{width:42px;height:38%;background:linear-gradient(90deg,#A3AAB2 0 78%,transparent 78%) 0 0/10.5px 100% repeat-x}

.dec .lcd.amb{background:linear-gradient(180deg,#2A1E08,#3D2B0C);color:#FFC861;text-shadow:0 0 4px rgba(255,200,97,.7)}
.dec .keys{width:66px;height:62%;background:linear-gradient(90deg,#9EA5AD 0 70%,transparent 70%) 0 0/8.4px 44% repeat-x,linear-gradient(90deg,#9EA5AD 0 70%,transparent 70%) 0 100%/8.4px 44% repeat-x}
.alu .dec .keys{background:linear-gradient(90deg,#3B4047 0 70%,transparent 70%) 0 0/8.4px 44% repeat-x,linear-gradient(90deg,#3B4047 0 70%,transparent 70%) 0 100%/8.4px 44% repeat-x}
.dec .bays{flex:1 1 auto;max-width:150px;height:78%;background:linear-gradient(90deg,#121418 0 84%,transparent 84%) 0 0/16px 100% repeat-x;box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.dec .ssd{width:58px;height:46%;background:linear-gradient(90deg,#16191D 0 44%,transparent 44% 56%,#16191D 56%)}
.dec .slots{flex:1 1 auto;max-width:250px;height:84%;background:repeating-linear-gradient(90deg,#0D0F12 0 7px,#30353C 7px 8.5px)}
.dec .scr{width:70px;height:82%;border-radius:2px;background:#07120E;box-shadow:inset 0 0 0 1px #000,inset 0 0 10px rgba(80,255,160,.08);overflow:hidden}

.dec .sock{flex:1 1 auto;max-width:250px;height:62%;background:radial-gradient(circle at 50% 50%,#08090B 0 1px,transparent 1.5px) 0 0/14px 100% repeat-x,linear-gradient(90deg,#16181C 0 76%,transparent 76%) 0 0/14px 100% repeat-x;border-radius:1px}
.dec .pwr{width:9px;height:9px;border-radius:50%;box-shadow:inset 0 0 0 1.6px #9AA1A9,0 0 4px rgba(124,240,199,.4)}

.dec .knob{width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#A9B0B7,#3A3F45 70%);box-shadow:0 1px 1px rgba(0,0,0,.5)}

.ritem.acc .rn{color:var(--fp-mute);font-weight:500}

.rghost{position:absolute;left:2px;right:2px;border:2px dashed #8EA2FF;background:rgba(142,162,255,.18);border-radius:3px;pointer-events:none;z-index:3}
.side-body{position:relative;height:calc(var(--units) * var(--u));width:var(--w);background:repeating-linear-gradient(to top,#15181D 0 1px,#1C2027 1px var(--u));border-left:5px solid #9AA1A9;border-right:5px solid #5A6370}
.sbar{position:absolute;left:0;height:calc(var(--u) - 3px);border-radius:2px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 75%,#fff),color-mix(in srgb,var(--c) 70%,#1A1F26));box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.sres{position:absolute;height:calc(var(--u) - 3px);background:repeating-linear-gradient(45deg,rgba(255,255,255,.22) 0 3px,transparent 3px 7px)}

.side-legend{display:flex;justify-content:space-between;font:500 10.5px var(--mono);color:#8B94A0;margin-top:8px}

/* Synoptique */
.syn-wrap{position:relative;min-height:0;background:var(--canvas);overflow:hidden;touch-action:none}
#syn{width:100%;height:100%;display:block;cursor:grab;user-select:none;-webkit-user-select:none}
#syn.panning{cursor:grabbing}
#syn .gdot{fill:var(--dot)}
.node{filter:var(--node-shadow)}
.node .box{fill:var(--node-bg);stroke:var(--node-edge);stroke-width:1}
.node .hdr{fill:color-mix(in srgb,var(--c) 9%,var(--node-bg))}
.node .band{fill:var(--c)}
.node .sep{stroke:var(--line)}
.node .nled{fill:var(--c);filter:drop-shadow(0 0 3px var(--c))}
.node .nt{font:650 15px var(--font);fill:var(--fg)}
.node .ns{font:500 11px var(--mono);fill:var(--fg-3)}
.node .drag{cursor:move}
.ro .node .drag{cursor:default}
.node.sel .box{stroke:var(--accent);stroke-width:2.5}
.node.hl .box{stroke:var(--err);stroke-width:2.5}
.node.hl.info .box{stroke:var(--info)}
.port .ph{fill:transparent;cursor:crosshair}
.port .pr{fill:var(--node-bg);stroke:var(--c);stroke-width:2.4;cursor:crosshair}
.port .pc{fill:var(--c);opacity:0;transition:opacity .15s;pointer-events:none}
.port:hover .pc,.port.used .pc{opacity:1}
.port:hover .pr{fill:color-mix(in srgb,var(--c) 18%,var(--node-bg))}
.port.armed .pr{fill:var(--accent);stroke:var(--accent);stroke-width:3}
.port.armed .pc{fill:#fff;opacity:1}
.ro .port .pr,.ro .port .ph{cursor:default}
.port text{font:500 13px var(--font);fill:var(--fg-2);pointer-events:none}
.cable{color:var(--c)}
.cable .case{fill:none;stroke:var(--canvas);stroke-width:7;stroke-linejoin:round;stroke-linecap:round}
.cable .vis{fill:none;stroke:var(--c);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round;filter:var(--glow)}
.cable .hit{fill:none;stroke:transparent;stroke-width:16;cursor:pointer}
.cable.sel .vis{stroke-width:4.2}
.cable.hl .vis{stroke:var(--err);stroke-dasharray:8 5;stroke-width:3.2}
.cable.warnc .vis{stroke-dasharray:6 4}
.cable .lbl .tag{fill:url(#g-tag);stroke:var(--tag-edge);stroke-width:.8}
.cable .lbl .band{fill:var(--c)}
.cable .lbl text{font:600 11px var(--mono);fill:var(--tag-fg)}
.cable .lbl.none .tag{fill:var(--err-soft);stroke:var(--err);stroke-dasharray:3 2}
.cable .lbl.none text{fill:var(--err)}
.cable.sel .lbl .tag{fill:var(--fg);stroke:var(--fg)} .cable.sel .lbl text{fill:var(--surface)}
.cable.off{display:none}
#preview{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-dasharray:7 5;pointer-events:none}
.floatbar{position:absolute;left:max(14px,env(safe-area-inset-left,0px));bottom:14px;display:flex;gap:2px;align-items:center;background:var(--surface);border-radius:14px;padding:4px;box-shadow:var(--e2)}
.floatbar .zl{font:600 12.5px var(--mono);min-width:50px;text-align:center;color:var(--fg-2)}
.synhint{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:var(--surface);border-radius:999px;padding:8px 18px;font-size:14px;color:var(--fg-2);box-shadow:var(--e2);white-space:nowrap;max-width:calc(100% - 28px);overflow:hidden;text-overflow:ellipsis}

.vcounts{display:flex;gap:6px;flex-wrap:wrap}
.vitem{display:flex;gap:12px;padding:11px 8px;border:0;border-radius:10px;background:none;text-align:left;width:100%;align-items:flex-start;cursor:pointer;color:var(--fg)}

.ends{display:flex;flex-direction:column;gap:8px;font-size:14.5px}
.ends div{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px}
.ends span{color:var(--fg-3)}

/* ---------- Recette ---------- */
.rc-head{display:grid;grid-template-columns:auto minmax(0,1fr);gap:40px;align-items:center}
.ring{position:relative;width:168px;height:168px;border-radius:50%;display:grid;place-items:center;background:var(--sunken);box-shadow:var(--well)}
.ring::before{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--g);-webkit-mask:radial-gradient(circle,transparent 57%,#000 58%),repeating-conic-gradient(#000 0 5deg,transparent 5deg 6deg);-webkit-mask-composite:source-in;mask:radial-gradient(circle,transparent 57%,#000 58%) intersect,repeating-conic-gradient(#000 0 5deg,transparent 5deg 6deg)}
.ring::after{content:"";position:absolute;inset:34px;border-radius:50%;background:var(--surface);box-shadow:var(--e1)}
.ring div{position:relative;z-index:1;text-align:center}
.ring b{display:block;font:760 38px/1 var(--display);letter-spacing:-.04em}
.ring span{font:600 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3)}
.rc-counts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.rc-count{padding:14px 16px;border-radius:14px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line-soft)}
.rc-count span{font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);display:flex;align-items:center;gap:8px}
.rc-count b{display:block;font:760 52px/1 var(--display);letter-spacing:-.045em;font-variant-numeric:tabular-nums;margin-top:10px}
.rc-group{padding:18px 22px 6px}
.rc-group>header{display:flex;align-items:baseline;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.rc-group>header b{font:650 21px var(--display);letter-spacing:-.018em}
.rc-group>header .muted{margin-left:auto;font:600 12.5px var(--mono)}
.rc-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 20px;padding:15px 0;border-bottom:1px solid var(--line);align-items:center}
.rc-row:last-child{border-bottom:0}
.rc-main{display:flex;gap:14px;align-items:flex-start;min-width:0}
.rc-main .sw{margin-top:7px}
.rc-main b{font-weight:600}
.rc-main .path{color:var(--fg-2);font-size:15px;overflow-wrap:anywhere;margin-left:6px}
.rc-by{display:flex;align-items:center;gap:8px;margin-top:7px;font-size:13.5px;color:var(--fg-3);flex-wrap:wrap}
.stseg{display:inline-flex;padding:3px;gap:2px;border-radius:12px;background:var(--sunken);box-shadow:var(--well)}
.stseg button{display:inline-flex;align-items:center;gap:7px;border:0;background:none;height:34px;padding:0 13px;font-size:14px;font-weight:550;color:var(--fg-2);border-radius:9px;white-space:nowrap}
.stseg button::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--seg-off)}
.stseg button.ok::before{background:color-mix(in srgb,var(--led-g) 35%,var(--seg-off))}
.stseg button.res::before{background:color-mix(in srgb,var(--led-y) 35%,var(--seg-off))}
.stseg button.ko::before{background:color-mix(in srgb,var(--led-r) 35%,var(--seg-off))}
.stseg button:hover{color:var(--fg)}
.stseg button.on{background:var(--key-bg);color:var(--fg);font-weight:650;box-shadow:var(--key)}
.stseg button.on.ok::before{background:var(--led-g);box-shadow:0 0 8px var(--led-g)}
.stseg button.on.res::before{background:var(--led-y);box-shadow:0 0 8px var(--led-y)}
.stseg button.on.ko::before{background:var(--led-r);box-shadow:0 0 8px var(--led-r)}
.stseg button.on.todo::before{background:var(--fg-3)}
.rc-comment{grid-column:1/-1;display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:12px;background:var(--surface-2)}
.rc-comment div{display:flex;gap:8px;justify-content:flex-end}

/* ---------- Catalogue ---------- */
.cat-hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,520px);gap:24px;align-items:end}
.cat-stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.cat-stats span{display:inline-flex;align-items:baseline;gap:6px;padding:7px 12px;border-radius:10px;background:var(--surface);box-shadow:var(--e1);font-size:13.5px;color:var(--fg-3)}
.cat-stats b{font:650 15px var(--mono);color:var(--fg)}
.fp-stack{position:relative;display:flex;flex-direction:column;gap:3px;padding:16px 26px;border-radius:var(--r-xl);background:radial-gradient(120% 110% at 50% 0%,var(--stage-a),var(--stage-b));box-shadow:var(--e1);overflow:hidden}
.fp-stack .fpv{--u:22px}
.fpv{--u:16px;position:relative;display:block;padding:0 12px}
.fpv .ritem{position:relative;cursor:inherit;height:calc(var(--h) * var(--u))}
.fpv .ritem:hover{filter:none}
.fpv.half .ritem{width:52%}
.cat-name{display:flex;align-items:center;gap:14px;min-width:0}
.cat-name b{display:block;font-weight:600}
.cat-name span{font-size:13.5px;color:var(--fg-3)}
.cat-thumb{display:block;width:150px;flex:none;padding:6px 0;border-radius:8px}
.cat-thumb .fpv{--u:11px;padding:0 9px}
.cat-thumb .fpv .ritem{font-size:0;padding:0 5px;gap:4px}
.cat-thumb .fpv .ritem .rn,.cat-thumb .fpv .ritem .rr{display:none}
.ports{display:flex;gap:4px 10px;flex-wrap:wrap}
.pchip{display:inline-flex;align-items:center;gap:4px;font:600 12.5px var(--mono);color:var(--fg-2)}
.pchip .cx{width:18px;height:18px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
.ccard{display:flex;flex-direction:column;border:0;padding:0;text-align:left;background:var(--surface);border-radius:20px;box-shadow:var(--e1);overflow:hidden;color:var(--fg);transition:transform .22s var(--ease),box-shadow .22s var(--ease)}
.ccard:hover{transform:translateY(-3px);box-shadow:var(--e2)}
.cc-vis{position:relative;display:flex;align-items:center;justify-content:center;min-height:132px;padding:22px 10px;background:radial-gradient(120% 110% at 50% 0%,var(--stage-a),var(--stage-b));box-shadow:inset 0 -1px 0 var(--line-soft)}
.cc-vis .fpv{--u:19px;width:100%}
.cc-vis .fpv .ritem{font-size:10.5px}
.cc-vis .fpv .ritem .rr{display:none}
.cc-vis .fam{position:absolute;left:12px;top:10px}
.cc-vis .use{position:absolute;right:12px;top:10px;font:600 11px var(--mono);color:var(--fg-3)}
.cc-body{display:flex;flex-direction:column;gap:4px;padding:14px 16px 16px}
.cc-body .cc-name{font:660 19px/1.15 var(--display);letter-spacing:-.018em}
.cc-body .cc-brand{color:var(--fg-3);font-size:13.5px}
.cc-specs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 8px}
.cc-specs span{font:600 12px var(--mono);padding:4px 8px;border-radius:7px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line-soft);color:var(--fg-2)}
.desk-unit{display:block;width:84%;max-width:280px;height:64px;margin:0 auto;border-radius:8px;background:linear-gradient(180deg,#30353C,#1E2125);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 0 0 1px rgba(0,0,0,.6),0 10px 18px -8px rgba(0,0,0,.5);position:relative;overflow:hidden}
.desk-unit::before{content:"";position:absolute;left:10px;right:10px;top:9px;height:14px;background:radial-gradient(circle,var(--c) 0 2px,transparent 2.5px) 0 0/12px 7px repeat-x,radial-gradient(circle,#9AA1A9 0 2px,transparent 2.5px) 6px 7px/12px 7px repeat-x}
.desk-unit::after{content:"";position:absolute;left:10px;right:10px;bottom:8px;height:28px;background:linear-gradient(180deg,transparent 30%,#E6E8EA 30% 46%,transparent 46%) 0 0/12px 100% repeat-x,linear-gradient(90deg,transparent 45%,#08090B 45% 55%,transparent 55%) 0 0/12px 100% repeat-x}
.dup{background:var(--warn-soft);border-radius:12px;padding:12px 14px;font-size:14px;display:flex;flex-direction:column;gap:4px;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--warn) 25%,transparent)}
.dup b{color:var(--warn)}
.faceprev{position:relative;border-radius:16px;padding:30px 18px 44px;background:radial-gradient(120% 110% at 50% 0%,var(--stage-a),var(--stage-b));box-shadow:inset 0 0 0 1px var(--line-soft)}
.faceprev .fpv{--u:26px;padding:0 14px}
.faceprev .fpv .ritem .rr{display:none}
.cote{position:absolute;display:flex;align-items:center;justify-content:center;font:600 11px var(--mono);color:var(--fg-3)}
.cote.h{left:32px;right:32px;bottom:12px;height:16px;border-left:1px solid var(--fg-4);border-right:1px solid var(--fg-4)}
.cote.h::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--fg-4)}
.cote.h span{position:relative;padding:0 8px;background:var(--stage-b);border-radius:4px}
.cote.v{right:2px;top:30px;width:16px;border-top:1px solid var(--fg-4);border-bottom:1px solid var(--fg-4)}

/* ---------- Administration ---------- */
.adm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.sys-card{display:flex;flex-direction:column;gap:16px}
.sys-card header{display:flex;align-items:center;gap:12px}
.sys-card .si{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:var(--fg-2);background:var(--key-bg);box-shadow:var(--key);flex:none}
.sys-card header b{display:block;font:650 20px var(--display);letter-spacing:-.015em} .sys-card header span{font-size:13.5px;color:var(--fg-3)}
.copyline{display:flex;gap:10px;align-items:center;padding:5px 5px 5px 16px;border-radius:14px;background:var(--sunken);box-shadow:var(--well);margin-top:14px}
.copyline code{font:600 15px var(--mono);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ota{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:40px;margin-top:16px}
.ver{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.ver b{font:760 72px/1 var(--display);letter-spacing:-.05em}
.notes{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:15px;color:var(--fg-2)}
.steps{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column}
.steps li{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:14px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);font-size:15px;color:var(--fg-3)}
.steps li.done{color:var(--fg)} .steps li.act{color:var(--fg);font-weight:600}
.steps .st-i{width:20px;height:20px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--line-2)}
.steps li.done .st-i{box-shadow:0 0 8px color-mix(in srgb,var(--led-g) 60%,transparent);background:var(--ok);display:grid;place-items:center;color:#fff}
.steps li.done .st-i .ic{width:13px;height:13px;stroke-width:3}
.drop{border:1.5px dashed var(--line-2);border-radius:16px;padding:28px;text-align:center;color:var(--fg-3);font-size:15px;display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:14px;background:var(--surface-2)}

/* ---------- Préparation & réseau ---------- */
.scanbox{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:36px;align-items:end}
.scanbox .eyebrow{margin-bottom:10px}
.scanbox .vu{width:100%;height:14px}
.scan-big{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.scan-big b{font:760 76px/.95 var(--display);letter-spacing:-.05em}
.scan-big span{font-size:16px;color:var(--fg-2)}
.scan-f{display:flex;flex-direction:column;gap:10px;min-width:0}
.scan-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.scan-row .input{flex:1;min-width:200px;font-size:20px;height:54px;font-weight:600}
.scan-vis{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.barcode{width:132px;height:44px;border-radius:6px;background:linear-gradient(90deg,#fff 0 8px,transparent 8px calc(100% - 8px),#fff calc(100% - 8px)),repeating-linear-gradient(90deg,#141518 0 2px,#fff 2px 3px,#141518 3px 4px,#fff 4px 7px,#141518 7px 10px,#fff 10px 11px,#141518 11px 12px,#fff 12px 15px);box-shadow:0 0 0 1px rgba(0,0,0,.12),0 4px 10px -4px rgba(0,0,0,.3);position:relative;flex:none}
.barcode::after{content:"";position:absolute;left:-4px;right:-4px;top:50%;height:2px;background:#FF3B2F;box-shadow:0 0 8px #FF3B2F;animation:scanl 2.2s ease-in-out infinite}
@keyframes scanl{0%,100%{transform:translateY(-14px)}50%{transform:translateY(14px)}}
#scanMsg:empty{display:none}
.hf-in{width:130px;font-family:var(--mono)}
.spectrum{display:block;width:100%;height:auto;margin:6px 0 4px}
.spectrum .ax{stroke:var(--line-2);stroke-width:1}
.spectrum .gr{stroke:var(--line);stroke-width:1}
.spectrum text{font:600 10.5px var(--mono);fill:var(--fg-3)}
.spectrum .pk{stroke-width:1.6;fill-opacity:.16}
.spectrum .cf{fill:var(--err);fill-opacity:.14;stroke:var(--err);stroke-dasharray:3 2}
.spectrum .lb{font:600 10.5px var(--font);fill:var(--fg-2)}

/* Plan */
#plan{width:100%;height:100%;display:block;cursor:grab;user-select:none;-webkit-user-select:none}
#plan.panning{cursor:grabbing}
#plan .pl-grid{fill:none;stroke:var(--line);stroke-width:.06}
#plan .pl-wall{fill:var(--surface);stroke:var(--fg);stroke-width:2.5;vector-effect:non-scaling-stroke}
#plan .pl-trib{fill:var(--sunken)}
#plan .pl-court{fill:color-mix(in srgb,#C89B5A 22%,var(--surface));stroke:var(--fg-3);stroke-width:1.2;vector-effect:non-scaling-stroke}
#plan .pl-line{fill:none;stroke:var(--fg-3);stroke-width:1;vector-effect:non-scaling-stroke}
#plan .pl-door{fill:var(--surface)}
#plan .pl-lbl{font:500 1.6px var(--font);fill:var(--fg-3)}
#plan .pl-lbl.sm{font-size:1.2px}
#plan .obj{cursor:pointer}
#plan .obj .shape{fill:var(--node-bg);stroke:var(--c);stroke-width:2;vector-effect:non-scaling-stroke}
#plan .obj.cont .shape{fill:color-mix(in srgb,var(--fg) 10%,var(--surface))}
#plan .obj.sel .shape{stroke:var(--accent);stroke-width:3.5}
#plan .cone{fill:color-mix(in srgb,var(--sig-v) 13%,transparent);stroke:color-mix(in srgb,var(--sig-v) 55%,transparent);stroke-width:1;vector-effect:non-scaling-stroke}
#plan .obj.sel .cone{fill:color-mix(in srgb,var(--accent) 18%,transparent)}
#plan .pl-name{font:600 1.5px var(--font);fill:var(--fg);pointer-events:none}
#plan .pl-sym{font:700 1.05px var(--font);fill:var(--c);pointer-events:none}
#plan .route path{fill:none;stroke:var(--c);stroke-width:3;stroke-linejoin:round;vector-effect:non-scaling-stroke;filter:var(--glow);color:var(--c)}
#plan .route rect{fill:url(#g-tag);stroke:var(--tag-edge);stroke-width:1;vector-effect:non-scaling-stroke}
#plan .route text{font:600 1.3px var(--mono);fill:var(--tag-fg)}
.scalebar{display:inline-flex;align-items:center;gap:6px;font:600 12px var(--mono);color:var(--fg-2);padding:0 10px 0 6px}
.scalebar i{display:inline-block;height:6px;border:1.5px solid var(--fg);border-top:0}
.lenrow{display:flex;align-items:flex-start;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.lenrow>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.lenrow b{font-weight:600}
.lenrow span{font-size:13px;color:var(--fg-3)}
.lenrow strong{font-size:17px;font-weight:600;white-space:nowrap}
.pane h2 .small{font-family:var(--font);font-weight:500;letter-spacing:0}
input[type=range]{accent-color:var(--accent);width:100%}
#plan .zrect{fill:color-mix(in srgb,var(--fg) 3%,transparent);stroke:var(--fg-3);stroke-width:1.2;stroke-dasharray:6 4;vector-effect:non-scaling-stroke}
#plan .zone.sel .zrect{stroke:var(--accent);stroke-width:2}
#plan .zlbl{font:600 1.7px var(--display);fill:var(--fg-2);letter-spacing:-.02px}
#plan .blk .shape{fill:var(--node-bg);stroke:var(--node-edge);stroke-width:1.4}
#plan .blk.sel .shape{stroke:var(--accent);stroke-width:3}
#plan .blbl{font:600 1.45px var(--font);fill:var(--fg);pointer-events:none}
#plan .slink .vis{fill:none;stroke:var(--c);stroke-width:2.2;vector-effect:non-scaling-stroke}
#plan .slink .hit{fill:none;stroke:transparent;stroke-width:14;vector-effect:non-scaling-stroke;cursor:pointer}
#plan .slink polygon{fill:var(--c)}
#plan .slink.sel .vis{stroke-width:4}
#plan .slink rect{fill:url(#g-tag);stroke:var(--tag-edge);stroke-width:1;vector-effect:non-scaling-stroke}
#plan .slink text{font:600 1.2px var(--mono);fill:var(--tag-fg)}
#plan .truss{stroke:var(--fg-2);stroke-width:5;stroke-dasharray:2 2;vector-effect:non-scaling-stroke}
#plan .beam{fill:color-mix(in srgb,var(--sig-l) 14%,transparent);stroke:color-mix(in srgb,var(--sig-l) 42%,transparent);stroke-width:1;vector-effect:non-scaling-stroke}
#plan .fx .shape{fill:var(--node-bg);stroke:var(--sig-l);stroke-width:2.2}
#plan .fx.conf .shape{stroke:var(--err);stroke-width:3}
#plan .fx.sel .shape{stroke:var(--accent);stroke-width:3.5}
#plan .fx .pl-sym{fill:var(--fg);font-size:1.15px}
#plan .fxl{font:600 1.3px var(--mono);fill:var(--fg-2);pointer-events:none}
#plan .fx.conf .fxl{fill:var(--err)}

/* ---------- Superpositions ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .2s;z-index:55;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:8px;right:8px;bottom:8px;width:min(540px,calc(100% - 16px));background:var(--surface);border-radius:22px;box-shadow:var(--e3);transform:translateX(calc(100% + 24px));transition:transform .3s var(--ease);z-index:60;display:flex;flex-direction:column;overflow:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer:not(.open){box-shadow:none;visibility:hidden;transition:transform .3s var(--ease),visibility 0s .3s}
.drawer.open{transform:none}
.drawer>header{display:flex;align-items:flex-start;gap:12px;padding:26px 26px 18px}
.drawer>header>div{flex:1;min-width:0}
.drawer>header .eyebrow{margin-bottom:8px}
.drawer>header h2{font-size:32px;line-height:1.04;letter-spacing:-.032em;font-weight:720}
.drawer .dbody{flex:1;overflow:auto;padding:4px 26px 26px;display:flex;flex-direction:column;gap:24px}
.drawer>footer{display:flex;gap:8px;justify-content:flex-end;padding:14px 26px;border-top:1px solid var(--line);flex-wrap:wrap;background:var(--surface-2)}
.modal{position:fixed;inset:0;background:var(--scrim);z-index:70;display:flex;align-items:flex-start;justify-content:center;padding-block:max(8vh,calc(env(safe-area-inset-top,0px) + 16px)) 16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:auto;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.dialog{width:min(700px,100%);background:var(--surface);border-radius:24px;box-shadow:var(--e3);overflow:hidden;animation:pop .24s var(--ease)}
@keyframes pop{from{transform:translateY(10px) scale(.985);opacity:0}}
.wz-head{padding:22px 28px 0;display:flex;flex-direction:column;gap:14px}
.wz-head .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.wz-head .eyebrow{margin:0}
.wz-body{padding:24px 28px 28px;display:flex;flex-direction:column;gap:20px;min-height:250px}
.wz-body h2{font-size:36px;line-height:1.04;letter-spacing:-.035em;font-weight:720}
.wz-foot{display:flex;justify-content:space-between;gap:8px;padding:16px 28px;border-top:1px solid var(--line);background:var(--surface-2)}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.choice{border:0;border-radius:18px;padding:16px 18px 18px;text-align:left;background:var(--key-bg);box-shadow:var(--key);display:flex;flex-direction:column;gap:5px;color:var(--fg);transition:box-shadow .15s,transform .15s}
.choice:hover{transform:translateY(-2px)}
.choice.on{box-shadow:var(--key),0 0 0 2.5px var(--fg)}
.choice[disabled]{opacity:.35;cursor:not-allowed;transform:none}
.choice b{font:650 21px var(--display);letter-spacing:-.015em} .choice span{font-size:14.5px;color:var(--fg-3)}
.choice .ic{width:26px;height:26px;margin-bottom:8px}
.choice .ch-vis{display:block;margin:-6px -8px 6px;border-radius:12px;background:radial-gradient(120% 100% at 50% 0%,var(--vis-a),var(--vis-b));padding:6px 10px 0;box-shadow:inset 0 0 0 1px var(--line-soft)}
.recap{display:flex;flex-direction:column}
.recap button{display:grid;grid-template-columns:140px minmax(0,1fr) auto;gap:14px;padding:13px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;font-size:15.5px;align-items:center;color:var(--fg)}
.recap button:hover b{text-decoration:underline;text-underline-offset:4px}
.recap span{color:var(--fg-3)}
.recap b{font-weight:600}
.recap .ic{color:var(--fg-3);width:16px;height:16px}
.creating{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:14px}
.creating li{display:flex;align-items:center;gap:12px;font-size:17px}
.creating .ok{color:var(--ok)}
.pal-in{display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line)}
.pal-in input{border:0;background:none;outline:none;font-size:19px;flex:1;min-width:0}
.pal-list{max-height:min(460px,60vh);overflow:auto;padding:8px}
.pal-item{display:flex;align-items:center;gap:14px;padding:11px 14px;border-radius:12px;width:100%;border:0;background:none;text-align:left;font-size:15.5px;color:var(--fg)}
.pal-item.on{background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}

}
/* Galvanomètre façon VU-mètre (0–100 %), zone d'objectif ≥ 90 % */
function gauge(p){
 const C=[64,70],R=54,pt=(v,r)=>{const a=Math.PI*(1+v/100);return[+(C[0]+r*Math.cos(a)).toFixed(1),+(C[1]+r*Math.sin(a)).toFixed(1)]};
 let t='';for(let i=0;i<=20;i++){const[x1,y1]=pt(i*5,i%5?R-5:R-9),[x2,y2]=pt(i*5,R);t+=`<line class="tk ${i%5?'':'mj'}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`}
 const[a1,b1]=pt(90,R-2.5),[a2,b2]=pt(100,R-2.5),l0=pt(0,R-17),l5=pt(50,R-18),l1=pt(100,R-17);
 const rot=((Math.min(100,Math.max(0,p))-50)*1.8).toFixed(1);
 return `<svg class="gauge" viewBox="0 0 128 78" role="img" aria-label="${p} %"><rect class="face" x=".5" y=".5" width="127" height="77" rx="10"/><path class="zone" d="M${a1} ${b1}A${R-2.5} ${R-2.5} 0 0 1 ${a2} ${b2}"/>${t}<text x="${l0[0]}" y="${l0[1]-1}" text-anchor="middle">0</text><text x="${l5[0]}" y="${l5[1]+5}" text-anchor="middle">50</text><text x="${l1[0]}" y="${l1[1]-1}" text-anchor="middle">100</text><text class="u" x="64" y="58" text-anchor="middle">%</text><line class="ndl" x1="64" y1="70" x2="64" y2="20" style="transform:rotate(${rot}deg)"/><circle class="hub" cx="64" cy="70" r="4.5"/></svg>`;
}

/* Planning des 30 prochains jours : préparation hachurée, tournage plein, mise en service en losange */
function plan30(){
 const N=30,W=100/N,off=d=>Math.round((new Date(d+'T12:00:00')-TODAY)/86400000),f3=x=>+x.toFixed(3);
 const list=PROJ.filter(p=>!['Terminé','Annulé'].includes(p.statut)).filter(p=>{const a=off(p.plan[0]),b=off(p.plan[1]),k=off(p.date);return (a<N&&b>=0)||(k>=0&&k<N)}).sort((a,b)=>a.date.localeCompare(b.date));
 const st=[];let last=0;const seg=(c,a,b)=>{a=f3(a);b=f3(b);if(a>last)st.push(`transparent ${last}% ${a}%`);st.push(`${c} ${a}% ${b}%`);last=b};
 const ticks=[];let mo=TODAY.getMonth();
 for(let d=0;d<N;d++){const dt=new Date(TODAY.getTime()+d*86400000),wd=dt.getDay();
  if(wd===0&&d===0)seg('var(--wk-c)',0,W);
  if(wd===1&&d>0){seg('var(--line-2)',d*W,d*W+.12);ticks.push(`<span style="left:${f3(d*W)}%">${dt.getMonth()!==mo?dt.toLocaleDateString('fr-FR',{day:'numeric',month:'short'}):'lun. '+dt.getDate()}</span>`);mo=dt.getMonth()}
  if(wd===6)seg('var(--wk-c)',d*W,Math.min(N,d+2)*W);}
 if(last<100)st.push(`transparent ${last}% 100%`);
 const rows=list.map(p=>{
  const k=off(p.date),dj=days(p.date),a=off(p.plan[0]),b=off(p.plan[1])+1,pa=Math.max(0,a),pb=Math.min(N,b);let bars='';
  if(pb>pa)bars+=`<i class="tl-plan ${a<0?'cl':''} ${b>N?'cr':''}" style="left:${f3(pa*W)}%;width:${f3((pb-pa)*W)}%"></i>`;
  if(p.inter==='Prestation'){const e=off(p.date2||p.date)+1,sa=Math.max(0,k),sb=Math.min(N,e);if(sb>sa)bars+=`<i class="tl-shoot" style="left:${f3(sa*W)}%;width:${f3((sb-sa)*W)}%" title="Tournage"></i>`}
  else if(k>=0&&k<N)bars+=`<i class="tl-ms" style="left:${f3((k+.5)*W)}%" title="Mise en service"></i>`;
  const dt=new Date(p.date+'T12:00:00');
  return `<button class="tl-row" data-proj="${p.id}" style="--c:var(${ST[p.statut]})"><span class="tl-lab"><span class="r-date"><b>${dt.getDate()}</b><span>${dt.toLocaleDateString('fr-FR',{month:'short'})}</span></span><span class="r-main"><b>${esc(p.nom)}</b><span>${p.inter==='Prestation'?'Tournage':'Mise en service'} · ${esc(p.lieu)}</span></span><span class="r-j ${dj<=7?'urg':dj<=14?'soon':''}">J-${dj}</span></span><span class="tl-track">${bars}</span></button>`;
 }).join('');
 return `<div class="tl" style="--wk:linear-gradient(90deg,${st.join(',')})"><div class="tl-head" aria-hidden="true"><span></span><span class="tl-ticks"><span class="now" style="left:0">Auj. ${TODAY.getDate()} ${TODAY.toLocaleDateString('fr-FR',{month:'short'})}</span>${ticks.join('')}</span></div>${rows}</div>`;
}
/* Spectre HF : porteuses par lieu, conflits encadrés */
function spectrum(){
 const f0=604,f1=616,Wd=640,H=128,X=f=>24+(f-f0)/(f1-f0)*(Wd-48),base=H-26;
 const LC={'Bord terrain':'var(--sig-a)','Cabine commentateurs':'var(--sig-v)'};
 let s=`<svg class="spectrum" viewBox="0 0 ${Wd} ${H}" role="img" aria-label="Spectre de ${f0} à ${f1} MHz : porteuses HF et conflits">`;
 for(let f=f0;f<=f1;f+=2)s+=`<line class="gr" x1="${X(f)}" x2="${X(f)}" y1="12" y2="${base}"/><text x="${X(f)}" y="${H-8}" text-anchor="middle">${f}</text>`;
 HF.forEach((h,i)=>{const c=hfConf(i),j=c?HF.indexOf(c):-1;if(c&&i<j){const a=parseFloat(h.f),b=parseFloat(c.f);s+=`<rect class="cf" x="${X(Math.min(a,b))-9}" y="10" width="${Math.abs(X(a)-X(b))+18}" height="${base-10}" rx="5"/>`}});
 HF.forEach((h,i)=>{const f=parseFloat(h.f);if(f<f0||f>f1)return;const x=X(f),c=LC[h.lieu]||'var(--fg-3)',top=i%2?40:28;
  s+=`<path class="pk" d="M${(x-11).toFixed(1)} ${base}C${(x-4).toFixed(1)} ${base} ${(x-3).toFixed(1)} ${top} ${x.toFixed(1)} ${top}S${(x+4).toFixed(1)} ${base} ${(x+11).toFixed(1)} ${base}" style="stroke:${c};fill:${c}"/><text class="lb" x="${x.toFixed(1)}" y="${top-6}" text-anchor="middle">${esc(h.eq.replace('Micro ','').replace('main HF','Main').replace('cravate','Crav.').replace('commentateur','Comm.'))}</text>`});
 s+=`<line class="ax" x1="24" x2="${Wd-24}" y1="${base}" y2="${base}"/></svg>`;
 const out=HF.filter(h=>{const f=parseFloat(h.f);return f<f0||f>f1});
 return s+`<div class="tl-legend"><span><i class="sw" style="--c:var(--sig-a)"></i>Bord terrain</span><span><i class="sw" style="--c:var(--sig-v)"></i>Cabine commentateurs</span>${out.length?`<span>Hors fenêtre : ${out.map(h=>`${esc(h.eq)} · ${h.f.replace('.',',')} MHz`).join(', ')}</span>`:''}</div>`;
}

function rcBody(){

 if(o.phase==='idle') return `<section class="card"><div class="card-head"><h2>Mise à jour OTA</h2><span class="chip accent">${ic('download')}Disponible</span></div>
  <div class="ota"><div style="display:flex;flex-direction:column;gap:12px"><div class="ver"><b>${o.next}</b><span class="muted">canal ${o.canal} · publiée le 9 novembre 2026</span></div>
   <ul class="notes"><li>Synoptique : tracé multi-câbles vers des ports consécutifs.</li><li>Recette : journal par point exportable dans le procès-verbal.</li><li>Moteur : validation du câblage 3× plus rapide sur les projets de plus de 1 000 câbles.</li><li>Format de stockage enrichi de façon additive : retour à 1.4.2 possible.</li></ul></div>
   <div style="display:flex;flex-direction:column;gap:10px"><dl class="kv"><dt>Installée</dt><dd>${o.cur}</dd><dt>Taille</dt><dd>41,8 Mo</dd><dt>Interruption</dt><dd>≈ 20 secondes</dd><dt>Utilisateurs prévenus</dt><dd>4 connectés</dd></dl>
   <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:auto"><button class="btn primary" data-act="otarun">${ic('download','sm')}Installer maintenant</button><button class="btn" data-act="otanight">${ic('clock','sm')}Cette nuit à 03:30</button></div></div></div></section>`;
 return `<section class="card"><div class="card-head"><h2>Installation de ${o.next}</h2>${o.phase==='done'?`<span class="chip ok">${ic('ok')}Terminée</span>`:'<span class="chip accent">En cours</span>'}</div>
  <ol class="steps">${OTA_STEPS.map((s,i)=>{const st=o.phase==='done'||i<o.step?'done':i===o.step?'act':'';return `<li class="${st}">${st==='done'?`<span class="st-i">${ic('ok')}</span>`:st==='act'?'<span class="spinner"></span>':'<span class="st-i"></span>'}<span>${s}</span><span class="mono small muted">${i===0&&st==='act'?o.pct+' %':''}</span></li>`}).join('')}</ol>

}

function routePts(r){const a=pobj(r.a),b=pobj(r.b);return [[a.x,a.y],...r.pts,[b.x,b.y]]}
function routeLen(r){const P=routePts(r);let d=0;for(let i=1;i<P.length;i++)d+=Math.hypot(P[i][0]-P[i-1][0],P[i][1]-P[i-1][1]);return{plan:d,up:r.up,tot:Math.ceil((d+r.up)*10)/10}}
function cone(o){const R=14,a1=(o.dir-o.fov/2)*Math.PI/180,a2=(o.dir+o.fov/2)*Math.PI/180;return `M${o.x} ${o.y}L${(o.x+R*Math.cos(a1)).toFixed(2)} ${(o.y+R*Math.sin(a1)).toFixed(2)}A${R} ${R} 0 0 1 ${(o.x+R*Math.cos(a2)).toFixed(2)} ${(o.y+R*Math.sin(a2)).toFixed(2)}Z`}
function cartoSvg(){
 const L=PLAN.lay;let s=`<rect class="pl-wall" x="0" y="0" width="70" height="46"/>
 <rect class="pl-trib" x="10" y="1" width="50" height="7.5"/><text class="pl-lbl" x="47" y="5.4" text-anchor="middle">Tribune presse</text>
